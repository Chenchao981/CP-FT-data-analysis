    const canvas = this.$('mvCanvas0');
    canvas.style.width = '100%'; canvas.style.height = '420px';
    canvas.parentElement.style.backgroundColor = '#ffffff';
    const MAX = 8000;
    const sample = (arr, max) => {
      if (arr.length <= max) return arr;
      const r = []; const step = arr.length / max;
      for (let j = 0; j < max; j++) r.push(arr[Math.floor(j * step)]);
      return r;
    };
    const datasets = [];
    lots.forEach((l, li) => {
      const lrecs = recs.filter(r => r._Lot === l);
      const c = lotColor[l];
      // 一个批次一根线：所有选中参数的值按(参数→片号)顺序连成一条线，X=批次序号
      // 相同(参数,值)的点聚合，重复越多点越粗
      const cnt = new Map();
      selParams.forEach(p => {
        lrecs.forEach(r => {
          const y = +r[p];
          if (!isNaN(y)) {
            const k = p + '|' + y;
            cnt.set(k, (cnt.get(k) || 0) + 1);
          }
        });
      });
      if (!cnt.size) return;
      const pts = [];
      cnt.forEach((c2, k) => {
        const sp = k.split('|');
        pts.push({x: li, y: parseFloat(sp[1]), p: sp[0], c: c2});
      });
      const s = sample(pts, MAX);
      datasets.push({
        label: l, data: s, showLine: true, fill: false, tension: 0,
        borderColor: c, backgroundColor: c.replace(')', ',0.45)').replace('rgb','rgba'),
        pointRadius: ctx => { const c2 = ctx.raw.c || 1; return 1.5 + Math.min(6, Math.log2(c2)) * 1.3; },

    // Max/Min 水平线（与散点图 UCL/LCL 同样式）
    let mvYmin = Infinity, mvYmax = -Infinity;
    datasets.forEach(ds => ds.data.forEach(p => {

    }));
    if (lots.length > 0) {

      } });
      if (mvSpecLo != null || mvSpecHi != null) {
        if (mvSpecHi != null) datasets.push({label: 'Max Limit=' + mvSpecHi + (mvUnit ? ' ' + mvUnit : ''), data: [{x: xA, y: mvSpecHi}, {x: xB, y: mvSpecHi}], borderColor: 'red', borderWidth: 1.5, borderDash: [5, 3], pointRadius: 0, showLine: true, fill: false});
        if (mvSpecLo != null) datasets.push({label: 'Min Limit=' + mvSpecLo + (mvUnit ? ' ' + mvUnit : ''), data: [{x: xA, y: mvSpecLo}, {x: xB, y: mvSpecLo}], borderColor: 'red', borderWidth: 1.5, borderDash: [5, 3], pointRadius: 0, showLine: true, fill: false});
      } else if (isFinite(mvYmin) && mvYmin !== mvYmax) {
        datasets.push({label: 'Max=' + mvYmax.toFixed(4), data: [{x: xA, y: mvYmax}, {x: xB, y: mvYmax}], borderColor: 'red', borderWidth: 1.5, borderDash: [5, 3], pointRadius: 0, showLine: true, fill: false});
        datasets.push({label: 'Min=' + mvYmin.toFixed(4), data: [{x: xA, y: mvYmin}, {x: xB, y: mvYmin}], borderColor: 'red', borderWidth: 1.5, borderDash: [5, 3], pointRadius: 0, showLine: true, fill: false});
      }

      min: isNaN(yMinV) ? undefined : yMinV, max: isNaN(yMaxV) ? undefined : yMaxV
    };
    const lotLabels = lots.slice();
    this.charts['mv0'] = new ChartJS(canvas.getContext('2d'), {
      type: 'line', data: {datasets: datasets},
      options: {responsive: true, maintainAspectRatio: false, animation: false,
        plugins: {legend: {labels: {color: '#333', boxWidth: 8, font: {size: 9}}},
          tooltip: {callbacks: {label: ctx => { const r = ctx.raw; return ' ' + (r.p || '') + ' : ' + r.y + ' (芯片x' + (r.c || 1) + ')'; }}}},
        scales: {x: {type: 'linear', offset: true, min: 0, max: Math.max(1, lots.length - 1), title: {display: true, text: '批次', color: '#333'}, ticks: {color: '#333', stepSize: 1, callback: function(v) { return lotLabels[Math.round(v)] || ''; }, autoSkip: false, maxRotation: 0}, grid: {color: '#e0e0e0'}},
          y: yScale}}
    });
  }

      params.map(p => '<span class="vt-sg-tag" data-p="' + p.replace(/"/g,'&quot;') + '" style="cursor:pointer;border:1px solid rgba(47,111,237,.4);border-radius:4px;padding:1px 8px;color:#2f6fed;' + (this._sgHidden.has(p) ? 'text-decoration:line-through;opacity:.4;' : '') + '">' + p + '</span>').join('') +
      '</div><canvas id="' + this.id + '-sgCanvas0"></canvas>';

        this._drawSingle();
      };

    const canvas = this.$('sgCanvas0');
    canvas.style.width = '100%'; canvas.style.height = '420px';

    const MAX = 5000;
    const sample = (arr, max) => {
      if (arr.length <= max) return arr;
      const r = []; const step = arr.length / max;
      for (let j = 0; j < max; j++) r.push(arr[Math.floor(j * step)]);
      return r;
    };
    const datasets = [];
    lots.forEach((l, li) => {
      const lrecs = recs.filter(r => r._Lot === l);
      const offset = li * 0.4; // 多批次时 X 轴错开，避免片号重叠

    const yMinV = parseFloat(this.$('sgYMin').value), yMaxV = parseFloat(this.$('sgYMax').value);
    const yScale = {

        plugins: {legend: {labels: {color: '#333', boxWidth: 8, font: {size: 9}}},

    container.innerHTML = '';
    var div = document.createElement('div'); div.className = 'vt-chart';
    var title = yp + (lot !== '全部批次' ? ' | ' + lot : '') + (wf !== '全部圆片' ? ' | ' + wf : '');
    div.innerHTML = '<h3>' + title + '</h3><canvas id="' + this.id + '-scCanvas0"></canvas>';
    container.appendChild(div);
    var self = this;

    // 多批次颜色：全部批次时（不管是否选圆片）
    if (lot === '全部批次') {
      var lots = [...new Set(recs.map(function(r) { return r._Lot; }).filter(Boolean))].sort();
      var colors = ['#4dabf7','#e74c3c','#2ecc71','#f39c12','#9b59b6','#1abc9c','#e67e22','#3498db','#e91e63','#00bcd4'];
      setTimeout(function() { self._drawMultiLotScatter(0, yp, recs, lots, colors); }, 30);
    } else {
      setTimeout(function() { self._drawOneScatter(0, yp, recs, lot, wf); }, 30);
    }
  }

  _drawMultiLotScatter(i, yp, recs, lots, colors) {
    if (!ChartJS) return;
    var canvas = this.$('scCanvas' + i);
    if (!canvas) return;
    canvas.style.width = '100%'; canvas.style.height = '400px';
    canvas.parentElement.style.backgroundColor = '#ffffff';
    var MAX = 5000;
    var sample = function(arr, max) {
      if (arr.length <= max) return arr;
      var r = []; var step = arr.length / max;
      for (var j = 0; j < max; j++) r.push(arr[Math.floor(j * step)]);
      return r;
    };
    var datasets = [];
    var allPts = [];
    var globalOffset = 0;
    lots.forEach(function(l, li) {
      var lrecs = recs.filter(function(r) { return r._Lot === l; });
      // 按圆片号排序(1→25)
      lrecs.sort(function(a, b) {
        var wa = parseInt(a._Wafer) || 0, wb = parseInt(b._Wafer) || 0;
        return wa - wb;
      });
      var pts = []; lrecs.forEach(function(r, idx) { var y = +r[yp]; if (!isNaN(y)) pts.push({x: globalOffset + idx, y: y}); });
      globalOffset += pts.length;
      var s = sample(pts, Math.floor(MAX / lots.length));
      if (s.length > 0) {
        datasets.push({label: l, data: s, backgroundColor: colors[li % colors.length].replace(')', ',0.3)').replace('rgb', 'rgba'), borderColor: colors[li % colors.length], pointRadius: 2});
        allPts = allPts.concat(s);
      }
    });
    // UCL/LCL：优先取文件规格标准值(SPEC_LIMITS)，无规格时回退 mean±3σ
    if (allPts.length > 5) {
      var yVals = allPts.map(function(p) { return p.y; });
      var scProd2 = this.data[0] ? this.data[0]._Product : '';
      var scSpec2 = (scProd2 && SPEC_LIMITS[scProd2] && SPEC_LIMITS[scProd2][yp]) ? SPEC_LIMITS[scProd2][yp] : null;
      var ucl2 = null, lcl2 = null;
      if (scSpec2 && (scSpec2[0] != null || scSpec2[1] != null)) {
        lcl2 = scSpec2[0] != null ? scSpec2[0] : null;
        ucl2 = scSpec2[1] != null ? scSpec2[1] : null;
      } else {
        var mean2 = yVals.reduce(function(a, b) { return a + b; }, 0) / yVals.length;
        var std2 = Math.sqrt(yVals.reduce(function(a, b) { return a + Math.pow(b - mean2, 2); }, 0) / (yVals.length - 1));
        ucl2 = mean2 + 3 * std2; lcl2 = mean2 - 3 * std2;
      }
      var xR = [0, allPts.length > 0 ? allPts[allPts.length - 1].x : 0];
      if (ucl2 != null) datasets.push({label: 'UCL=' + ucl2.toFixed(4), data: [{x: xR[0], y: ucl2}, {x: xR[1], y: ucl2}], borderColor: 'red', borderWidth: 2, borderDash: [5, 3], pointRadius: 0, showLine: true, fill: false});
      if (lcl2 != null) datasets.push({label: 'LCL=' + lcl2.toFixed(4), data: [{x: xR[0], y: lcl2}, {x: xR[1], y: lcl2}], borderColor: 'red', borderWidth: 2, borderDash: [5, 3], pointRadius: 0, showLine: true, fill: false});
    }
    var biasTitle = this._getBiasText(yp);
    var chart = new ChartJS(canvas.getContext('2d'), {
      type: 'scatter', data: {datasets: datasets},
      options: {responsive: true, maintainAspectRatio: false, animation: false,
        plugins: {legend: {labels: {color: '#333', boxWidth: 8, font: {size: 9}}},
          title: biasTitle ? {display: true, text: biasTitle, position: 'top', color: '#2f6fed', font: {size: 11, weight: 'bold'}} : {display: false}},
        scales: {x: {title: {display: true, text: '行序号', color: '#333'}, ticks: {color: '#333'}, grid: {color: '#e0e0e0'}},
          y: this._getScYScale(yp)}
      }
    });
    this.charts['sc' + i] = chart;
  }

  _drawOneScatter(i, yp, recs, lot, wf) {
    if (!ChartJS) return;
    var canvas = this.$('scCanvas' + i);
    if (!canvas) return;
    canvas.style.width = '100%'; canvas.style.height = '400px';
    canvas.parentElement.style.backgroundColor = '#ffffff';
    // 按圆片排序
    recs.sort(function(a, b) { var wa = parseInt(a._Wafer) || 0, wb = parseInt(b._Wafer) || 0; return wa - wb; });
    var pts = []; recs.forEach(function(r, idx) { var y = +r[yp]; if (!isNaN(y)) pts.push({x: idx, y: y}); });
    var MAX = 5000;
    var sample = function(arr, max) {
      if (arr.length <= max) return arr;
      var r = []; var step = arr.length / max;
      for (var j = 0; j < max; j++) r.push(arr[Math.floor(j * step)]);
      return r;
    };
    var sampled = sample(pts, MAX);

    // UCL/LCL：优先取文件规格标准值(SPEC_LIMITS)，无规格时回退 mean±3σ
    var datasets = [{label: yp, data: sampled, backgroundColor: 'rgba(77,171,247,0.4)', borderColor: '#4dabf7', pointRadius: 3}];
    var yVals = sampled.map(function(p) { return p.y; });
    var scProd = this.data[0] ? this.data[0]._Product : '';
    var scSpec = (scProd && SPEC_LIMITS[scProd] && SPEC_LIMITS[scProd][yp]) ? SPEC_LIMITS[scProd][yp] : null;
    var ucl = null, lcl = null;
    if (scSpec && (scSpec[0] != null || scSpec[1] != null)) {
      lcl = scSpec[0] != null ? scSpec[0] : null;
      ucl = scSpec[1] != null ? scSpec[1] : null;
    } else if (yVals.length > 5) {
      var mean = yVals.reduce(function(a, b) { return a + b; }, 0) / yVals.length;
      var std = Math.sqrt(yVals.reduce(function(a, b) { return a + Math.pow(b - mean, 2); }, 0) / (yVals.length - 1));
      ucl = mean + 3 * std; lcl = mean - 3 * std;
    }
    var xR = [sampled[0].x, sampled[sampled.length - 1].x];
    if (ucl != null) datasets.push({label: 'UCL=' + ucl.toFixed(4), data: [{x: xR[0], y: ucl}, {x: xR[1], y: ucl}], borderColor: 'red', borderWidth: 1.5, borderDash: [5, 3], pointRadius: 0, showLine: true, fill: false});
    if (lcl != null) datasets.push({label: 'LCL=' + lcl.toFixed(4), data: [{x: xR[0], y: lcl}, {x: xR[1], y: lcl}], borderColor: 'red', borderWidth: 1.5, borderDash: [5, 3], pointRadius: 0, showLine: true, fill: false});

    var biasTitle = this._getBiasText(yp);
    var chart = new ChartJS(canvas.getContext('2d'), {
      type: 'scatter', data: {datasets: datasets},
      options: {responsive: true, maintainAspectRatio: false, animation: false,
        plugins: {legend: {labels: {color: '#333'}},
          title: biasTitle ? {display: true, text: biasTitle, position: 'top', color: '#2f6fed', font: {size: 11, weight: 'bold'}} : {display: false}},
        scales: {x: {title: {display: true, text: '行序号', color: '#333'}, ticks: {color: '#333'}, grid: {color: '#e0e0e0'}},
          y: this._getScYScale(yp)}
      }
    });
    this.charts['sc' + i] = chart;
  }

  _getSpecRange(p) {
    const prod = this.data[0] ? this.data[0]._Product : '';
    if (prod && SPEC_LIMITS[prod] && SPEC_LIMITS[prod][p]) return SPEC_LIMITS[prod][p];
    for (const key in SPEC_LIMITS) { if (SPEC_LIMITS[key] && SPEC_LIMITS[key][p]) return SPEC_LIMITS[key][p]; }
    return null;
  }

  _getBiasText(yp) {
    if (!this._bias || !Object.keys(this._bias).length) return '';
    var pIdx = this.headers.indexOf(yp);
    var parts = [];
    ['BIAS1', 'BIAS2', 'BIAS3'].forEach(function(b) {
      var row = this._bias[b];
      if (!row) return;
      // 优先按参数名查（日月新等格式）；无 map 时回退同列对齐
      var src = (row.map && row.map[yp]) ? row.map[yp] : (pIdx >= 0 ? row.vals[pIdx] : '');
      if (src && src !== '') parts.push(src);
    }.bind(this));
    return parts.join('   ');
  }

  _getScYScale(yp) {
    var s = {title: {display: true, text: yp, color: '#333'}, ticks: {color: '#333'}, grid: {color: '#e0e0e0'}};
    var yMin = parseFloat(this.$('scYMin').value), yMax = parseFloat(this.$('scYMax').value);
    if (!isNaN(yMin)) s.min = yMin;
    if (!isNaN(yMax)) s.max = yMax;
    return s;
  }

  _refreshScUI() {
    const allCols = [...new Set([...this.headers])];
    const labelOf = (h) => this._labelOf(h);
    const cfgDiv = this.$('scConfigs');
    cfgDiv.innerHTML = this.scConfigs.map((c, i) => `

          <span style="font-size:0.7rem;color:#7a8ba0">X:</span><select data-si="${i}" data-f="xParam" style="background:var(--vt-surface,#1a2735);color:var(--vt-text,#c8d6e5);border:1px solid var(--vt-border,#2a3a4a);padding:3px 5px;border-radius:4px;font-size:0.7rem;width:90px">${allCols.map(p=>`<option value="${p}" ${c.xParam===p?'selected':''}>${labelOf(p)}</option>`).join('')}</select>
          <input placeholder="Xmin" value="${c.xMin}" data-si="${i}" data-f="xMin" style="width:50px;background:var(--vt-surface,#1a2735);color:var(--vt-text,#c8d6e5);border:1px solid var(--vt-border,#2a3a4a);padding:3px 5px;border-radius:4px;font-size:0.7rem">
          <input placeholder="Xmax" value="${c.xMax}" data-si="${i}" data-f="xMax" style="width:50px;background:var(--vt-surface,#1a2735);color:var(--vt-text,#c8d6e5);border:1px solid var(--vt-border,#2a3a4a);padding:3px 5px;border-radius:4px;font-size:0.7rem">
          <span style="font-size:0.7rem;color:#7a8ba0">Y:</span><select data-si="${i}" data-f="yParam" style="background:var(--vt-surface,#1a2735);color:var(--vt-text,#c8d6e5);border:1px solid var(--vt-border,#2a3a4a);padding:3px 5px;border-radius:4px;font-size:0.7rem;width:90px">${allCols.map(p=>`<option value="${p}" ${c.yParam===p?'selected':''}>${labelOf(p)}</option>`).join('')}</select>
          <input placeholder="Ymin" value="${c.yMin}" data-si="${i}" data-f="yMin" style="width:50px;background:var(--vt-surface,#1a2735);color:var(--vt-text,#c8d6e5);border:1px solid var(--vt-border,#2a3a4a);padding:3px 5px;border-radius:4px;font-size:0.7rem">
          <input placeholder="Ymax" value="${c.yMax}" data-si="${i}" data-f="yMax" style="width:50px;background:var(--vt-surface,#1a2735);color:var(--vt-text,#c8d6e5);border:1px solid var(--vt-border,#2a3a4a);padding:3px 5px;border-radius:4px;font-size:0.7rem">
          <button class="vt-btn vt-btn-outline" data-si="${i}" data-f="del" style="padding:3px 8px;font-size:0.7rem;color:var(--vt-fail,#e74c3c)">✕</button>

    cfgDiv.querySelectorAll('input,select,button').forEach(el => {
      if (el.dataset.f === 'del') { el.onclick = () => { this.scConfigs.splice(+el.dataset.si,1); this._refreshScUI(); }; return; }
      el.addEventListener('change', () => { this.scConfigs[+el.dataset.si][el.dataset.f] = el.value; });
      if (el.tagName === 'INPUT') el.addEventListener('input', () => { this.scConfigs[+el.dataset.si][el.dataset.f] = el.value; });
    });
  }

  _drawAllSc() {
    const labelOf = (h) => this._labelOf ? this._labelOf(h) : h;
    const container = this.$('scCharts');
    container.innerHTML = '';
    this.scConfigs.forEach((c, i) => {
      if (!c.xParam || !c.yParam) return;
      const div = document.createElement('div');
      div.className = 'vt-chart';
      div.innerHTML = `<h3>${c.title||(labelOf(c.xParam)+' vs '+labelOf(c.yParam))}</h3><canvas id="${this.id}-scCanvas${i}"></canvas>`;
      container.appendChild(div);
    });
    setTimeout(() => this.scConfigs.forEach((c, i) => { if (c.xParam && c.yParam) this._drawOneSc(i, c); }), 30);
  }

  _drawOneSc(i, c) {
    if (!ChartJS) return;
    const canvas = this.$('scCanvas' + i);
    if (!canvas) return;
    canvas.style.width = '100%'; canvas.style.height = '380px';
    canvas.parentElement.style.backgroundColor = '#ffffff';
    const MAX = 100000;
    const sample = (arr, max) => { if (arr.length<=max) return arr; const step=Math.ceil(arr.length/max),r=[];for(let j=0;j<arr.length;j+=step)r.push(arr[Math.min(j+Math.floor(Math.random()*Math.min(step,arr.length-j)),arr.length-1)]);return r; };

    // 全部合并数据，不分组
    const pts = []; this.data.forEach(r => { const x=+r[c.xParam],y=+r[c.yParam]; if(!isNaN(x)&&!isNaN(y))pts.push({x,y}); });
    if (c.type === 'line') pts.sort((a,b)=>a.x-b.x);
    const datasets = [{label:c.yParam+' vs '+c.xParam, data:sample(pts,MAX), backgroundColor:'rgba(77,171,247,0.4)',borderColor:'#4dabf7',pointRadius:3}];

    // Y轴自动步长
    const yVals = pts.map(p=>p.y).filter(v=>!isNaN(v));
    const yRange = yVals.length>1 ? Math.max(...yVals)-Math.min(...yVals) : 1;
    const yMag = Math.pow(10, Math.floor(Math.log10(yRange||1)));
    const yStep = yRange > 5*yMag ? yMag : yMag/2;
    const scales = {x:{ticks:{color:'#333'},grid:{color:'#e0e0e0'}},y:{ticks:{color:'#333',stepSize:yStep||undefined,callback:v=>Math.abs(v)<0.01?v.toExponential(1):v.toFixed(4)},grid:{color:'#e0e0e0'}}};
    if (c.xMin) scales.x.min = +c.xMin;
    if (c.xMax) scales.x.max = +c.xMax;
    if (c.yMin) scales.y.min = +c.yMin;
    if (c.yMax) scales.y.max = +c.yMax;

    // Y轴规格限红色虚线（从实际数据取X范围）
    const product = this.data[0]?._Product || '';
    if (product && SPEC_LIMITS[product] && SPEC_LIMITS[product][c.yParam]) {
      const [lo, hi] = SPEC_LIMITS[product][c.yParam];
      const xVals = this.data.map(r => +r[c.xParam]).filter(v => !isNaN(v));
      const xMin = xVals.length ? Math.min(...xVals) : 0;
      const xMax = xVals.length ? Math.max(...xVals) : 1;
      if (lo) datasets.push({label:'LSL='+(lo<0.01?lo.toExponential(2):lo.toFixed(4)),data:[{x:xMin,y:lo},{x:xMax,y:lo}],borderColor:'red',borderWidth:1.5,borderDash:[6,3],pointRadius:0,showLine:true,fill:false});
      if (hi) datasets.push({label:'USL='+(hi<0.01?hi.toExponential(2):hi.toFixed(4)),data:[{x:xMin,y:hi},{x:xMax,y:hi}],borderColor:'red',borderWidth:1.5,borderDash:[6,3],pointRadius:0,showLine:true,fill:false});
    }

    // 收集规格线
    let ySpecs = null;
    if (c.yParam) { for (const key in SPEC_LIMITS) { if (SPEC_LIMITS[key][c.yParam]) { ySpecs = SPEC_LIMITS[key][c.yParam]; break; } } }

    const specPlugin = ySpecs ? {
      id: 'specLines'+i,
      afterDraw(chart) {
        const ctx2 = chart.ctx, [lo,hi] = ySpecs;
        const xS = chart.scales.x.left, xE = chart.scales.x.right, lx = xE - 55;
        ctx2.save(); ctx2.setLineDash([5,4]); ctx2.lineWidth = 1.5; ctx2.strokeStyle = 'red';
        if (lo != null) {
          const y = chart.scales.y.getPixelForValue(lo);
          ctx2.beginPath(); ctx2.moveTo(xS, y); ctx2.lineTo(xE, y); ctx2.stroke();
          ctx2.setLineDash([]); ctx2.fillStyle = 'red'; ctx2.font = 'bold 9px sans-serif';
          ctx2.fillText('LSL='+(Math.abs(lo)<0.01?lo.toExponential(2):lo.toFixed(4)), lx, y-3);
          ctx2.setLineDash([5,4]);
        }
        if (hi != null) {
          const y = chart.scales.y.getPixelForValue(hi);
          ctx2.beginPath(); ctx2.moveTo(xS, y); ctx2.lineTo(xE, y); ctx2.stroke();
          ctx2.setLineDash([]); ctx2.fillStyle = 'red'; ctx2.font = 'bold 9px sans-serif';
          ctx2.fillText('USL='+(Math.abs(hi)<0.01?hi.toExponential(2):hi.toFixed(4)), lx, y-3);
        }
        ctx2.restore();
      }
    } : null;

    const plugins = specPlugin ? [specPlugin] : [];
    const chart = new ChartJS(canvas.getContext('2d'), {
      type: c.type === 'line' ? 'line' : 'scatter', data:{datasets}, plugins,
      options:{responsive:true,maintainAspectRatio:false,animation:false,
        plugins:{legend:{labels:{color:'#333',boxWidth:8,font:{size:9}}}},
        scales
      }
    });
    this.charts['sc'+i] = chart;
  }

  _updateScatter() {
    this._destroyChart('scatterChart');
    if (!ChartJS) return;
    const xp = this.$('scX').value, yp = this.$('scY').value;
    if (xp.startsWith('--') || yp.startsWith('--')) return;
    const chartType = this.$('scType') ? this.$('scType').value : 'scatter';
    const groupBy = (this.$('scGroup') && this.$('scGroup').value) || 'auto';
    const MAX = chartType === 'line' ? 5000 : 1500;
    const sample = (arr, max) => { if (arr.length <= max) return arr; const step = Math.ceil(arr.length/max), r=[]; for(let i=0;i<arr.length;i+=step)r.push(arr[Math.min(i+Math.floor(Math.random()*(Math.min(step,arr.length-i))),arr.length-1)]); return r; };

    let datasets = [], configType = chartType;

    // 分组逻辑
    const getGroups = () => {
      if (groupBy === 'wafer') return [...new Set(this.data.map(r => r._Wafer).filter(Boolean))].sort().slice(0, 15);
      if (groupBy === 'file') return this.files.map(f => f.name);
      return null; // auto: use pass/fail or file-based
    };
    const groups = getGroups();
    const filterByGroup = (g) => groupBy === 'wafer' ? this.data.filter(r => r._Wafer === g) : this.data.filter(r => r._File === g);

    if (groups) {
      // 按 Wafer/文件分组
      groups.forEach((g, gi) => {
        const recs = filterByGroup(g);
        const pts = []; recs.forEach(r => { const x=+r[xp],y=+r[yp]; if(!isNaN(x)&&!isNaN(y))pts.push({x,y}); });
        if (!pts.length) return;
        if (chartType === 'line') pts.sort((a,b) => a.x - b.x);
        const c = FILE_COLORS[gi % FILE_COLORS.length];
        datasets.push({label:String(g), data:sample(pts, Math.floor(MAX/groups.length)), borderColor:c, pointRadius:chartType==='line'?0:2, fill:false, tension:0.1});
      });
    } else if (this.files.length <= 1) {
      const pp=[], fp=[];
      this.data.forEach(r => { const x=parseFloat(r[xp]),y=parseFloat(r[yp]); if(isNaN(x)||isNaN(y))return; (r._Bin===1?pp:fp).push({x,y}); });
      if (chartType === 'line') { pp.sort((a,b)=>a.x-b.x); fp.sort((a,b)=>a.x-b.x); }
      datasets = [
        {label:'良品 ('+pp.length+')',data:sample(pp,MAX),borderColor:chartType==='line'?'#2ecc71':undefined,backgroundColor:chartType==='line'?undefined:'rgba(46,204,113,0.5)',pointRadius:chartType==='line'?0:3,fill:false,tension:0.1},
        {label:'失效 ('+fp.length+')',data:sample(fp,MAX),borderColor:chartType==='line'?'#e74c3c':undefined,backgroundColor:chartType==='line'?undefined:'rgba(231,76,60,0.5)',pointRadius:chartType==='line'?0:3,fill:false,tension:0.1}
      ];
    } else {
      const perFile = Math.floor(MAX / this.files.length);
      datasets = this.files.map((f,fi) => {
        const pts = []; this.data.forEach(r => { if(r._File!==f.name||r._Bin!==1)return; const x=parseFloat(r[xp]),y=parseFloat(r[yp]); if(!isNaN(x)&&!isNaN(y))pts.push({x,y}); });
        if (chartType === 'line') pts.sort((a,b)=>a.x - b.x);
        const c = FILE_COLORS[fi%FILE_COLORS.length];
        return {label:f.name+' ('+pts.length+')',data:sample(pts,perFile),borderColor:c,pointRadius:chartType==='line'?0:2,fill:false,tension:0.1};
      });
    }

    const xLabel = this.$('scXLabel').value || xp;
    const yLabel = this.$('scYLabel').value || yp;
    const scales = {
      x:{title:{display:true,text:xLabel,color:'#7a8ba0'},grid:{color:'#2a3a4a'},ticks:{color:'#7a8ba0'}},
      y:{title:{display:true,text:yLabel,color:'#7a8ba0'},grid:{color:'#2a3a4a'},ticks:{color:'#7a8ba0'}}
    };
    const xMin = this.$('scXMin').value, xMax = this.$('scXMax').value;
    const yMin = this.$('scYMin').value, yMax = this.$('scYMax').value;
    if (xMin) scales.x.min = +xMin;
    if (xMax) scales.x.max = +xMax;
    if (yMin) scales.y.min = +yMin;
    if (yMax) scales.y.max = +yMax;

    this.charts.scatterChart = new ChartJS(this.$('scatterChart').getContext('2d'), {
      type:configType, data:{datasets},
      options:{responsive:true,maintainAspectRatio:false,animation:false,plugins:{legend:{labels:{color:'#c8d6e5',boxWidth:10,font:{size:10}}}},scales}
    });
  }

  _renderDataTable() {
    // BIN 修改工具：参数下拉 + 事件绑定（仅首次）
    const binParam = this.$('binFParam');
    if (binParam && !binParam.dataset.init) {
      binParam.innerHTML = '<option value="">-- 选参数列 --</option>' + this.headers.filter(h => !['_File','_Bin','_Product','_Lot','_Wafer'].includes(h)).map(h => `<option>${h}</option>`).join('');
      binParam.dataset.init = '1';
      const self = this;
      this.$('btnBinFilter').onclick = function() { self._binFilter(); };
      this.$('btnBinClear').onclick = function() { self._binHits = []; const c = self.$('binHitCount'); if (c) c.textContent = '0'; self.$('binMsg').textContent = ''; };
      this.$('btnBinApply').onclick = function() { self._binApply(); };
    }
    const allH = ['_File','_Bin','_Product','_Lot','_Wafer',...this.headers.filter(h=>!['_File','_Bin','_Product','_Lot','_Wafer'].includes(h))];
    this.$('dataTable').querySelector('thead').innerHTML = '<tr>'+allH.map(h=>`<th>${h.replace('_','')}</th>`).join('')+'</tr>';
    const rows = this.data.slice(0,100);
    this.$('dataTable').querySelector('tbody').innerHTML = rows.map((r, vi) => {
      const bc = BIN_COLORS[r._Bin] || BIN_COLORS[999];
      return '<tr>'+allH.map(h => {
        const v = r[h]!==undefined?r[h]:'', s = h==='_Bin'?`style="color:${bc.color};font-weight:700"`:'';
        const disp = typeof v==='number'?(v<0.01?v.toExponential(3):v.toFixed(4)):v;
        return `<td ${s} contenteditable="true" data-h="${h}" data-idx="${vi}" title="点击编辑，Enter/失焦保存" style="cursor:text">${disp}</td>`;
      }).join('')+'</tr>';
    }).join('');
    if (this.data.length > 100) this.$('dataTable').querySelector('tbody').innerHTML += `<tr><td colspan="${allH.length}" style="text-align:center;color:#7a8ba0;padding:16px">... 共 ${this.data.length.toLocaleString()} 条，仅显示前 100 可编辑</td></tr>`;
    // 单元格编辑：写回 this.data → 重新统计（导出CSV自动为修改后的当前值）
    const selfD = this;
    this.$('dataTable').querySelectorAll('td[contenteditable]').forEach(td => {
      td.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); td.blur(); } });
      td.addEventListener('blur', () => {
        const h = td.dataset.h, idx = +td.dataset.idx;
        if (idx >= this.data.length) return;
        const rec = this.data[idx];
        const raw = td.textContent.trim();
        let newV;
        if (h === '_Bin') {
          newV = parseInt(raw);
          if (isNaN(newV) || newV < 1 || newV > 99) { td.textContent = rec._Bin; return; }
        } else {
          if (raw === '') newV = '';
          else { newV = parseFloat(raw); if (isNaN(newV)) { td.textContent = rec[h]; return; } }
        }
        if (rec[h] === newV) return;
        rec[h] = newV;
        this._computeStats();
        try { this._renderBinGrid(); } catch(e) {}
        try { this._renderStats(); } catch(e) {}
        if (h === '_Bin') {
          const bc = BIN_COLORS[rec._Bin] || BIN_COLORS[999];
          td.style.color = bc.color;
        }
        const wc = this.$('waferCanvas');
        if (wc && wc.width) { try { this._drawWafer(); } catch(e) {} }
      });
    });
  }

  // BIN 筛选：按 参数列 运算符 值 匹配
  _binMatch(v, op, t) {
    if (v == null || v === '' || isNaN(parseFloat(v))) return false;
    const n = parseFloat(v), tv = parseFloat(t);
    if (isNaN(tv)) return false;
    switch (op) {
      case '>': return n > tv;
      case '<': return n < tv;
      case '=': return n === tv;
      case '>=': return n >= tv;
      case '<=': return n <= tv;
    }
    return false;
  }

  _binFilter() {
    const p = this.$('binFParam').value, op = this.$('binFOp').value, tv = this.$('binFVal').value;
    const msg = this.$('binMsg');
    if (!p) { msg.textContent = '请选择参数列'; msg.style.color = '#e74c3c'; return; }
    if (tv === '') { msg.textContent = '请输入比较值'; msg.style.color = '#e74c3c'; return; }
    const hits = [];
    for (let i = 0; i < this.data.length; i++) {
      if (this._binMatch(this.data[i][p], op, tv)) hits.push(i);
    }
    this._binHits = hits;
    const c = this.$('binHitCount');
    if (c) c.textContent = hits.length.toLocaleString();
    msg.textContent = '筛选完成: ' + hits.length.toLocaleString() + ' 条命中';
    msg.style.color = '#f1c40f';
  }

  _binApply() {
    const msg = this.$('binMsg');
    if (!this._binHits || !this._binHits.length) { msg.textContent = '请先筛选'; msg.style.color = '#e74c3c'; return; }
    let nv = parseInt(this.$('binNewVal').value);
    if (isNaN(nv) || nv < 1 || nv > 99) { msg.textContent = 'BIN 需在 1-99'; msg.style.color = '#e74c3c'; return; }
    this._binHits.forEach(i => { this.data[i]._Bin = nv; });
    const n = this._binHits.length;
    // 重新统计与渲染（BIN 影响良率/WAFER/超限等）
    this._computeStats();
    try { this._renderBinGrid(); } catch(e) {}
    try { this._renderStats(); } catch(e) {}
    try { this._renderDataTable(); } catch(e) {}
    // WAFER 画布若存在则重绘
    const wc = this.$('waferCanvas');
    if (wc && wc.width) { try { this._drawWafer(); } catch(e) {} }
    msg.textContent = '✔ 已将 ' + n.toLocaleString() + ' 条 BIN 改为 ' + nv;
    msg.style.color = '#2ecc71';
    this._binHits = [];
    const c = this.$('binHitCount');
    if (c) c.textContent = '0';
  }

  _renderFileList() {
    this.$('fileInfo').style.display = this.files.length ? '' : 'none';
    this.$('fileInfo').textContent = '已上传: ' + this.files.length + ' 个文件';
    const el = this.$('fileList');
    if (!this.files.length) { el.classList.add('vt-hide'); return; }
    el.classList.remove('vt-hide');
    el.innerHTML = this.files.map((f,i) => `
      <span class="vt-file-tag" style="border-left:3px solid ${FILE_COLORS[i%FILE_COLORS.length]}">
        <span class="vt-fname" title="${f.name}">${f.name}</span>
        <span class="vt-fcnt">${f.count}条 | ${f.yield.toFixed(1)}%</span>
        <span class="vt-fdel" data-vt-del="${i}">✕</span>
      </span>`).join('');
    el.querySelectorAll('.vt-fdel').forEach(del => del.addEventListener('click', e => {
      e.stopPropagation();

  _renderCompare() {
    const el = this.$('compare');
    if (this.files.length <= 1) { el.classList.add('vt-hide'); return; }
    el.classList.remove('vt-hide');
    const params = this.params.slice(0, 4);
    const bestY = Math.max(...this.files.map(f=>f.yield)), worstY = Math.min(...this.files.map(f=>f.yield));
    const stats = ['Avg','Std','Median','RobustStd'];
    let html = '<thead><tr><th>文件</th><th>记录</th><th>良率</th><th>圆片</th><th>产品</th>';
    params.forEach(p => stats.forEach(s => { html += `<th>${p}<br><span style="font-size:0.65rem;color:#7a8ba0">${s}</span></th>`; }));
    html += '</tr></thead><tbody>';
    this.files.forEach((f,i) => {
      const c = FILE_COLORS[i%FILE_COLORS.length];
      const bdg = f.yield===bestY?'<span class="vt-badge vt-badge-best">最高</span>':f.yield===worstY?'<span class="vt-badge vt-badge-worst">最低</span>':'';
      const recs = this.data.filter(r=>r._File===f.name);
      html += `<tr><td style="color:${c};font-weight:600">${f.name}</td><td>${f.count.toLocaleString()}</td><td>${f.yield.toFixed(2)}% ${bdg}</td><td>${f.waferCount}</td><td>${f.product}</td>`;
      params.forEach(p => {
        const vals = recs.map(r=>parseFloat(r[p])).filter(v=>!isNaN(v)).sort((a,b)=>a-b);
        if (!vals.length) { html += '<td>--</td><td>--</td><td>--</td><td>--</td>'; return; }
        const n = vals.length;
        const avg = vals.reduce((a,b)=>a+b,0)/n;
        const std = Math.sqrt(vals.reduce((a,b)=>a+(b-avg)**2,0)/(n-1));
        const med = vals[Math.floor(n*0.5)];
        const mad = vals.map(v=>Math.abs(v-med)).sort((a,b)=>a-b)[Math.floor(n*0.5)];
        const robustStd = mad * 1.4826;
        html += `<td>${avg.toFixed(4)}</td><td>${std.toExponential(2)}</td><td>${med.toFixed(4)}</td><td>${robustStd.toExponential(2)}</td>`;
      });
      html += '</tr>';
    });
    // 汇总行
    html += '<tr style="border-top:2px solid #2a3a4a;font-weight:600"><td>汇总</td><td>'+this.data.length.toLocaleString()+'</td><td>'+this.yield.toFixed(2)+'%</td><td>'+(new Set(this.data.map(r=>r._Wafer))).size+'</td><td></td>';
    params.forEach(p => {
      const vals = this.data.map(r=>parseFloat(r[p])).filter(v=>!isNaN(v)).sort((a,b)=>a-b);
      if (!vals.length) { html += '<td>--</td><td>--</td><td>--</td><td>--</td>'; return; }
      const n = vals.length;
      const avg = vals.reduce((a,b)=>a+b,0)/n;
      const std = Math.sqrt(vals.reduce((a,b)=>a+(b-avg)**2,0)/(n-1));
      const med = vals[Math.floor(n*0.5)];
      const mad = vals.map(v=>Math.abs(v-med)).sort((a,b)=>a-b)[Math.floor(n*0.5)];
      html += `<td>${avg.toFixed(4)}</td><td>${std.toExponential(2)}</td><td>${med.toFixed(4)}</td><td>${(mad*1.4826).toExponential(2)}</td>`;
    });
    html += '</tr></tbody>';
    this.$('compareTable').innerHTML = html;
  }

  _exportCompare() {
    const params = this.params.slice(0, 4);
    const stats = ['Avg','Std','Median','RobustStd'];
    let csv = '\uFEFF文件,记录数,良率(%),圆片数,产品,';
    params.forEach(p => stats.forEach(s => { csv += p + '_' + s + ','; }));
    csv += '\n';
    this.files.forEach(f => {
      const recs = this.data.filter(r => r._File === f.name);
      csv += [f.name, f.count, f.yield.toFixed(2), f.waferCount, f.product].join(',') + ',';
      params.forEach(p => {
        const vals = recs.map(r => parseFloat(r[p])).filter(v => !isNaN(v)).sort((a,b) => a-b);
        if (!vals.length) { csv += '--,--,--,--,'; return; }
        const n = vals.length, avg = vals.reduce((a,b) => a+b, 0)/n;
        const std = Math.sqrt(vals.reduce((a,b) => a+(b-avg)**2, 0)/(n-1));
        const med = vals[Math.floor(n*0.5)];
        const mad = vals.map(v => Math.abs(v-med)).sort((a,b)=>a-b)[Math.floor(n*0.5)];
        csv += [avg.toFixed(4), std.toExponential(2), med.toFixed(4), (mad*1.4826).toExponential(2)].join(',') + ',';
      });
      csv += '\n';
    });
    this._downloadCSV(csv, 'VDMOS_对比摘要_' + new Date().toISOString().slice(0,10) + '.csv');
  }

  _exportData() {
    const allH = ['_File','_Bin','_Product','_Lot','_Wafer',...this.headers.filter(h=>!['_File','_Bin','_Product','_Lot','_Wafer'].includes(h))];
    let csv = '\uFEFF' + allH.map(h => h.replace('_','')).join(',') + '\n';
    const rows = this._dedupXYRows(this.data);
    rows.forEach(r => {
      csv += allH.map(h => {
        const v = r[h] !== undefined ? r[h] : '';
        return typeof v === 'number' ? v : '"' + String(v).replace(/"/g,'""') + '"';
      }).join(',') + '\n';
    });
    this._downloadCSV(csv, 'VDMOS_数据_' + new Date().toISOString().slice(0,10) + '.csv');
  }

  // 同文件内 (X,Y) 重复的行视为重复数据，只保留首次出现（畅景等带 X/Y 坐标的数据）
  _dedupXYRows(rows) {
    if (!rows || !rows.length) return rows;
    const hasXY = rows.some(r => r && ('X' in r) && ('Y' in r));
    if (!hasXY) return rows;
    const seen = new Set();
    const out = [];
    rows.forEach(r => {
      const x = parseFloat(r['X']), y = parseFloat(r['Y']);
      const key = (r._File || '') + '|' + (isNaN(x) ? 'n' : x) + '|' + (isNaN(y) ? 'n' : y);
      if (seen.has(key)) return;
      seen.add(key);
      out.push(r);
    });
    return out;
  }

  _downloadCSV(csv, filename) {
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#c8d6e5',boxWidth:12}}},scales:{x:{stacked:true,ticks:{color:'#7a8ba0'},grid:{display:false}},y:{stacked:true,ticks:{color:'#7a8ba0'},grid:{color:'#2a3a4a'},title:{display:true,text:'颗数',color:'#7a8ba0'}}}}
    });

  // ========== Tab 切换 ==========
  async _switchTab(name) {
    // 区域/复合等轻量 Tab 跳过进度条
    const lightTabs = ['zone','stack','wsum','data','single','multival'];
    if (!lightTabs.includes(name)) {
      this._showProgress('加载中...');
      this._updateProgress(15, '初始化...', ''); await this._delay(15);
    }

    // 确保 Chart.js 已加载
    await loadChartJS();

    const names=['bin','summary','box','scatter','single','multival','trend','wafer','dist','pareto','stack','fail','overlay','pat','margin','normal','spc','custom','limit','wsum','yieldtab','report','data'];
    this.root.querySelectorAll('.vt-tab').forEach((t,i) => { t.classList.toggle('active',names[i]===name); });
    names.forEach(n => { const el = this.$('panel-'+n); if (el) el.classList.toggle('active', n===name); });

    // 显示面板后让浏览器完成布局，确保 canvas 有尺寸
    await this._delay(30);

    const safeRender = (key, fn) => { try { fn(); } catch(e) { console.warn('Render failed:', key, e); } };
    if (name === 'box') { this._updateProgress(40,'BoxPlot...',''); await this._delay(10); safeRender('box',()=>this._renderBoxPlot()); await this._delay(10); }
    if (name === 'summary') { safeRender('summary',()=>this._renderSummary()); }
    if (name === 'scatter') { safeRender('scatter',()=>this._renderScatter()); }
    if (name === 'single') { safeRender('single',()=>this._renderSingle()); }
    if (name === 'multival') { safeRender('multival',()=>this._renderMulti()); }
    if (name === 'trend') { this._updateProgress(40,'趋势分析...',''); await this._delay(10); safeRender('trend',()=>this._renderTrend()); }
    if (name === 'wafer') { this._updateProgress(40,'Wafer Map...',''); await this._delay(10); safeRender('wafer',()=>this._renderWafer()); }
    if (name === 'dist') { this._updateProgress(40,'参数分布...',''); await this._delay(10); safeRender('dist',()=>this._renderDist()); }
    if (name === 'pareto') { this._updateProgress(40,'帕累托...',''); await this._delay(10); safeRender('pareto',()=>this._renderPareto()); }
    if (name === 'stack') { this._updateProgress(40,'复合Wafer...',''); await this._delay(10); safeRender('stack',()=>this._renderStack()); }
    if (name === 'fail') { this._updateProgress(40,'失效分析...',''); await this._delay(10); safeRender('fail',()=>this._renderFail()); }
    if (name === 'overlay') { safeRender('overlay',()=>this._renderOverlay()); }
    if (name === 'pat') { safeRender('pat',()=>this._renderPAT()); }
    if (name === 'margin') { safeRender('margin',()=>this._renderMargin()); }
    if (name === 'normal') { safeRender('normal',()=>this._renderNormal()); }
    if (name === 'spc') { safeRender('spc',()=>this._renderSPC()); }
    if (name === 'custom') { this._updateProgress(40,'自定义图表...',''); await this._delay(10); safeRender('custom',()=>this._renderCustom()); }
    if (name === 'limit') { this._updateProgress(40,'超限分析...',''); await this._delay(10); safeRender('limit',()=>this._renderLimit()); }
    if (name === 'wsum') { this._updateProgress(40,'晶圆汇总...',''); await this._delay(10); safeRender('wsum',()=>this._renderWaferSummary()); }
    if (name === 'yieldtab') { safeRender('yieldtab',()=>this._renderYieldTable()); }
    if (name === 'report') { this._updateProgress(40,'分析报告...',''); await this._delay(10); safeRender('report',()=>this._renderReport()); }
    if (name === 'data') { this._updateProgress(40,'数据表...',this.data.length.toLocaleString()+'条'); await this._delay(10); safeRender('data',()=>this._renderDataTable()); }

    if (!lightTabs.includes(name)) {
      this._updateProgress(100,'✓',''); await this._delay(100); this._hideProgress();
    }
  }

  _removeFile(idx) {
    if (this.files.length <= 1) { this.reset(); return; }
    const fn = this.files[idx].name;
    this.data = this.data.filter(r => r._File !== fn);
    this.files.splice(idx, 1);
    this._computeStats();
    this._renderAll();
    this._renderFileList();
    this._renderCompare();
  }

  _destroyChart(id) { if (this.charts[id]) { try { this.charts[id].destroy(); } catch(e) {} delete this.charts[id]; } }

  // ========== YMS L1: 批次趋势 ==========
  _renderTrend() {
    if (!ChartJS || this.files.length === 0) return;

    const lotNames = this.files.map(f => f.name);

    // 预计算每个文件每个参数的均值
    const fileMeans = {};
    this.files.forEach(f => {
      fileMeans[f.name] = {};
      const recs = this.data.filter(r => r._File === f.name);
      this.params.forEach(p => {
        const vs = recs.map(r => +r[p]).filter(v => !isNaN(v));
        fileMeans[f.name][p] = vs.length ? vs.reduce((a,b)=>a+b,0)/vs.length : null;
      });
    });

    const container = this.$('trendCharts');
    container.innerHTML = '';
    this.params.forEach((p, i) => {
      const div = document.createElement('div');
      div.className = 'vt-chart';
      div.innerHTML = `<h3>${p} 均值趋势</h3><canvas id="${this.id}-trendCanvas${i}"></canvas>`;
      container.appendChild(div);
    });
    const drawAll = () => {
      this._showProgress('趋势绘图中...');
      setTimeout(async () => {
        const n = this.params.length;
        for (let i = 0; i < n; i++) {
          this._updateProgress(Math.round((i+1)/n*100), '趋势', (i+1)+'/'+n);
          const p = this.params[i];
          const canvas = this.$('trendCanvas'+i);
          if (!canvas) continue;
          const means = this.files.map(f => fileMeans[f.name][p]);
          this.charts['trend'+i] = new ChartJS(canvas.getContext('2d'), {
            type:'line', data:{labels:lotNames,datasets:[{label:p,data:means,borderColor:'#4dabf7',borderWidth:1.5,pointRadius:3,fill:true,backgroundColor:'rgba(77,171,247,0.06)',tension:0.2}]},
            options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{ticks:{color:'#8899aa',callback:v=>v<0.01?v.toExponential(1):v.toFixed(4),font:{size:9}},grid:{color:'rgba(255,255,255,0.04)'}},x:{ticks:{color:'#8899aa',maxRotation:30,font:{size:9}},grid:{display:false}}}}
          });
          await this._delay(10);
        }
        this._hideProgress();
      }, 50);
    };
    this.$('btnDrawTrend').onclick = () => drawAll();
  }

  // ========== YMS L2: Wafer Map ==========
  _renderWafer() {
    if (!this.data.length) return;
    // 批次下拉
    const lots = [...new Set(this.data.map(r => r._Lot).filter(Boolean))].sort();
    const lotSel = this.$('waferLot');
    lotSel.innerHTML = '<option>全部批次</option>' + lots.map(l => `<option>${l}</option>`).join('');
    this._updateWaferWafers();

    const wp = this.$('waferParam');
    wp.innerHTML = '<option value="bin">BIN</option>' + this.params.map(p => `<option value="${p}">${p}</option>`).join('');

    this._drawWafer();
  }

  _onWaferLotChange() {
    this._updateWaferWafers();
    this._drawWafer();
  }

  _updateWaferWafers() {
    const lot = this.$('waferLot').value;
    const recs = lot === '全部批次' ? this.data : this.data.filter(r => r._Lot === lot);
    const wafers = [...new Set(recs.map(r => r._Wafer).filter(Boolean))].sort();
    const ws = this.$('waferSelect');
    ws.innerHTML = '<option>-- 选圆片 --</option>' + wafers.map(w => `<option>${w}</option>`).join('');
    if (wafers.length > 0) ws.value = wafers[0];
  }

  _updateWaferLegend(wpVal, recs) {
    // 当前圆片统计表（AVG/STD/MEDIAN/ROBUST STD）
    var stTitle = this.$('waferStatTitle');
    var stBody = this.$('waferStatTable') ? this.$('waferStatTable').querySelector('tbody') : null;
    if (stTitle && stBody) {
      var wfName = this.$('waferSelect').value;
      stTitle.textContent = wfName ? ('圆片 ' + wfName + ' · ' + (wpVal === 'bin' ? 'BIN' : wpVal)) : '';
      var rows = [];
      if (wpVal !== 'bin') {
        var vals = recs.map(function(r) { return parseFloat(r[wpVal]); }).filter(function(v) { return !isNaN(v); });
        if (vals.length > 0) {
          var n = vals.length, sum = 0;
          for (var i = 0; i < n; i++) sum += vals[i];
          var avg = sum / n;
          var sq = 0;
          for (var i = 0; i < n; i++) { var d = vals[i] - avg; sq += d * d; }
          var std = Math.sqrt(sq / (n - 1));
          var sorted = vals.slice().sort(function(a, b) { return a - b; });
          var med = sorted[Math.floor(n / 2)];
          var mads = sorted.map(function(v) { return Math.abs(v - med); }).sort(function(a, b) { return a - b; });
          var mad = mads[Math.floor(n / 2)];
          var robustStd = mad * 1.4826;
          var fmt = function(v) { return Math.abs(v) < 0.001 ? v.toExponential(3) : v.toFixed(4); };
          rows.push('<tr><td>' + wpVal + '</td><td>' + fmt(avg) + '</td><td>' + fmt(std) + '</td><td>' + fmt(med) + '</td><td>' + fmt(robustStd) + '</td></tr>');
          this._waferStats = {avg: avg, std: std, med: med, robustStd: robustStd};
        } else {
          rows.push('<tr><td colspan="5" style="color:#7a8ba0;text-align:center">该参数无有效数值</td></tr>');
          this._waferStats = null;
        }
      } else {
        rows.push('<tr><td colspan="5" style="color:#7a8ba0;text-align:center">BIN 模式无统计值，请选择参数</td></tr>');
        this._waferStats = null;
      }
      stBody.innerHTML = rows.join('');
    }
    var el = this.$('waferLegend');
    if (!el) return;
    var html = '<b style="color:#4dabf7">🎨 色阶说明：</b>';
    if (wpVal === 'bin') {
      // BIN模式：显示各BIN颜色
      var bins = {};
      recs.forEach(r => { bins[r._Bin] = (bins[r._Bin] || 0) + 1; });
      var binNames = Object.keys(bins).sort(function(a,b){ return a-b; });
      html += '<span style="display:inline-block;margin:2px 10px 2px 0">' +
        binNames.map(b => {
          var bc = BIN_COLORS[b] || BIN_COLORS[999];
          return '<span style="display:inline-block;margin-right:10px"><span style="display:inline-block;width:12px;height:12px;background:' + bc.color + ';border-radius:2px;vertical-align:middle;margin-right:4px"></span>' +
            'BIN ' + b + '=' + (bc.label || '失效') + ' (' + bins[b] + ')</span>';
        }).join('') + '</span>';
    } else {
      // 参数模式：渐变条
      var allVals = recs.map(x => parseFloat(x[wpVal])).filter(x => !isNaN(x)).sort(function(a,b){ return a-b; });
      if (allVals.length) {
        var cMinInput = this.$('waferCMin').value, cMaxInput = this.$('waferCMax').value;
        var min = cMinInput !== '' ? +cMinInput : allVals[0];
        var max = cMaxInput !== '' ? +cMaxInput : allVals[allVals.length-1];
        var fmt = function(v) { return Math.abs(v) < 0.01 ? v.toExponential(2) : v.toFixed(4); };
        html += '渐变映射（最小值→最大值）：';
        html += '<span style="display:inline-block;background:linear-gradient(to right, rgb(46,204,113), rgb(141,188,63), rgb(235,104,13));width:220px;height:14px;border-radius:3px;vertical-align:middle;margin:0 8px"></span>';
        html += '<b style="color:#2ecc71">' + fmt(min) + '</b> ← 低 → 高 → <b style="color:#eb680d">' + fmt(max) + '</b>';
        html += '<span style="color:#7a8ba0;margin-left:12px">■ 绿色=最小值 &nbsp;■ 橙色=最大值 &nbsp;■ 深色=无数据</span>';
      } else {
        html += '<span style="color:#7a8ba0">该参数无有效数值</span>';
      }
    }
    el.innerHTML = html;
  }

  // 全部圆片导出：每参数一行，每行 = 该批次所有圆片的迷你MAP（带芯片值）
  async _exportAllWafers() {
    if (!this.data.length) return;
    this._showProgress('生成高清导出图...');
    await this._delay(20);
    var lotVal = this.$('waferLot') ? this.$('waferLot').value : '全部批次';
    var recsAll = lotVal === '全部批次' ? this.data : this.data.filter(r => r._Lot === lotVal);
    var wafers = [...new Set(recsAll.map(r => r._Wafer).filter(Boolean))].sort(function(a,b){ return parseInt(a)-parseInt(b); });
    if (!wafers.length) { this._hideProgress(); alert('无圆片数据'); return; }
    var params = this.params;

    var labelW = 130, cellW = 260, cellH = 280;
    var W = labelW + wafers.length * cellW + 20;
    var H = 60 + params.length * cellH;
    var scale = 3; // 3x 高清
    var canvas = document.createElement('canvas');
    canvas.width = W * scale; canvas.height = H * scale;
    var ctx = canvas.getContext('2d');
    ctx.scale(scale, scale);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);

    // 标题
    ctx.fillStyle = '#1f2933'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('参数分布 ' + (lotVal === '全部批次' ? '(全部批次)' : lotVal) + '  ·  ' + new Date().toLocaleDateString(), W / 2, 24);

    // 表头：圆片号
    ctx.fillStyle = '#2f6fed'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
    wafers.forEach(function(w, wi) {
      ctx.fillText('W' + w, labelW + wi * cellW + cellW / 2, 44);
    });

    var self = this;
    for (var pi = 0; pi < params.length; pi++) {
      var p = params[pi];
      this._updateProgress(Math.round(pi / params.length * 100), '导出中', (pi + 1) + '/' + params.length + ' ' + p);
      await this._delay(10);
      var y = 56 + pi * cellH;
      // 参数名（左侧竖排）
      ctx.fillStyle = '#1f2933'; ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center';
      ctx.save();
      ctx.translate(20, y + cellH / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.fillText(p, 0, 0);
      ctx.restore();

      for (var wi = 0; wi < wafers.length; wi++) {
        var w = wafers[wi];
        var recs = recsAll.filter(function(r) { return r._Wafer === w; });
        var cx = labelW + wi * cellW;
        // 顶部统计框：上行列名，下行值，格子框起来
        var st = self._calcStats(recs, p);
        var bx = cx + 5, by = y + 2, bw2 = cellW - 10, bh2 = 24;
        ctx.fillStyle = '#f0f3f7';
        ctx.fillRect(bx, by, bw2, bh2);
        ctx.strokeStyle = '#c3ccd6'; ctx.lineWidth = 1;
        ctx.strokeRect(bx + 0.5, by + 0.5, bw2 - 1, bh2 - 1);
        ctx.fillStyle = '#6b7686'; ctx.font = 'bold 8px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('AVG', bx + bw2 / 8, by + 9);
        ctx.fillText('STD', bx + bw2 * 3 / 8, by + 9);
        ctx.fillText('MED', bx + bw2 * 5 / 8, by + 9);
        ctx.fillText('RSTD', bx + bw2 * 7 / 8, by + 9);
        ctx.strokeStyle = '#c3ccd6';
        ctx.beginPath(); ctx.moveTo(bx, by + 12.5); ctx.lineTo(bx + bw2, by + 12.5); ctx.stroke();
        if (st) {
          ctx.fillStyle = '#111827'; ctx.font = '8px sans-serif';
          ctx.fillText(st.avg, bx + bw2 / 8, by + 21);
          ctx.fillText(st.std, bx + bw2 * 3 / 8, by + 21);
          ctx.fillText(st.med, bx + bw2 * 5 / 8, by + 21);
          ctx.fillText(st.rstd, bx + bw2 * 7 / 8, by + 21);
        } else {
          ctx.fillStyle = '#9ca3af';
          ctx.fillText('--', bx + bw2 / 8, by + 21);
          ctx.fillText('--', bx + bw2 * 3 / 8, by + 21);
          ctx.fillText('--', bx + bw2 * 5 / 8, by + 21);
          ctx.fillText('--', bx + bw2 * 7 / 8, by + 21);
        }
        var x = cx + (cellW - 220) / 2;
        self._drawWaferMiniValue(ctx, x, y + 30, 220, cellH - 42, recs, p);
      }
    }

    this._updateProgress(100, '完成', '');
    await this._delay(50);
    var a = document.createElement('a');
    a.download = '参数分布_' + (lotVal === '全部批次' ? 'ALL' : lotVal) + '.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
    this._hideProgress();
  }

  // 导出Excel：每参数一行(25片MAP横排)，配色同网页MAP渐变(绿→橙)，BIN不合格=黑底白字
  async _exportAllWafersExcel() {
    if (!this.data.length) return;
    this._showProgress('生成Excel导出...');
    await this._delay(20);
    var lotVal = this.$('waferLot') ? this.$('waferLot').value : '全部批次';
    var allData = this.data;
    // 全部批次 = 每个批次一个Sheet；选中批次 = 仅该批次
    var lotGroups = [];
    if (lotVal === '全部批次') {
      var lotsAll = [...new Set(allData.map(function(r){ return r._Lot || '未知'; }))].sort();
      lotsAll.forEach(function(l) { lotGroups.push({ lot: l, recs: allData.filter(function(r){ return (r._Lot || '未知') === l; }) }); });
    } else {
      lotGroups.push({ lot: lotVal, recs: allData.filter(function(r){ return r._Lot === lotVal; }) });
    }
    lotGroups = lotGroups.filter(function(g) { return g.recs.length > 0; });
    if (!lotGroups.length) { alert('无圆片数据'); return; }
    var params = this.params;
    var product = this.data[0] ? this.data[0]._Product : '';

    function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
    function getRow(r) { return parseInt(r.Row) || parseInt(r.row) || parseInt(r.Y) || parseInt(r.y) || parseInt(r.YCoord) || parseInt(r.ycoord) || 0; }
    function getCol(r) { return parseInt(r.Col) || parseInt(r.col) || parseInt(r.X) || parseInt(r.x) || parseInt(r.XCoord) || parseInt(r.xcoord) || 0; }
    function fmtV(v) { return Math.abs(v) < 0.001 ? v.toExponential(2) : (+v.toFixed(4)).toString(); }
    // 统计计算
    function calcStats(recs, p) {
      var vals = recs.map(function(r) { return parseFloat(r[p]); }).filter(function(v) { return !isNaN(v); });
      if (!vals.length) return null;
      var n = vals.length, sum = 0;
      for (var i = 0; i < n; i++) sum += vals[i];
      var avg = sum / n;
      var sq = 0;
      for (var i = 0; i < n; i++) { var d = vals[i] - avg; sq += d * d; }
      var std = Math.sqrt(sq / (n - 1));
      var sorted = vals.slice().sort(function(a, b) { return a - b; });
      var med = sorted[Math.floor(n / 2)];
      var mads = sorted.map(function(v) { return Math.abs(v - med); }).sort(function(a, b) { return a - b; });
      var rstd = mads[Math.floor(n / 2)] * 1.4826;
      var f = function(v) { return Math.abs(v) < 0.001 ? v.toExponential(2) : (+v.toFixed(4)).toString(); };
      return { avg: f(avg), std: f(std), med: f(med), rstd: f(rstd) };
    }

    // 渐变配色样式：g0..g9 (绿→橙，同网页MAP)
    function hex2(n) { return ('0' + n.toString(16)).slice(-2); }
    function gradColor(ratio) {
      var r = Math.round(46 + ratio * 189), g = Math.round(204 - ratio * 100), b = Math.round(113 - ratio * 100);
      return '#' + hex2(r) + hex2(g) + hex2(b);
    }

    var xml = '<?xml version="1.0"?>\n<?mso-application progid="Excel.Sheet"?>\n';
    xml += '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">\n';
    xml += '<Styles>';
    for (var gi = 0; gi <= 9; gi++) {
      xml += '<Style ss:ID="g' + gi + '"><Interior ss:Color="' + gradColor(gi / 9) + '" ss:Pattern="Solid"/><Alignment ss:Horizontal="Center"/></Style>';
    }
    xml += '<Style ss:ID="binfail"><Interior ss:Color="#000000" ss:Pattern="Solid"/><Font ss:Color="#FFFFFF" ss:Bold="1"/><Alignment ss:Horizontal="Center"/></Style>';
    xml += '<Style ss:ID="empty"><Interior ss:Color="#F2F2F2" ss:Pattern="Solid"/></Style>';
    xml += '<Style ss:ID="hdr"><Font ss:Bold="1"/><Interior ss:Color="#D9E1F2" ss:Pattern="Solid"/><Alignment ss:Horizontal="Center"/></Style>';
    xml += '<Style ss:ID="ptitle"><Font ss:Bold="1" ss:Size="12" ss:Color="#2F6FED"/></Style>';
    xml += '<Style ss:ID="wtitle"><Font ss:Bold="1" ss:Color="#1F2933"/></Style>';
    xml += '</Styles>\n';

    var selfE = this;
    for (var gi2 = 0; gi2 < lotGroups.length; gi2++) {
      var g = lotGroups[gi2];
      var recsAll = g.recs;
      var wafers = [...new Set(recsAll.map(function(r){ return r._Wafer; }))].filter(Boolean).sort(function(a,b){ return parseInt(a)-parseInt(b); });
      xml += '<Worksheet ss:Name="' + esc(String(g.lot).slice(0, 28)) + '">\n<Table>\n';
      xml += '<Row><Cell ss:StyleID="ptitle"><Data ss:Type="String">批次: ' + esc(g.lot) + '  日期: ' + new Date().toLocaleDateString() + '  圆片数: ' + wafers.length + '</Data></Cell></Row>\n';

      // 每参数的数据缓存（按圆片预构建grid）
      for (var pi2 = 0; pi2 < params.length; pi2++) {
        var p = params[pi2];
        selfE._updateProgress(Math.round((gi2 * params.length + pi2 + 1) / (params.length * lotGroups.length) * 100), '导出Excel中', g.lot + ' ' + p);
        await selfE._delay(2);
        var spec = null;
        if (product && SPEC_LIMITS[product] && SPEC_LIMITS[product][p]) spec = SPEC_LIMITS[product][p];
        xml += '<Row><Cell ss:StyleID="ptitle"><Data ss:Type="String">参数: ' + esc(p) + (spec ? '  [LSL=' + (spec[0]!=null?spec[0]:'-') + ', USL=' + (spec[1]!=null?spec[1]:'-') + ']' : '') + '</Data></Cell></Row>\n';

        // 批次内该参数全范围（保证同一行颜色可比）
        var allVals = [];
        var wfData = wafers.map(function(w) {
          var recs = recsAll.filter(function(r) { return r._Wafer === w; });
          var rows = [...new Set(recs.map(getRow))].filter(function(v){ return v !== 0; }).sort(function(a,b){ return a-b; });
          var cols = [...new Set(recs.map(getCol))].filter(function(v){ return v !== 0; }).sort(function(a,b){ return a-b; });
          var grid = {};
          recs.forEach(function(r) { var rr = getRow(r), cc = getCol(r); if (!rr || !cc) return; if (!grid[rr]) grid[rr] = {}; grid[rr][cc] = r; });
          rows.forEach(function(rr) { cols.forEach(function(cc) { var r = grid[rr] && grid[rr][cc]; if (r) { var v = parseFloat(r[p]); if (!isNaN(v)) allVals.push(v); } }); });
          return { w: w, rows: rows, cols: cols, grid: grid, recs: recs };
        }).filter(function(d) { return d.rows.length && d.cols.length; });
        var vMin = allVals.length ? Math.min.apply(null, allVals) : 0;
        var vMax = allVals.length ? Math.max.apply(null, allVals) : 1;

      // 统一行号（所有圆片并集）
      var unionRows = [];
      wfData.forEach(function(d) { d.rows.forEach(function(r) { if (unionRows.indexOf(r) < 0) unionRows.push(r); }); });
      unionRows.sort(function(a,b){ return a-b; });

      // 表头行：每个圆片块 = [Y\X + X坐标]
      var hdrCells = '';
      wfData.forEach(function(d) {
        hdrCells += '<Cell ss:StyleID="wtitle"><Data ss:Type="String">W' + esc(d.w) + '</Data></Cell>';
        hdrCells += '<Cell ss:StyleID="hdr"><Data ss:Type="String">Y\\X</Data></Cell>';
        hdrCells += d.cols.map(function(c){ return '<Cell ss:StyleID="hdr"><Data ss:Type="Number">' + c + '</Data></Cell>'; }).join('');
      });
      xml += '<Row>' + hdrCells + '</Row>\n';

      // 数据行：每个圆片块 = [Y + 值列] + 右侧统计列(AVG/STD/MED/RSTD 各占一行，前4行)
      unionRows.forEach(function(rr, ri) {
        var cells = '';
        wfData.forEach(function(d, wi) {
          var idx = d.rows.indexOf(rr);
          cells += '<Cell ss:StyleID="hdr"><Data ss:Type="Number">' + (idx >= 0 ? rr : '') + '</Data></Cell>';
          d.cols.forEach(function(cc) {
            var r = d.grid[rr] && d.grid[rr][cc];
            if (!r) { cells += '<Cell ss:StyleID="empty"/>'; return; }
            var v = parseFloat(r[p]);
            if (isNaN(v)) { cells += '<Cell ss:StyleID="empty"/>'; return; }
            var style;
            if (r._Bin !== 1) style = 'binfail';
            else {
              var ratio = vMax > vMin ? (v - vMin) / (vMax - vMin) : 0.5;
              style = 'g' + Math.max(0, Math.min(9, Math.round(ratio * 9)));
            }
            cells += '<Cell ss:StyleID="' + style + '"><Data ss:Type="String">' + fmtV(v) + '</Data></Cell>';
          });
          // 右侧统计：批次/片号/参数列 + AVG/STD/MED/RSTD 各占一行
          var st = calcStats(d.recs, p);
          var lotName = d.recs.length ? (d.recs[0]._Lot || '--') : '--';
          if (ri === 0) cells += '<Cell ss:StyleID="hdr"><Data ss:Type="String">批次</Data></Cell><Cell><Data ss:Type="String">' + esc(lotName) + '</Data></Cell>';
          else if (ri === 1) cells += '<Cell ss:StyleID="hdr"><Data ss:Type="String">片号</Data></Cell><Cell><Data ss:Type="String">' + esc(d.w) + '</Data></Cell>';
          else if (ri === 2) cells += '<Cell ss:StyleID="hdr"><Data ss:Type="String">参数列</Data></Cell><Cell><Data ss:Type="String">' + esc(p) + '</Data></Cell>';
          else if (ri === 3) cells += '<Cell ss:StyleID="hdr"><Data ss:Type="String">AVG</Data></Cell><Cell><Data ss:Type="String">' + (st ? st.avg : '--') + '</Data></Cell>';
          else if (ri === 4) cells += '<Cell ss:StyleID="hdr"><Data ss:Type="String">STD</Data></Cell><Cell><Data ss:Type="String">' + (st ? st.std : '--') + '</Data></Cell>';
          else if (ri === 5) cells += '<Cell ss:StyleID="hdr"><Data ss:Type="String">MED</Data></Cell><Cell><Data ss:Type="String">' + (st ? st.med : '--') + '</Data></Cell>';
          else if (ri === 6) cells += '<Cell ss:StyleID="hdr"><Data ss:Type="String">RSTD</Data></Cell><Cell><Data ss:Type="String">' + (st ? st.rstd : '--') + '</Data></Cell>';
          else cells += '<Cell ss:StyleID="empty"/><Cell ss:StyleID="empty"/>';
        });
        xml += '<Row>' + cells + '</Row>\n';
        });
      }
      await selfE._delay(2);

      xml += '</Table>\n</Worksheet>\n';
    }

    xml += '</Workbook>';
    this._updateProgress(100, '完成', '');
    await this._delay(50);
    var blob = new Blob([xml], { type: 'application/vnd.ms-excel;charset=utf-8;' });
    var a = document.createElement('a');
    a.download = '圆片MAP_' + (lotVal === '全部批次' ? 'ALL' : lotVal) + '.xls';
    a.href = URL.createObjectURL(blob);
    a.click();
    this._hideProgress();
  }

  // 迷你MAP（参数模式带芯片数值标注）
  _drawWaferMiniValue(ctx, x, y, w, h, recs, wpVal) {
    var getRow = function(r) { return parseInt(r.Row) || parseInt(r.row) || parseInt(r.Y) || parseInt(r.y) || parseInt(r.YCoord) || parseInt(r.ycoord) || 0; };
    var getCol = function(r) { return parseInt(r.Col) || parseInt(r.col) || parseInt(r.X) || parseInt(r.x) || parseInt(r.XCoord) || parseInt(r.xcoord) || 0; };
    var rows = [...new Set(recs.map(getRow))].filter(function(v){ return v !== 0; }).sort(function(a,b){ return a-b; });
    var cols = [...new Set(recs.map(getCol))].filter(function(v){ return v !== 0; }).sort(function(a,b){ return a-b; });
    if (!rows.length || !cols.length) return;
    var grid = {};
    recs.forEach(function(r) {
      var row = getRow(r), col = getCol(r);
      if (!row || !col) return;
      if (!grid[row]) grid[row] = {};
      grid[row][col] = r;
    });
    var allVals = recs.map(function(r) { return parseFloat(r[wpVal]); }).filter(function(v) { return !isNaN(v); }).sort(function(a,b){ return a-b; });
    var vMin = allVals.length ? allVals[0] : 0, vMax = allVals.length ? allVals[allVals.length - 1] : 1;
    var cell = Math.max(3, Math.floor(Math.min((w - 8) / cols.length, (h - 8) / rows.length)));
    var ox = x + (w - cols.length * cell) / 2, oy = y + (h - rows.length * cell) / 2;
    rows.forEach(function(row, ri) {
      cols.forEach(function(col, ci) {
        var r = grid[row] && grid[row][col];
        var px = ox + ci * cell, py = oy + ri * cell;
        if (!r) { ctx.fillStyle = '#eef1f5'; ctx.fillRect(px, py, Math.max(1, cell - 1), Math.max(1, cell - 1)); return; }
        var v = parseFloat(r[wpVal]);
        if (isNaN(v)) { ctx.fillStyle = '#eef1f5'; }
        else {
          var ratio = vMax > vMin ? (v - vMin) / (vMax - vMin) : 0.5;
          var rr = Math.round(46 + ratio * 189), gg = Math.round(204 - ratio * 100), bb = Math.round(113 - ratio * 100);
          ctx.fillStyle = 'rgb(' + rr + ',' + gg + ',' + bb + ')';
        }
        ctx.fillRect(px, py, Math.max(1, cell - 1), Math.max(1, cell - 1));
        // 数值标注（自适应精度，保证在格内）
        if (cell >= 6) {
          var fontSize = Math.min(cell - 1, Math.max(6, Math.round(cell * 0.45)));
          var label = '';
          if (!isNaN(v)) {
            if (Math.abs(v) >= 100) label = v.toFixed(0);
            else if (Math.abs(v) >= 10) label = v.toFixed(1);
            else if (Math.abs(v) >= 1) label = v.toFixed(2);
            else if (v === 0) label = '0';
            else label = v.toExponential(1);
          }
          if (label) {
            ctx.font = fontSize + 'px sans-serif';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            // 白描边提高可读性
            ctx.lineWidth = Math.max(1, fontSize * 0.2);
            ctx.strokeStyle = '#ffffff';
            ctx.strokeText(label, px + cell / 2, py + cell / 2);
            ctx.fillStyle = '#111827';
            ctx.fillText(label, px + cell / 2, py + cell / 2);
          }
        }
      });
    });
  }

  _calcStats(recs, wpVal) {
    if (wpVal === 'bin') return null;
    var vals = recs.map(function(r) { return parseFloat(r[wpVal]); }).filter(function(v) { return !isNaN(v); });
    if (!vals.length) return null;
    var n = vals.length, sum = 0;
    for (var i = 0; i < n; i++) sum += vals[i];
    var avg = sum / n;
    var sq = 0;
    for (var i = 0; i < n; i++) { var d = vals[i] - avg; sq += d * d; }
    var std = Math.sqrt(sq / (n - 1));
    var sorted = vals.slice().sort(function(a, b) { return a - b; });
    var med = sorted[Math.floor(n / 2)];
    var mads = sorted.map(function(v) { return Math.abs(v - med); }).sort(function(a, b) { return a - b; });
    var rstd = mads[Math.floor(n / 2)] * 1.4826;
    var fmt = function(v) { return Math.abs(v) < 0.001 ? v.toExponential(3) : v.toFixed(4); };
    return { avg: fmt(avg), std: fmt(std), med: fmt(med), rstd: fmt(rstd) };
  }

  // 构建单个圆片的 BIN NEW MAP 文本块（华虹格式）
  _buildBinMapBlock(recs) {
    var getRow = function(r) { return parseInt(r.Row) || parseInt(r.row) || parseInt(r.Y) || parseInt(r.y) || parseInt(r.YCoord) || parseInt(r.ycoord) || 0; };
    var getCol = function(r) { return parseInt(r.Col) || parseInt(r.col) || parseInt(r.X) || parseInt(r.x) || parseInt(r.XCoord) || parseInt(r.xcoord) || 0; };
    var rows = [...new Set(recs.map(getRow))].filter(function(v) { return v !== 0; }).sort(function(a, b) { return a - b; });
    var cols = [...new Set(recs.map(getCol))].filter(function(v) { return v !== 0; }).sort(function(a, b) { return a - b; });
    if (!rows.length || !cols.length) return null;
    var minCol = cols[0], maxCol = cols[cols.length - 1];
    var grid = {};
    recs.forEach(function(r) { var rr = getRow(r), cc = getCol(r); if (!rr || !cc) return; if (!grid[rr]) grid[rr] = {}; grid[rr][cc] = r; });
    var lines = [];
    lines.push('Lot ID:' + (recs[0]._Lot || ''));
    lines.push('Wafer ID:' + (recs[0]._Wafer || ''));
    lines.push('Notch side:D');
    lines.push('NEW MAP');
    var failN = 0, goodN = 0;
    rows.forEach(function(rr) {
      var line = '';
      for (var cc = minCol; cc <= maxCol; cc++) {
        var r = grid[rr] && grid[rr][cc];
        if (!r) { line += '.'; }
        else if (r._Bin === 1) { line += '1'; goodN++; }
        else { line += 'X'; failN++; }
      }
      lines.push(line);
    });
    lines.push('END MAP');
    lines.push('Failed Die(X)  :' + String(failN).padStart(16));
    lines.push('CP Good Die(1) :' + String(goodN).padStart(16));
    return lines;
  }

  // 导出当前批次+圆片的 BIN NEW MAP TXT（华虹格式）
  _exportBinTxt() {
    if (!this.data.length) { alert('无数据'); return; }

    var recs = recsAll.filter(function(r) { return r._Wafer === wfVal; });
    if (!recs.length) { alert('该圆片无数据'); return; }
    var block = this._buildBinMapBlock(recs);

    var blob = new Blob([block.join('\n')], { type: 'text/plain;charset=utf-8;' });

  }

  // 生成 ZIP 压缩包（STORE 无压缩 + CRC32，浏览器原生可用）
  _buildZip(files) {
    var enc = new TextEncoder();
    var crcTbl = null;
    var crc32 = function(data) {
      if (!crcTbl) {
        crcTbl = new Uint32Array(256);
        for (var i = 0; i < 256; i++) {
          var c = i;
          for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
          crcTbl[i] = c >>> 0;
        }
      }
      var crc = 0xFFFFFFFF;
      for (var j = 0; j < data.length; j++) crc = (crc >>> 8) ^ crcTbl[(crc ^ data[j]) & 0xFF];
      return (crc ^ 0xFFFFFFFF) >>> 0;
    };
    var now = new Date();
    var dosTime = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
    var dosDate = ((Math.max(now.getFullYear(), 1980) - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
    var parts = [], central = [], offset = 0;
    files.forEach(function(f) {
      var nameBytes = enc.encode(f.name);
      var data = enc.encode(f.content);
      var crc = crc32(data);
      // Local File Header
      var lh = new Uint8Array(30 + nameBytes.length);
      var dv = new DataView(lh.buffer);
      dv.setUint32(0, 0x04034b50, true); dv.setUint16(4, 20, true); dv.setUint16(6, 0, true);
      dv.setUint16(8, 0, true); dv.setUint16(10, dosTime, true); dv.setUint16(12, dosDate, true);
      dv.setUint32(14, crc, true); dv.setUint32(18, data.length, true); dv.setUint32(22, data.length, true);
      dv.setUint16(26, nameBytes.length, true); dv.setUint16(28, 0, true);
      lh.set(nameBytes, 30);
      // Central Directory Header
      var ch = new Uint8Array(46 + nameBytes.length);
      var dv2 = new DataView(ch.buffer);
      dv2.setUint32(0, 0x02014b50, true); dv2.setUint16(4, 20, true); dv2.setUint16(6, 20, true);
      dv2.setUint16(8, 0, true); dv2.setUint16(10, 0, true);
      dv2.setUint16(12, dosTime, true); dv2.setUint16(14, dosDate, true);
      dv2.setUint32(16, crc, true); dv2.setUint32(20, data.length, true); dv2.setUint32(24, data.length, true);
      dv2.setUint16(28, nameBytes.length, true); dv2.setUint16(30, 0, true); dv2.setUint16(32, 0, true);
      dv2.setUint16(34, 0, true); dv2.setUint16(36, 0, true); dv2.setUint32(38, 0, true);
      dv2.setUint32(42, offset, true);
      ch.set(nameBytes, 46);
      parts.push(lh, data); central.push(ch);
      offset += lh.length + data.length;
    });
    var cdSize = 0;
    central.forEach(function(c) { cdSize += c.length; });
    var eocd = new Uint8Array(22);
    var dv3 = new DataView(eocd.buffer);
    dv3.setUint32(0, 0x06054b50, true); dv3.setUint16(4, 0, true); dv3.setUint16(6, 0, true);
    dv3.setUint16(8, files.length, true); dv3.setUint16(10, files.length, true);
    dv3.setUint32(12, cdSize, true); dv3.setUint32(16, offset, true); dv3.setUint16(20, 0, true);
    return new Blob(parts.concat(central).concat([eocd]), { type: 'application/zip' });
  }

  // 批量导出：全部批次 × 全部圆片 → 一片一个 TXT 文件，打包 ZIP
  _exportBinTxtAll() {
    if (!this.data.length) { alert('无数据'); return; }
    this._showProgress('打包ZIP导出中...');
    var lots = [...new Set(this.data.map(function(r) { return r._Lot || '未知'; }))].sort();
    var files = [];
    var total = 0;
    var self = this;
    lots.forEach(function(l) {
      var lrecs = self.data.filter(function(r) { return (r._Lot || '未知') === l; });
      var wfs = [...new Set(lrecs.map(function(r) { return r._Wafer; }))].filter(Boolean).sort(function(a, b) { return parseInt(a) - parseInt(b); });
      wfs.forEach(function(w) {
        var recs = lrecs.filter(function(r) { return r._Wafer === w; });
        var block = self._buildBinMapBlock(recs);
        if (block) {
          files.push({ name: l + '_' + w + '_BINMAP.txt', content: block.join('\n') });
          total++;
        }
      });
    });
    if (!files.length) { this._hideProgress(); alert('无坐标数据'); return; }
    var blob = this._buildZip(files);
    var a = document.createElement('a');
    a.download = 'ALL_BINMAP_' + total + '片.zip';
    a.href = URL.createObjectURL(blob);
    a.click();
    this._hideProgress();
  }

  _drawWaferMini(ctx, x, y, w, h, recs, wpVal) {
    var getRow = function(r) { return parseInt(r.Row) || parseInt(r.row) || parseInt(r.Y) || parseInt(r.y) || parseInt(r.YCoord) || parseInt(r.ycoord) || 0; };
    var getCol = function(r) { return parseInt(r.Col) || parseInt(r.col) || parseInt(r.X) || parseInt(r.x) || parseInt(r.XCoord) || parseInt(r.xcoord) || 0; };
    var rows = [...new Set(recs.map(getRow))].filter(function(v){ return v !== 0; }).sort(function(a,b){ return a-b; });
    var cols = [...new Set(recs.map(getCol))].filter(function(v){ return v !== 0; }).sort(function(a,b){ return a-b; });
    if (!rows.length || !cols.length) {
      ctx.fillStyle = '#7a8ba0'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('无坐标', x + w / 2, y + h / 2);
      return;
    }
    var grid = {};
    recs.forEach(function(r) {
      var row = getRow(r), col = getCol(r);
      if (!row || !col) return;
      if (!grid[row]) grid[row] = {};
      grid[row][col] = r;
    });
    // 颜色范围
    var allVals = [];
    if (wpVal !== 'bin') {
      allVals = recs.map(function(r) { return parseFloat(r[wpVal]); }).filter(function(v) { return !isNaN(v); }).sort(function(a,b){ return a-b; });
    }
    var vMin = allVals.length ? allVals[0] : 0, vMax = allVals.length ? allVals[allVals.length - 1] : 1;
    var getColor = function(r) {
      if (!r) return '#1a2735';
      if (wpVal === 'bin') {
        var bc = BIN_COLORS[r._Bin] || BIN_COLORS[999];
        return bc.color;
      }
      var v = parseFloat(r[wpVal]);
      if (isNaN(v)) return '#1a2735';
      var ratio = vMax > vMin ? (v - vMin) / (vMax - vMin) : 0.5;
      var rr = Math.round(46 + ratio * 189), gg = Math.round(204 - ratio * 100), bb = Math.round(113 - ratio * 100);
      return 'rgb(' + rr + ',' + gg + ',' + bb + ')';
    };
    var cell = Math.max(3, Math.floor(Math.min((w - 20) / cols.length, (h - 20) / rows.length)));
    var ox = x + (w - cols.length * cell) / 2, oy = y + (h - rows.length * cell) / 2;
    rows.forEach(function(row, ri) {
      cols.forEach(function(col, ci) {
        var r = grid[row] && grid[row][col];
        ctx.fillStyle = getColor(r);
        ctx.fillRect(ox + ci * cell, oy + ri * cell, Math.max(1, cell - 1), Math.max(1, cell - 1));
      });
    });
  }

  _drawWafer() {
    const canvas = this.$('waferCanvas');
    const ctx = canvas.getContext('2d');
    const wsVal = this.$('waferSelect').value;
    const wpVal = this.$('waferParam').value;
    if (wsVal.startsWith('--')) { ctx.clearRect(0,0,canvas.width,canvas.height); return; }

    const lotVal = this.$('waferLot') ? this.$('waferLot').value : '全部批次';
    var recsAll = lotVal === '全部批次' ? this.data : this.data.filter(r => r._Lot === lotVal);
    const recs = recsAll.filter(r => r._Wafer === wsVal);
    this._updateWaferLegend(wpVal, recs);
    const getRow = r => parseInt(r.Row) || parseInt(r.row) || parseInt(r.Y) || parseInt(r.y) || parseInt(r.YCoord) || parseInt(r.ycoord) || 0;
    const getCol = r => parseInt(r.Col) || parseInt(r.col) || parseInt(r.X) || parseInt(r.x) || parseInt(r.XCoord) || parseInt(r.xcoord) || 0;
    const rows = [...new Set(recs.map(getRow))].filter(v=>v!==0).sort((a,b)=>a-b);
    const cols = [...new Set(recs.map(getCol))].filter(v=>v!==0).sort((a,b)=>a-b);
    if (!rows.length || !cols.length) { ctx.clearRect(0,0,canvas.width,canvas.height); ctx.fillStyle='#7a8ba0'; ctx.font='14px sans-serif'; ctx.textAlign='center'; ctx.fillText('无 Row/Col/X/Y 坐标数据',canvas.width/2,canvas.height/2); return; }

    // 固定画布大小 + 缩放内容（默认显示完整圆片）
    const W = Math.max(400, canvas.parentElement.clientWidth - 20);
    const H = 500;
    canvas.width = W * (window.devicePixelRatio || 1);
    canvas.height = H * (window.devicePixelRatio || 1);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    const ctx2 = canvas.getContext('2d');
    ctx2.setTransform((window.devicePixelRatio || 1), 0, 0, (window.devicePixelRatio || 1), 0, 0);

    // 自动计算格子大小以完整显示所有格子
    this._waferZoom = this._waferZoom || 1;
    const fitCellW = Math.floor((W - 20) / (cols.length + 1));
    const fitCellH = Math.floor((H - 50) / (rows.length + 1));
    const autoCell = Math.min(fitCellW, fitCellH);
    const cellW = Math.max(4, Math.round(autoCell * (this._waferZoom || 1)));
    const cellH = cellW;
    const ox = (W - (cols.length + 1) * cellW) / 2 + 10;
    const oy = (H - (rows.length + 1) * cellH) / 2 + 10;

    ctx2.clearRect(0, 0, W, H);
    ctx2.fillStyle = '#0f1923'; ctx2.fillRect(0, 0, W, H);

    // Build lookup
    const grid = {};
    recs.forEach(r => {
      const row = getRow(r), col = getCol(r);
      if (!row || !col) return;
      if (!grid[row]) grid[row] = {};
      grid[row][col] = r;
    });

    const getColor = (r) => {
      if (!r) return '#1a2735';
      if (wpVal === 'bin') {
        const bc = BIN_COLORS[r._Bin] || BIN_COLORS[999];
        return bc.color;
      }
      const v = parseFloat(r[wpVal]);
      if (isNaN(v)) return '#1a2735';
      const allVals = recs.map(x => parseFloat(x[wpVal])).filter(x => !isNaN(x)).sort((a,b) => a-b);
      if (!allVals.length) return '#1a2735';
      const cMinInput = this.$('waferCMin').value, cMaxInput = this.$('waferCMax').value;
      const min = cMinInput !== '' ? +cMinInput : allVals[0];
      const max = cMaxInput !== '' ? +cMaxInput : allVals[allVals.length-1];
      const ratio = max > min ? (v - min) / (max - min) : 0.5;
      const r_ = Math.round(46 + ratio * 189);
      const g_ = Math.round(204 - ratio * 100);
      const b_ = Math.round(113 - ratio * 100);
      return `rgb(${r_},${g_},${b_})`;
    };

    // 批量渲染优化：先画所有背景色
    rows.forEach((row, ri) => {
      cols.forEach((col, ci) => {
        const r = grid[row] && grid[row][col];
        ctx2.fillStyle = getColor(r);
        ctx2.fillRect(ox + ci * cellW, oy + ri * cellH, Math.max(1, cellW - 1), Math.max(1, cellH - 1));
      });
    });
    // 第二遍标注文字
    const showText = cellW >= 10;
    if (showText) {
      rows.forEach((row, ri) => {
        cols.forEach((col, ci) => {
          const r = grid[row] && grid[row][col];
          if (!r) return;
          const cx = ox + ci * cellW + cellW/2, cy = oy + ri * cellH + cellH/2;
          if (wpVal === 'bin') {
          const isBad = r._Bin !== 1;
          if (isBad) {
            ctx2.strokeStyle = '#fff'; ctx2.lineWidth = 1.5;
            ctx2.strokeRect(ox + ci * cellW + 0.5, oy + ri * cellH + 0.5, Math.max(1, cellW - 2), Math.max(1, cellH - 2));
            ctx2.fillStyle = '#fff';
            ctx2.font = `bold ${Math.max(8, cellW * 0.4)}px sans-serif`;
            ctx2.textAlign = 'center'; ctx2.textBaseline = 'middle';
            ctx2.fillText(r._Bin, cx, cy);
          }
          } else if (wpVal !== 'bin') {
            ctx2.fillStyle = '#000';
            ctx2.font = `${Math.max(6, cellW * 0.25)}px sans-serif`;
            ctx2.textAlign = 'center'; ctx2.textBaseline = 'middle';
            const v = parseFloat(r[wpVal]);
            if (!isNaN(v)) ctx2.fillText(v < 0.001 ? v.toExponential(1) : v.toFixed(3), cx, cy);
          }
        });
      });
    }

    // BIN 图例
    const legendY = oy + rows.length * cellH + 8;
    ctx2.fillStyle = '#7a8ba0'; ctx2.font = '9px sans-serif';
    if (wpVal === 'bin') {
      ctx2.fillText('BIN 1=PASS | 3=IGSS | 7=BVDSS | 9=IDSS | 11=VTH | 18=CONT | 250=RDSON', ox, legendY);
    }

    // 统计信息框（左上角，不影响圆片显示）
    var st = this._waferStats;
    if (st && wpVal !== 'bin') {
      var fmtS = function(v) { return Math.abs(v) < 0.001 ? v.toExponential(3) : v.toFixed(4); };
      var bx = 10, by = 10, bw2 = 168, bh2 = 88;
      ctx2.fillStyle = 'rgba(15,25,35,0.78)';
      ctx2.fillRect(bx, by, bw2, bh2);
      ctx2.strokeStyle = 'rgba(77,171,247,0.6)';
      ctx2.lineWidth = 1;
      ctx2.strokeRect(bx + 0.5, by + 0.5, bw2 - 1, bh2 - 1);
      ctx2.fillStyle = '#4dabf7';
      ctx2.font = 'bold 10px sans-serif';
      ctx2.textAlign = 'left'; ctx2.textBaseline = 'alphabetic';
      ctx2.fillText(wpVal, bx + 8, by + 15);
      ctx2.fillStyle = '#c8d6e5';
      ctx2.font = '9px sans-serif';
      ctx2.fillText('AVG: ' + fmtS(st.avg), bx + 8, by + 32);
      ctx2.fillText('STD: ' + fmtS(st.std), bx + 8, by + 46);
      ctx2.fillText('MEDIAN: ' + fmtS(st.med), bx + 8, by + 60);
      ctx2.fillText('ROBUST STD: ' + fmtS(st.robustStd), bx + 8, by + 74);
    }
  }

  _zoomWafer(delta) {
