  const style = document.createElement('style');
  style.id = STYLE_ID;
  style.textContent = `
.vdmos-tool .vt-version { position:fixed; top:8px; right:12px; z-index:9999; padding:2px 10px; border-radius:10px; font-size:0.72rem; font-weight:600; letter-spacing:0.5px; background:var(--vt-accent,#4dabf7); color:#fff; box-shadow:0 1px 4px rgba(0,0,0,.35); pointer-events:none; user-select:none; }
.vdmos-tool { --vt-bg:#0f1923; --vt-surface:#1a2735; --vt-border:#2a3a4a; --vt-text:#c8d6e5; --vt-muted:#7a8ba0; --vt-accent:#4dabf7; --vt-good:#2ecc71; --vt-fail:#e74c3c; --vt-sidebar:#111a24; --vt-row-hover:#1e3040; --vt-value:#ffffff; font-family:'Segoe UI','Microsoft YaHei',sans-serif; background:var(--vt-bg,#0f1923); color:var(--vt-text,#c8d6e5); min-height:100%; }
.vdmos-tool[data-vt-theme="light"] { --vt-bg:#f3f5f8; --vt-surface:#ffffff; --vt-border:#dfe4ea; --vt-text:#1f2933; --vt-muted:#6b7686; --vt-accent:#2f6fed; --vt-good:#1a9e5c; --vt-fail:#d64545; --vt-sidebar:#1f2937; --vt-row-hover:#f0f3f7; --vt-value:#111827; }
.vdmos-tool[data-vt-theme="teal"] { --vt-bg:#0b1220; --vt-surface:#111c30; --vt-border:#1e3352; --vt-text:#dde7f3; --vt-muted:#8fa3bd; --vt-accent:#2dd4bf; --vt-good:#34d399; --vt-fail:#f87171; --vt-sidebar:#0a1424; --vt-row-hover:#16263e; --vt-value:#f1f5f9; }
.vdmos-tool * { margin:0; padding:0; box-sizing:border-box; }
.vdmos-tool .vt-upload { background:var(--vt-surface,#1a2735); border:2px dashed var(--vt-border,#2a3a4a); border-radius:12px; padding:32px; text-align:center; cursor:pointer; transition:all .2s; margin-bottom:16px; }
.vdmos-tool .vt-upload:hover,.vdmos-tool .vt-upload.dragover { border-color:var(--vt-accent,#4dabf7); }
.vdmos-tool .vt-upload input[type=file] { display:none; }
.vdmos-tool .vt-upload .vt-icon { font-size:2.5rem; margin-bottom:8px; }
.vdmos-tool .vt-upload p { color:var(--vt-muted,#7a8ba0); font-size:0.85rem; }
.vdmos-tool .vt-row { display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap; align-items:center; }
.vdmos-tool .vt-row select,.vdmos-tool .vt-row input { background:var(--vt-surface,#1a2735); color:var(--vt-text,#c8d6e5); border:1px solid var(--vt-border,#2a3a4a); padding:8px 14px; border-radius:8px; font-size:0.85rem; }
.vdmos-tool .vt-btn { padding:8px 20px; border-radius:8px; font-size:0.85rem; font-weight:600; cursor:pointer; border:none; transition:all .2s; }
.vdmos-tool .vt-btn-primary { background:var(--vt-accent,#4dabf7); color:#fff; }
.vdmos-tool[data-vt-theme="light"] .vt-btn-primary { color:#fff; }
.vdmos-tool[data-vt-theme="light"] .vt-sidebar, .vdmos-tool[data-vt-theme="light"] .vt-sidebar select, .vdmos-tool[data-vt-theme="light"] .vt-sidebar input, .vdmos-tool[data-vt-theme="light"] .vt-sidebar .vt-btn-outline, .vdmos-tool[data-vt-theme="light"] .vt-sidebar .vt-upload p { color:#d1d9e2; }
.vdmos-tool[data-vt-theme="light"] .vt-sidebar .vt-btn-outline { border-color:#3a4657; }
.vdmos-tool[data-vt-theme="light"] .vt-sidebar .vt-upload { background:#243041; border-color:#3a4657; }
.vdmos-tool .vt-btn-primary:hover { background:#74c0fc; }
.vdmos-tool .vt-btn-outline { background:transparent; border:1px solid var(--vt-border,#2a3a4a); color:var(--vt-text,#c8d6e5); }
.vdmos-tool .vt-btn-outline:hover { border-color:var(--vt-accent,#4dabf7); }
.vdmos-tool .vt-stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(140px,1fr)); gap:8px; margin-bottom:12px; resize:vertical; overflow:auto; max-height:200px; min-height:60px; }
.vdmos-tool .vt-stat { background:var(--vt-surface,#1a2735); border:1px solid var(--vt-border,#2a3a4a); border-radius:8px; padding:10px 12px; cursor:default; }
.vdmos-tool .vt-stat .vt-label { font-size:0.7rem; color:var(--vt-muted,#7a8ba0); text-transform:uppercase; margin-bottom:4px; }
.vdmos-tool .vt-stat .vt-value { font-size:1.3rem; font-weight:700; color:var(--vt-value,#fff); }
.vdmos-tool .vt-stats::-webkit-resizer { border-width:6px; border-style:solid; border-color:transparent transparent var(--vt-muted,#7a8ba0) var(--vt-muted,#7a8ba0); }
.vdmos-tool .vt-stat .vt-good { color:var(--vt-good,#2ecc71); }
.vdmos-tool .vt-stat .vt-fail { color:var(--vt-fail,#e74c3c); }
.vdmos-tool .vt-tabs { display:flex; gap:0; margin-bottom:16px; border-bottom:2px solid var(--vt-border,#2a3a4a); }
.vdmos-tool .vt-tab { padding:8px 16px; cursor:pointer; color:var(--vt-muted,#7a8ba0); font-size:0.82rem; border-bottom:2px solid transparent; margin-bottom:-2px; transition:all .2s; user-select:none; }
.vdmos-tool .vt-tab:hover { color:var(--vt-value,#fff); }
.vdmos-tool .vt-tab.active { color:var(--vt-accent,#4dabf7); border-bottom-color:var(--vt-accent,#4dabf7); }
.vdmos-tool .vt-panel { display:none; }
.vdmos-tool .vt-panel.active { display:block; }
.vdmos-tool .vt-charts { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px; }

.vdmos-tool .vt-chart { background:var(--vt-surface,#1a2735); border:1px solid var(--vt-border,#2a3a4a); border-radius:10px; padding:14px; }

.vdmos-tool .vt-chart canvas { max-height:500px; min-height:300px; }
.vdmos-tool .vt-bin-grid { display:flex; flex-wrap:wrap; gap:5px; }
.vdmos-tool .vt-bin-item { background:var(--vt-surface,#1a2735); border:1px solid var(--vt-border,#2a3a4a); border-radius:8px; padding:8px 12px; min-width:90px; text-align:center; }
.vdmos-tool .vt-bin-item .vt-bid { font-size:0.65rem; color:var(--vt-muted,#7a8ba0); }
.vdmos-tool .vt-bin-item .vt-bcnt { font-size:1.1rem; font-weight:700; }
.vdmos-tool .vt-bin-item .vt-blbl { font-size:0.65rem; }
.vdmos-tool .vt-table-wrap { background:var(--vt-surface,#1a2735); border:1px solid var(--vt-border,#2a3a4a); border-radius:10px; overflow:hidden; }
.vdmos-tool .vt-table-scroll { overflow:auto; max-height:400px; }
.vdmos-tool .vt-table { width:100%; border-collapse:collapse; font-size:0.78rem; }

.vdmos-tool .vt-table tr:hover td { background:var(--vt-row-hover,#1e3040); }
.vdmos-tool .vt-compare { background:var(--vt-surface,#1a2735); border:1px solid var(--vt-border,#2a3a4a); border-radius:10px; padding:14px; margin-bottom:16px; }
.vdmos-tool .vt-compare h3 { font-size:0.8rem; color:var(--vt-muted,#7a8ba0); margin-bottom:8px; }
.vdmos-tool .vt-compare-table { width:100%; font-size:0.75rem; border-collapse:collapse; }
.vdmos-tool .vt-compare-table th { background:transparent; padding:5px 10px; color:var(--vt-muted,#7a8ba0); }

// Chart.js 动态加载
// ============================================================
let ChartJS = null;
function loadChartJS() {
  return new Promise(resolve => {
    if (ChartJS) return resolve(ChartJS);
    if (global.Chart) {
      ChartJS = global.Chart;
      // 一次性注册白色背景插件
      if (!VDMOSTool._bgPluginInstalled && ChartJS.register) {
        ChartJS.register({id:'whiteBg2',beforeDraw(chart){const c=chart.ctx;c.save();c.fillStyle='#ffffff';c.fillRect(0,0,chart.width,chart.height);c.restore();}});
        VDMOSTool._bgPluginInstalled = true;
      }
      if (!VDMOSTool._defsSet && ChartJS.defaults) {
        ChartJS.defaults.color = '#333'; ChartJS.defaults.borderColor = '#e0e0e0'; VDMOSTool._defsSet = true;
      }
      return resolve(ChartJS);
    }
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js';
    script.onload = () => { ChartJS = global.Chart; resolve(ChartJS); };
    script.onerror = () => { console.warn('Chart.js CDN failed'); resolve(null); };
    document.head.appendChild(script);
  });
}

  $(suffix) { return document.getElementById(this.id + '-' + suffix); }

  // ========== 事件绑定 ==========
  _bindEvents() {
    // Tabs
    this.root.querySelectorAll('.vt-tab').forEach(tab => {
      tab.addEventListener('click', () => this._switchTab(tab.dataset.vtTab));
    });

    // Upload
    const drop = this.$('drop');
    const fileIn = this.$('fileIn');
    drop.addEventListener('click', () => fileIn.click());
    drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('dragover'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('dragover'));
    drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('dragover'); if (e.dataTransfer.files.length) this.loadFiles(Array.from(e.dataTransfer.files)); });
    fileIn.addEventListener('change', e => { if (e.target.files.length) this.loadFiles(Array.from(e.target.files)); e.target.value = ''; });

    // Buttons
    this.$('btnReset').addEventListener('click', () => this.reset());
    if (this.$('mode')) this.$('mode').addEventListener('change', () => this._onModeChange());
    if (this.$('btnScatter')) this.$('btnScatter').addEventListener('click', () => this._updateScatter());
    if (this.$('btnExport')) this.$('btnExport').addEventListener('click', () => this._exportCompare());
    if (this.$('btnExportData')) this.$('btnExportData').addEventListener('click', () => this._exportData());
    this.$('btnSave').addEventListener('click', () => this._saveProject());
    this.$('btnLoad').addEventListener('click', () => this._loadProject());
    setTimeout(() => this._autoRestore(), 500);
    this._initResizer();
    this._initTheme();
  }

  _setTheme(name) {
    this._theme = name || 'dark';
    if (this.root) this.root.setAttribute('data-vt-theme', this._theme);
    try { localStorage.setItem('vdt_theme', this._theme); } catch(e) {}
    var sel = this.$('themeSel');
    if (sel) sel.value = this._theme;
  }

  _initTheme() {
    var t = 'dark';
    try { t = localStorage.getItem('vdt_theme') || 'dark'; } catch(e) {}
    this._setTheme(t);
  }

  _initResizer() {
    const r = this.$('resizer'), s = this.$('sidebar');
    if (!r || !s) return;
    let startX, startW, raf;
    r.addEventListener('mousedown', e => { startX=e.clientX; startW=s.offsetWidth; r.classList.add('active'); document.body.style.cursor='col-resize'; document.body.style.userSelect='none'; });
    document.addEventListener('mousemove', e => {
      if (!startW) return;
      if (raf) cancelAnimationFrame(raf);
      raf = requestAnimationFrame(() => { s.style.width = Math.max(160, Math.min(500, startW+e.clientX-startX)) + 'px'; });
    });
    document.addEventListener('mouseup', () => { startW=null; r.classList.remove('active'); document.body.style.cursor=''; document.body.style.userSelect=''; if(raf)cancelAnimationFrame(raf); });
  }

  // ========== 进度条 ==========
  _showProgress(title) {
    this.$('prog').classList.remove('vt-hide');
    this.$('progTitle').textContent = title;
    this._updateProgress(0, '', '');
  }
  _updateProgress(pct, step, sub) {
    this.$('progFill').style.width = Math.round(pct) + '%';
    this.$('progPct').textContent = Math.round(pct) + '%';
    if (step) this.$('progStep').textContent = step;
    if (sub) this.$('progSub').textContent = sub;
  }
  _hideProgress() { this.$('prog').classList.add('vt-hide'); }
  _debounce(fn, ms) { clearTimeout(this._debounceTimer); this._debounceTimer = setTimeout(fn, ms); }

  _onModeChange() {
    const mode = this.$('mode').value;
    const fmtSel = this.$('fmt');
    if (mode === 'cp') {
      fmtSel.innerHTML = '<option value="DCP">DCP 格式</option><option value="CW">CW 格式</option><option value="MEX">MEX 格式</option><option value="TSK">TSK 格式</option>';
    } else {
      fmtSel.innerHTML = '<option value="summary">汇总报表</option><option value="yield">良率报告</option>';
    }
  }
  _delay(ms) { return new Promise(r => setTimeout(r, ms || 15)); }

  // ========== 公共 API ==========
  async loadFiles(files) {
    if (!files || !files.length) return;
    this._showProgress('读取 ' + files.length + ' 个文件...');
    await this._delay(30);

    let texts = [];
    for (let i = 0; i < files.length; i++) {
      const f = files[i];
      this._updateProgress(Math.round(i/files.length*30), '读取中...', f.name);

      if (/\.zip$/i.test(f.name)) {
        // 解压 ZIP
        try {
          const entries = await this._readZip(f);
          entries.forEach(e => {
            if (/\.(csv|txt|dat|xls)$/i.test(e.name)) {
              texts.push({name: e.name.replace(/\.(csv|txt|dat)$/i,''), text: e.text});
            }
          });
          this._updateProgress(Math.round(i/files.length*30), '解压完成', f.name + ' → ' + entries.length + ' 个文件');
        } catch(e) { console.warn('ZIP read failed:', e); }
      } else if (/\.xlsx$/i.test(f.name)) {
        // XLSX: 昕致(Wafer ID) / 电基DC1(Item Name)
        try {
          const rows = await this._readXlsx(f);
          const isXinZhi = rows.some(r => r && String(r[0] || '').trim() === 'Wafer ID');
          if (isXinZhi) {
            texts.push({name: f.name, rows: rows});
          } else {
            // 电基DC1等PowerTECH风格: 转TSV走通用解析
            texts.push({name: f.name, text: rows.map(r => (r || []).join('\t')).join('\n')});
          }
          this._updateProgress(Math.round(i/files.length*30), 'XLSX读取完成', f.name);
        } catch(e) { console.warn('XLSX read failed:', e); }
      } else if (/\.rar$/i.test(f.name)) {
        this._updateProgress(Math.round(i/files.length*30), 'RAR暂不支持', f.name + ' (请先用其他工具解压)');
      } else {
        texts.push({name: f.name.replace(/\.(csv|txt|dat|xls)$/i,''), text: await this._readFile(f)});
      }
      await this._delay(15);
    }

    this._updateProgress(32, '解析中...', files.length + ' 个文件');
    await this._delay(20);

    // 彻底清除上次导入的状态（数据、标签、条件、报告、规格等）
    this._clearParseState();
    this.paramStats = {};
    this.data = []; this.headers = []; this.params = []; this.binStats = {}; this.files = [];
    let allHeaders = new Set();

    for (let i = 0; i < texts.length; i++) {
      const {name, text} = texts[i];
      this._updateProgress(32 + Math.round(i/texts.length*58), '解析中', (i+1)+'/'+texts.length);
      if (texts[i].rows) {
        this._parseXinZhi(texts[i].rows, name, allHeaders);
      } else {
        this._parseOne(text, name, allHeaders);
      }
      // 每个文件后让出主线程，避免UI卡死
      await this._delay(1);
    }

    this.headers = Array.from(allHeaders);
    const meta = ['product','lot','wafer','row','col','x','y','die','site','bin','result','status','no.u','no','serial','s','serial#','elapsed','elapsed time','elapsedtime','elapsed time(ms)','xcoord','ycoord','sortname','sortname#','binnum','site num','siteno','testno','test no.','coordinate','soft bin','hard bin','time[s]','fail item','s#','sort#','bin#','site#','serial num','hbin','sbin','x','y','test time','time','date','operator','tester','probe','handler','station','comment'];
    this.params = this.headers.filter(h => h && h.trim() !== '' && !meta.includes(h.toLowerCase()));

    this._updateProgress(90, '计算统计...', this.data.length.toLocaleString() + ' 条');
    await this._delay(20);
    this._computeStats();

    this._updateProgress(94, '渲染...', '');
    await this._delay(20);
    await loadChartJS();
    try { this._renderAll(); } catch(e) { this._renderFallback(); }

    this._renderFileList();
    this._renderCompare();

    this._updateProgress(99, '完成', this.data.length.toLocaleString() + ' 条, ' + this.files.length + ' 文件');
    await this._delay(200);
    this._updateProgress(100, '完成 ✓', '');
    await this._delay(250);
    this._hideProgress();
    this.$('results').classList.remove('vt-hide');
    this._emit('dataloaded', {count: this.data.length, files: this.files.length});
  }

  _clearParseState() {
    // 图表实例（重导入/重置时销毁旧图）
    Object.values(this.charts).forEach(c => { try { c.destroy(); } catch(e) {} });
    this.charts = {};
    // 解析标签/条件/单位/格式标记（旧文件残留会导致新文件标题、Bias、单位、下拉标签不更新）
    this._paramLabels = {};
    this._bias = {};
    this._paramUnits = {};
    this._noBias = false;
    this._biasStart = undefined;
    // 图表配置缓存
    this._zoneCache = null;
    this.customCharts = null;
    this.boxConfigs = null;
    this.distConfigs = null;
    this.scConfigs = null;
    // 报告状态（重新导入后需重新点「应用」，避免用旧筛选数据渲染旧报告）
    this._reportData = null;
    this._reportYMin = null;
    this._reportYMax = null;
    this._reportRendered = false;
    this._repShow = null;
    this._reportParams = null; // 报告实际绘制参数列表（上次报告残留，避免打印重绘用旧参数）
    // 视图隐藏/缩放状态（单值图/多值图隐藏列、归一化隐藏、Wafer 缩放）
    this._sgHidden = null;
    this._mvHidden = null;
    this._normHid = {};
    this._waferZoom = 1;
    // 规格限：清除上次导入解析产生的产品规格（内置规格库保留）
    Object.keys(SPEC_LIMITS).forEach(k => { if (!BUILTIN_SPEC_PRODUCTS.has(k)) delete SPEC_LIMITS[k]; });
  }

  reset() {
    this._clearParseState();
    this.data = []; this.headers = []; this.params = []; this.binStats = {}; this.yield = 0; this.files = []; this.paramStats = {};
    this.$('results').classList.add('vt-hide');
    this.$('fileList').classList.add('vt-hide');
    this.$('compare').classList.add('vt-hide');
    this._emit('reset');
  }

  on(event, fn) { if (!this.listeners[event]) this.listeners[event] = []; this.listeners[event].push(fn); return this; }
  _emit(event, data) { (this.listeners[event] || []).forEach(fn => fn(data)); }

  // ========== 文件读取 ==========
  _readFile(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = e => {
        const buf = e.target.result;
        try {
          // 优先 UTF-8（fatal：遇非法字节抛错）
          resolve(new TextDecoder('utf-8', { fatal: true }).decode(buf));
        } catch (err) {
          // 回退 GBK（电基DF等中文GBK表头）
          try { resolve(new TextDecoder('gbk').decode(buf)); }
          catch (e2) { resolve(new TextDecoder('utf-8').decode(buf)); }
        }
      };
      r.onerror = reject;
      r.readAsArrayBuffer(file);
    });
  }

  // ========== 解析 ==========
  _parseOne(text, fileName, allHeaders) {
    this._paramLabels = this._paramLabels || {};
    const lines = text.split(/\r?\n/).filter(function(l) {
      var t = l.trim();
      if (!t) return false;
      // 过滤二进制/乱码行
      var bad = 0;
      for (var i = 0; i < t.length && i < 200; i++) {
        var c = t.charCodeAt(i);
        if (c < 32 && c !== 9 && c !== 13) bad++;
      }
      return bad < 10;
    });
    if (lines.length < 2) return;
    this._parseOneSync(lines, fileName, allHeaders);
  }

  _parseOneSync(lines, fileName, allHeaders) {
    const sep = this._detectSep(lines[0]);

    // 华昕 ATI600: Report Generated By 开头 → 特殊解析
    if (lines[0].startsWith('Report Generated By,')) {
      this._parseHuaxin(lines, fileName, allHeaders, sep);
      return;
    }

    // 集佳FT (STS8203): SITE_NUM 列名行 → 特殊解析
    for (let i = 0; i < Math.min(80, lines.length); i++) {
      if (lines[i].split(sep)[0].trim() === 'SITE_NUM') {
        this._parseJijia(lines, fileName, allHeaders, sep);
        return;
      }
    }

    // 电基DF: serial_No 列名行 → 特殊解析
    for (let i = 0; i < Math.min(80, lines.length); i++) {
      if (lines[i].split(sep)[0].trim() === 'serial_No') {
        this._parseJijiaDf(lines, fileName, allHeaders, sep);
        return;
      }
    }

    // 日月新: 标签在第4列(普通CSV)或第5列(日月新DC)，第0列空，且存在 "Test No." 数据表头 → 特殊解析
    let ryxTagCol = -1;
    for (let i = 0; i < Math.min(12, lines.length); i++) {
      const p = lines[i].split(sep);
      if ((p[0] || '').trim() === '') {
        for (let c = 4; c <= 5; c++) {
          if ((p[c] || '').trim().toLowerCase() === 'item') { ryxTagCol = c; break; }
        }
        if (ryxTagCol >= 0) break;
      }
    }
    if (ryxTagCol >= 0) {
      let hasTestNo = false;
      for (let k = 0; k < Math.min(80, lines.length); k++) {
        if ((lines[k].split(sep)[0] || '').trim() === 'Test No.') { hasTestNo = true; break; }
      }
      if (hasTestNo) { this._parseRYX(lines, fileName, allHeaders, sep, ryxTagCol); return; }
    }

    // 智能定位表头行：支持 TSK / ETS / DCP / PowerTECH 等多种格式
    let headerIdx = 0;
    for (let i = 0; i < Math.min(80, lines.length); i++) {
      const firstToken = lines[i].split(sep)[0].trim();
      // TSK: No.U / No / Die / Site
      if (['No.U','No','Die','Site','X','Y'].includes(firstToken)) { headerIdx = i; break; }
      if (firstToken === 'Test Name' || firstToken === 'Test Number') { headerIdx = i; break; }
      // TSV/DC: Serial#
      if (firstToken === 'Serial#') { headerIdx = i; break; }
      // DTA: Serial
      if (firstToken === 'Serial') { headerIdx = i; break; }
      // STT-700C 新洁能: TestNo
      if (firstToken === 'TestNo') { headerIdx = i; break; }
      // PowerTECH: Site Num
      if (firstToken === 'Site Num') { headerIdx = i; break; }
      // 集佳FT (STS8203): SITE_NUM
      if (firstToken === 'SITE_NUM') { headerIdx = i; break; }
      // 日月新: Test No.
      if (firstToken === 'Test No.') { headerIdx = i; break; }
      // 普通CSV
      const cols = lines[i].split(sep).length;
      if (cols >= 3 && headerIdx === 0 && i > 0) { headerIdx = i; }
    }

    const rawHeaders = lines[headerIdx].split(sep).map(h => h.trim().replace(/["'#]/g,''));
    // DTA: 数据行列数 > 表头列数，先用空列填充
    let maxCols = rawHeaders.length;
    for (let k = headerIdx + 1; k < Math.min(headerIdx + 5, lines.length); k++) {
      const n = lines[k].split(sep).length;
      if (n > maxCols) maxCols = n;
    }
    const headers = rawHeaders.concat(Array(Math.max(0, maxCols - rawHeaders.length)).fill(''));
    // Item Name 行覆盖参数列名（DTA: Test行数字合并，日月新: Test+Item合并）
    let testNums = null;
    let itemNamesForRYX = null;
    for (let i = headerIdx - 1; i >= Math.max(0, headerIdx - 30); i--) {
      const parts = lines[i].split(sep).map(v => v.trim());
      // DTA: firstToken = "Test"
      if (parts[0].toLowerCase() === 'test') {
        testNums = parts.map(v => v ? v.replace(/["'#]/g,'') : '');
      }
      // 日月新: first col empty, "Test" somewhere in the row
      if (!testNums) {
        const testIdx = parts.findIndex(v => v && v.toLowerCase() === 'test');
        if (testIdx >= 0) {
          testNums = parts.map(v => v ? v.replace(/["'#]/g,'') : '');
        }
      }
      // 日月新 Item行: first col empty, "Item" somewhere in the row
      if (!itemNamesForRYX) {
        const itemIdx = parts.findIndex(v => v && v.toLowerCase() === 'item');
        if (itemIdx >= 0) {
          itemNamesForRYX = parts;
        }
      }
      // Standard Item/Item Name detection
      if (parts[0].toLowerCase() === 'item' || parts[0].toLowerCase() === 'item name') {
        if (!itemNamesForRYX) itemNamesForRYX = parts;
      }
    }
    // 日月新：Test+Item合并列名
    if (itemNamesForRYX && testNums) {
      const tStart = testNums.indexOf('Test');
      const iStart = itemNamesForRYX.findIndex(v => v && v.toLowerCase() === 'item');
      if (tStart >= 0 && iStart >= 0) {
        let lastName = '';
        for (let j = 0; j < testNums.length - tStart && iStart + j < itemNamesForRYX.length; j++) {
          const tLabel = testNums[tStart + j];
          const iLabel = itemNamesForRYX[iStart + j] || '';
          const paramName = iLabel.toUpperCase() === 'SAME' ? lastName : iLabel;
          lastName = paramName;
          const colIdx = 7 + j; // 前7列是meta
          if (colIdx < headers.length && tLabel && paramName) {
            headers[colIdx] = tLabel + ' ' + paramName;
          }
        }
      }
    }

    for (let i = headerIdx - 1; i >= Math.max(0, headerIdx - 30); i--) {
      const firstToken = lines[i].split(sep)[0].trim();
      if (firstToken === 'Item Name' || firstToken === 'Item') {
        const itemNames = lines[i].split(sep).map(h => h.trim().replace(/["'#]/g,''));
        // Item Name行是权威列名：优先取"标签后第一个非空参数名"位置（电基=3, DTA=2, PowerTECH=9）
        let startCol = Infinity;
        for (let jj = 1; jj < itemNames.length; jj++) {
          if (itemNames[jj] && !itemNames[jj].toLowerCase().startsWith('item')) { startCol = Math.min(startCol, jj); break; }
        }
        // 兼容旧格式：从第一个空表头位置开始填充（TSK:8, PowerTECH:9）
        for (let jj = 0; jj < headers.length; jj++) { if (!headers[jj] && itemNames[jj]) { startCol = Math.min(startCol, jj); } }
        if (startCol === Infinity) startCol = 8; // 兜底
        for (let j = startCol; j < headers.length; j++) {
          if (itemNames[j] && !itemNames[j].startsWith('Item')) {
            const prefix = (testNums && testNums[j]) ? testNums[j] + ' ' : '';
            headers[j] = prefix + itemNames[j];
          }
        }
        // 收集 Bias1/2/3 测试条件（同列对齐，供散点图顶部显示）
        this._bias = this._bias || {};
        this._biasStart = startCol;
        this._paramUnits = this._paramUnits || {};
        for (let k = i + 1; k < Math.min(i + 20, lines.length); k++) {
          const firstTok = lines[k].split(sep)[0].trim();
          const firstTokL = firstTok.toLowerCase();
          if (/^Bias\s*\d+$/i.test(firstTok)) {
            const biasVals = lines[k].split(sep).map(v => v.trim());
            this._bias[firstTok.replace(/\s+/g,'').toUpperCase()] = { vals: biasVals };
            // 参数标签后缀（同列）
            for (let j = startCol; j < headers.length; j++) {
              if (biasVals[j] && headers[j] && !this._paramLabels[headers[j]]) {
                this._paramLabels[headers[j]] = headers[j] + ' (' + biasVals[j].replace(/^Value=#\d+$/,'') + ')';
              }
            }
          } else if (firstTokL === 'parameter unit' || firstTokL === 'unit' || firstTokL === 'units') {
            // 单位行（同列对齐）
            const uv = lines[k].split(sep).map(v => v.trim());
            for (let j = startCol; j < headers.length; j++) { if (uv[j] && headers[j]) this._paramUnits[headers[j]] = uv[j]; }
          } else if (firstTokL === 'min limit' || firstTokL === 'max limit' || firstTokL === 'lower' || firstTokL === 'upper' || firstTokL === 'low limit' || firstTokL === 'high limit') {
            // 规格值自带单位后缀（如 -0.5000V、60.00mV）
            const lv = lines[k].split(sep).map(v => v.trim());
            for (let j = startCol; j < headers.length; j++) {
              if (lv[j] && headers[j] && !this._paramUnits[headers[j]]) {
                const um = lv[j].match(/[a-zA-ZµΩ%]+$/);
                if (um) this._paramUnits[headers[j]] = um[0];
              }
            }
          }
        }
        // 列名行自带单位（PowerTECH 等：V,mV,nA,uA,mR），权威覆盖，按列对照
        const hdrUnits = lines[headerIdx].split(sep).map(v => v.trim());
        for (let j = startCol; j < headers.length; j++) {
          if (headers[j] && hdrUnits[j] && /^[a-zA-ZµΩ%][a-zA-ZµΩ%^\/]*$/.test(hdrUnits[j]) && hdrUnits[j].length <= 6) {
            this._paramUnits[headers[j]] = hdrUnits[j];
          }
        }
        break;
      }
    }
    // 独立收集 Bias1/2/3（不依赖 Item Name 行；STT-700C/畅景等无 Item 行的格式也能收集，Bias 行在表头行之后）
    this._bias = this._bias || {};
    this._paramUnits = this._paramUnits || {};
    // 双向扫描表头行前后各 30 行（华虹/畅景等 Bias 行可能在表头行前或后）
    for (let k = Math.max(0, headerIdx - 30); k < Math.min(headerIdx + 30, lines.length); k++) {
      if (k === headerIdx) continue;
      const firstTok = lines[k].split(sep)[0].trim();
      const key = firstTok.replace(/\s+/g,'').toUpperCase();
      if (/^BIAS\d+$/.test(key)) {
        const biasVals = lines[k].split(sep).map(v => v.trim());
        this._bias[key] = { vals: biasVals };
        for (let j = 1; j < headers.length; j++) { // j从1开始：第0列是Bias标签本身，不是参数
          if (biasVals[j] && headers[j] && !this._paramLabels[headers[j]]) {
            this._paramLabels[headers[j]] = headers[j] + ' (' + biasVals[j].replace(/^Value=#\d+$/, '') + ')';
          }
        }
      }
    }
    // 畅景等格式：重复列名自动加数字后缀（第1次保持原名，第2次起加 _2、_3...）
    {
      const used = new Set(), cnt = {};
      headers.forEach((h, i) => {
        if (!h) return;
        if (!used.has(h)) { used.add(h); cnt[h] = 1; }
        else {
          cnt[h] = (cnt[h] || 1) + 1;
          let nh = h + '_' + cnt[h];
          while (used.has(nh)) { cnt[h]++; nh = h + '_' + cnt[h]; }
          headers[i] = nh;
          used.add(nh);
        }
      });
    }
    headers.forEach(h => allHeaders.add(h));

    // 尝试从元数据行提取 Product/Lot/Wafer
    let metaProduct = '', metaLot = '', metaWafer = '';
    for (let i = 0; i < headerIdx; i++) {
      const parts = lines[i].split(sep);
      const key = (parts[0]||'').toLowerCase().replace(/[\s_:]/g,'');
      const val = (parts[2] && !parts[2].startsWith('D:') ? parts[2] : parts[1] || '').trim();
      if (key === 'programname') metaProduct = val.replace(/\.dll$/i,'').split('_')[0] || val;
      if (key === 'lotnumber') {
        metaLot = val.split('-')[0] + '-' + val.split('-')[1] || val; // FA59-3155
        const wm = val.match(/@CP[_\s]*(\d+)/i);
        if (wm && !metaWafer) metaWafer = wm[1];
      }
      if (key === 'wafernumber') metaWafer = val.replace(/^0+/,'') || '0';
      if (key.includes('datalogforlotnumber')) metaLot = val;
      if (key === 'productdescription') metaProduct = val;
      if (key === 'testname') metaProduct = val.split('_')[0] || metaProduct;
      if (key === 'testfilename') {
        const fn = val.replace(/^.*[\\\/]/,'').split('_ALL_')[0];
        if (fn && fn.length > 0 && fn.length < 50) metaProduct = fn;
      }
      if (key === 'productid') metaProduct = val;
      if (key === 'dtafilename') {
        const fn = val.replace(/^.*[\\\/]/,'').split('_')[0];
        if (fn && fn.length < 50) metaProduct = fn;
      }
      if (key === 'tstfilenamefor') {
        const fn = val.replace(/^.*[\\\/]/,'').split('-')[0];
        if (fn && fn.length < 50 && !metaProduct) metaProduct = fn;
      }
      if (key === 'lotname' && val) metaLot = val;
      if (key === 'comment' && !metaLot) metaLot = val;
      if (key === 'serialid') {
        metaWafer = val;
        const dm = val.match(/-(\d+)/);
        if (dm) metaWafer = dm[1];
      }
      if (key === 'testfilename2') {
        const fn = val.replace(/^.*[\\\/]/,'').split('_')[0];
        if (fn && fn.length < 50 && !metaProduct) metaProduct = fn;
      }
      if (key === 'lot') {
        // DC: M260512023-001 FA63-4342 QC → wafer=M260512023, slot=001, batch=FA63-4342
        // 批次是形如 FA63-4342 的 token，不能取最后一个（可能是 QC/Pass 等备注）
        const parts = val.split(/\s+/);
        const batchTok = parts.find(t => /^[A-Za-z]{2,}\d+[-_]\d+$/.test(t));
        if (batchTok) {
          metaLot = batchTok;
          const waferPart = parts[0]; // M260512023-001
          const dashIdx = waferPart.lastIndexOf('-');
          if (dashIdx > 0) metaWafer = waferPart.substring(dashIdx + 1); // 001
        } else {
          const waferPart = parts[0];
          const dashIdx = waferPart.lastIndexOf('-');
          if (dashIdx > 0) {
            metaWafer = waferPart.substring(dashIdx + 1); // 001
            metaLot = parts[1] || parts[0];
          } else {
            metaLot = parts[0];
          }
        }
      }
      if (key === 'waferid') {
        metaWafer = val;
        // A001417-13A7 → batch=A001417, wafer=13
        const parts = val.split('-');
        if (parts.length >= 2) {
          metaLot = parts[0]; // batch
          const wm = parts[1].match(/^(\d+)/);
          if (wm) metaWafer = wm[1]; // wafer number
        }
      }
    }

    // 从文件名取产品名（通用fallback）
    if (!metaProduct && fileName) {
      const parts = fileName.split('_');
      if (parts.length >= 2 && parts[1].length > 3 && parts[1].length < 30) {
        metaProduct = parts[1]; // NCT5542088_NCEAP40PT15D(M)-2B00_FA59-3997 → NCEAP40PT15D(M)-2B00
      } else {
        const seg = parts[0];
        if (seg && seg.length > 3 && seg.length < 30) metaProduct = seg;
      }
    }

    // PowerTECH: 从 Bin/SORTNAME 行提取 BIN 含义
    for (let i = headerIdx - 5; i < headerIdx; i++) {
      if (i < 0) continue;
      const parts = lines[i].split(sep);
      if (parts[0] === 'Bin') {
        const binNums = parts.map(p => parseInt(p) || 0).filter(b => b > 0);
        if (i + 1 < headerIdx && lines[i+1].split(sep)[0] === 'SORTNAME') {
          const names = lines[i+1].split(sep);
          binNums.forEach((b, idx) => {
            const name = names[idx + 1] || '';
            if (b === 1) return; // PASS 跳过
            BIN_COLORS[b] = BIN_COLORS[b] || {color:'#e74c3c'};
            BIN_COLORS[b].label = name.replace(' FAIL','');
          });
        }
      }
    }

    const allLines = lines.slice(Math.max(0, headerIdx - 30), Math.min(headerIdx + 10, lines.length));

    // 提取规格限 - 直接扫描（不依赖Item Name行）
    let fileSpecs = {};
    let colMap2 = {};
    headers.forEach((h, idx) => { colMap2[idx] = h; });
    let firstParamCol2 = 0;
    const specMeta = ['nou','nou','no.u','x','y','bin','die','site','siteno','serial','serial#','no','s','s#','testno','testno','test no.','site num','sitenum','elapsed','elapsedtimems','hbin','sbin','xcoord','ycoord','sortname','sortname#','test','time','testtime','bin#','site#','sort#','serialnum','waferid','testerid','proberid','probecardid','operator','date','handler','station','comment','starttime','computername','testmachine','family','subfamily','datfilename','testfilename','datafilename','lot','wafer'];
    for (let z = 0; z < headers.length; z++) {
      if (headers[z] && !specMeta.includes(headers[z].toLowerCase().replace(/[^a-z0-9]/g,''))) {
        firstParamCol2 = z; break;
      }
    }
    // 从Units行获取firstParamCol2（Units行与规格行/列名行同列；Item Name行可能错位不用）
    for (let i = 0; i < allLines.length; i++) {
      const parts = allLines[i].split(sep).map(v => v.trim());
      const ft = parts[0].toLowerCase();
      if (ft === 'units') {
        for (let z = 1; z < parts.length; z++) {
          if (parts[z] && parts[z] !== '' && !parts[z].toLowerCase().startsWith('bias')) {
            firstParamCol2 = z; break;
          }
        }
        break;
      }
    }
    // 兜底：列名行全meta时用Item Name行（仅当specMeta扫描未找到）
    if (!firstParamCol2) {
      for (let i = 0; i < allLines.length; i++) {
        const parts = allLines[i].split(sep).map(v => v.trim());
        const ft = parts[0].toLowerCase();
        if (ft === 'item' || ft === 'item name') {
          for (let z = 1; z < parts.length; z++) {
            if (parts[z] && parts[z] !== '' && !parts[z].toLowerCase().startsWith('bias')) {
              firstParamCol2 = z; break;
            }
          }
          break;
        }
      }
    }

    for (let k = 0; k < allLines.length; k++) {
      const kparts = allLines[k].split(sep).map(v => v.trim());
      const rtype = (kparts[0] || '').toLowerCase().replace(/\s+/g,'');
      let isUpper = false;
      if (rtype === 'limitu' || rtype === 'upperlimit' || rtype === 'max' || rtype === 'maxlimit') isUpper = true;
      else if (rtype === 'limitl' || rtype === 'lowerlimit' || rtype === 'min' || rtype === 'minlimit') isUpper = false;
      else continue;
      // 对齐方式判定：规格行值数 < 参数数 → 同列直取（前导参数无规格，如PowerTECH）；
      // 值数 ≥ 参数数 → 偏移校正（如DC1值区与参数区整体偏移）
      const fp = firstParamCol2;
      let nVals = 0, nParams = 0;
      for (let z = fp; z < kparts.length; z++) { if (kparts[z] && kparts[z].trim() !== '') nVals++; }
      for (let z = fp; z < headers.length; z++) { if (headers[z] && headers[z].trim() !== '') nParams++; }
      const useSameCol = nVals < nParams;
      let offset = 1;
      if (!useSameCol) for (let z = 1; z < kparts.length; z++) { if (kparts[z] && kparts[z] !== '') { offset = z; break; } }
      const jStart = useSameCol ? fp : offset;
      for (let j = jStart; j < kparts.length; j++) {
        const hIdx = useSameCol ? j : fp + (j - offset);
        const h = colMap2[hIdx];
        if (!h) continue;
        const raw = (kparts[j] || '').replace(/^[*><=]+/g,'').replace(/['"]/g,'');
        var num = parseFloat(raw);
        if (!isNaN(num) && isFinite(num)) {
          var rest = raw.replace(/^[+\-]?[\d.]+/,'').toLowerCase();
          // PowerTECH/畅景(STT-700C): 数据与规格同单位，不转换
          var l0 = lines[0] || '';
          var isPT = l0.indexOf('PowerTECH') >= 0 || l0.indexOf('STT-700C') >= 0;
          if (!isPT) {
            if (rest.indexOf('mohm') >= 0) num = num / 1000;
            else if (rest.indexOf('m') === 0) num = num / 1000;
            else if (rest.indexOf('u') >= 0) num = num / 1000000;
            else if (rest.indexOf('n') >= 0 && rest.indexOf('nan') < 0) num = num / 1000000000;
          }
          if (!fileSpecs[h]) fileSpecs[h] = [null, null];
          if (isUpper) fileSpecs[h][1] = num;
          else fileSpecs[h][0] = num;
        }
      }
    }


    // 合并到全局规格限
    if (Object.keys(fileSpecs).length) {
      const product = metaProduct || fileName;
      if (!SPEC_LIMITS[product]) SPEC_LIMITS[product] = {};
      for (var k in fileSpecs) {
        if (!(k in SPEC_LIMITS[product])) SPEC_LIMITS[product][k] = fileSpecs[k];
      }
    }

    const fileData = [];
    // 畅景(STT-700C)格式：蛇形扫描，(X,Y) 坐标组合再次出现时视为重复数据，截断丢弃
    const isCJ = headers.includes('TestNo') && headers.includes('X') && headers.includes('Y');
    const xIdx = headers.indexOf('X');
    const yIdx = headers.indexOf('Y');
    let cjLastKey = null, cjSeenXY = new Set();
    for (let i = headerIdx + 1; i < lines.length; i++) {
      const vals = lines[i].split(sep).map(v => v.trim().replace(/["']/g,''));
      const firstVal = vals[0] || '';
      // 畅景：再次出现表头行（TestNo,SiteNo,Bin,,X,Y / TestNo,SiteNo,Bin,,）→ 之后的数据都不取了
      if (isCJ && firstVal === 'TestNo') break;
      const skipPrefixes = ['Limit','limit','Bias','bias','Unit','Test Name','Test Number','Lower','Upper','Units','No.','Program','Lot','Wafer','Date','Time','Bin,','SORTNAME','Sub,','Percent','Description','Item Name','Bias1','Bias2','Bias3','Bias4','BIAS1','BIAS2','BIAS3','BIAS4','MIN,','MAX,','Min Limit','Max Limit','Min Result','Max Result','Average','STD DEV','Product','Tester','Probe','Operator','PowerTECH','DataFileName','TestFileName','Prober','Probe Card','Lot:','Wafer ID:','Product ID:','Tester ID:','Operator:','Serial#','Device','Para','DTA File','DTA File Created','TST File','CSV File','CSV File Created','Operator Name','Station','Device Name','Lot Name','Comment','Time Point','DataLog','Number Of Tests','Quantity Logged','Datalog Quantity','Test','Limit Units','Time','Time Units','Wafer Data','TestMachine','ComputerName','Family','SubFamily','Serial ID:','Start Time','Prober Card ID','Item Status','Fail & Alarm','OVER (Pass)','OVER (Fail)','Alarm','Min','Max','Range','Average']; const skipTokens = firstVal.replace(/[:：]\s*$/,'');
      if (skipPrefixes.some(p => skipTokens === p || skipTokens.startsWith(p)) || firstVal === '') continue;
      if (skipPrefixes.some(p => firstVal.startsWith(p)) || firstVal === '') continue;
      // 数据行第一列应可解析为数字
      if (isNaN(parseFloat(firstVal))) continue;
      if (vals.length < 2) continue;
      // 畅景：(X,Y) 组合再次出现（非连续）→ 截断，丢弃该行及之后所有行
      if (isCJ && xIdx >= 0 && yIdx >= 0) {
        const xv = vals[xIdx], yv = vals[yIdx];
        if (xv !== '' && yv !== '' && !isNaN(parseFloat(xv)) && !isNaN(parseFloat(yv))) {
          const key = parseFloat(xv) + '|' + parseFloat(yv);
          if (cjLastKey !== null && key !== cjLastKey && cjSeenXY.has(key)) break;
          if (key !== cjLastKey) cjSeenXY.add(key);
          cjLastKey = key;
        }
      }
      const row = {};
      headers.forEach((h, idx) => { const v = vals[idx] || ''; row[h] = isNaN(v) || v==='' ? v : parseFloat(v); });
      row._Product = row.Product || row.PRODUCT || row.product || metaProduct;
      row._Lot = row.Lot || row.LOT || row.lot || metaLot;
      row._Wafer = row.Wafer || row.WAFER || row.wafer || metaWafer;
      row._Batch = metaLot || row._Lot;
      // BIN 值：兼容大小写、多命名（TSK=Bin, ETS=Bin, DCP=BIN, CW=RESULT）
      const rawBin = row.BIN || row.Bin || row.bin || row.RESULT || row.Result || row.result;
      row._Bin = (rawBin !== undefined && rawBin !== '') ? parseInt(rawBin) || 1 : 1;
      row._File = fileName;
      fileData.push(row);
    }

    const passCount = fileData.filter(r => r._Bin === 1).length;
    const wafers = new Set(fileData.map(r => r._Wafer));
    fileData.forEach(r => { r._File = fileName; });
    this.files.push({
      name: fileName, count: fileData.length,
      yield: fileData.length > 0 ? (passCount / fileData.length * 100) : 0,
      product: fileData[0]?._Product || '--', waferCount: wafers.size, passCount
    });
    this.data = this.data.concat(fileData);
  }

  // ========== 昕致 XLSX 格式解析 ==========
  async _readXlsx(file) {
    const entries = await this._readZip(file);
    let shared = [], sheetXml = '';
    entries.forEach(e => {
      if (/sharedStrings\.xml$/.test(e.name)) {
        const si = e.text.match(/<si>[\s\S]*?<\/si>/g) || [];
        shared = si.map(s => {
          const ts = s.match(/<t[^>]*>([\s\S]*?)<\/t>/g) || [];
          return ts.map(t => t.replace(/<t[^>]*>/, '').replace(/<\/t>/, '').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&apos;/g,"'")).join('');
        });
      }
      if (/worksheets\/sheet1\.xml$/.test(e.name) || /sheet1\.xml$/.test(e.name)) sheetXml = e.text;
    });
    if (!sheetXml) throw new Error('sheet1.xml 不存在');
    // 解析行与单元格
    const rows = [];
    const rowRe = /<row[^>]*>([\s\S]*?)<\/row>/g;
    let m;
    while ((m = rowRe.exec(sheetXml)) !== null) {
      const cells = [];
      const cellRe = /<c r="([A-Z]+)\d+"([^>]*)>(?:<v>([\s\S]*?)<\/v>)?(?:<is>([\s\S]*?)<\/is>)?/g;
      let cm;
      while ((cm = cellRe.exec(m[1])) !== null) {
        const colIdx = cm[1].split('').reduce((acc, ch) => acc * 26 + (ch.charCodeAt(0) - 64), 0) - 1;
        const attrs = cm[2] || '';
        const v = cm[3] != null ? cm[3] : '';
        let val;
        if (/t="s"/.test(attrs)) val = shared[parseInt(v)] != null ? shared[parseInt(v)] : '';
        else if (/t="inlineStr"/.test(attrs)) {
          // 内联字符串 <is><t>...</t></is>
          const isXml = cm[4] != null ? cm[4] : '';
          const tm = isXml.match(/<t[^>]*>([\s\S]*?)<\/t>/);
          val = tm ? tm[1].replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&apos;/g,"'") : '';
        }
        else val = v === '' ? '' : (isNaN(+v) ? v : +v);
        cells[colIdx] = val;
      }
      rows.push(cells);
    }
    return rows;
  }

  _parseXinZhi(rows, fileName, allHeaders) {
    // 表头(前15行)基本忽略；列名以数据表头行 Wafer ID,CHIP_NO,X,Y,BIN,参数... 为准
    let product = '';
    let hdrRow = -1, specLoRow = -1, specHiRow = -1;
    for (let r = 0; r < Math.min(rows.length, 40); r++) {
      const row = rows[r];
      if (!row || !row[0]) continue;
      const a = String(row[0]).trim();
      if (a === 'Product ID') product = row[1] != null ? String(row[1]).trim() : '';
      else if (a === 'SPEC Low') specLoRow = r;
      else if (a === 'SPEC High') specHiRow = r;
      else if (a === 'Wafer ID') hdrRow = r;
    }
    if (hdrRow < 0) return;
    const hdr = rows[hdrRow];
    // 列结构: 0=Wafer ID, 1=CHIP_NO, 2=X, 3=Y, 4=BIN, 5+=参数
    const pNames = [];
    for (let c = 5; c < (hdr ? hdr.length : 0); c++) {
      const n = hdr[c] != null ? String(hdr[c]).trim() : '';
      if (n) pNames.push(n);
    }
    if (!pNames.length) return;
    // 规格限（SPEC Low/SPEC High 行与参数列同偏移）
    if (product && specLoRow >= 0 && specHiRow >= 0) {
      if (!SPEC_LIMITS[product]) SPEC_LIMITS[product] = {};
      pNames.forEach((n, i) => {
        const lo = rows[specLoRow] && rows[specLoRow][5+i];
        const hi = rows[specHiRow] && rows[specHiRow][5+i];
        if (lo != null || hi != null) {
          if (!SPEC_LIMITS[product][n]) SPEC_LIMITS[product][n] = [null, null];
          if (lo != null && !isNaN(+lo)) SPEC_LIMITS[product][n][0] = +lo;
          if (hi != null && !isNaN(+hi)) SPEC_LIMITS[product][n][1] = +hi;
        }
      });
    }
    pNames.forEach(h => allHeaders.add(h));
    // 数据行：表头行之后；Wafer ID 值如 A000321-01 → 批次=A000321, 片号=01
    const fileData = [];
    for (let r = hdrRow + 1; r < rows.length; r++) {
      const row = rows[r];
      if (!row || row[1] == null || row[1] === '') continue;
      const wid = row[0] != null ? String(row[0]).trim() : '';
      let lot = '', wafer = '';
      const wm = wid.match(/^([A-Za-z0-9]+)[-_](\d+)$/);
      if (wm) { lot = wm[1]; wafer = wm[2]; }
      else { lot = wid; }
      const rec = {
        _Product: product, _Lot: lot, _Wafer: wafer, _File: fileName,
        X: row[2] != null ? +row[2] : 0, Y: row[3] != null ? +row[3] : 0,
        _Bin: row[4] != null ? parseInt(row[4]) || 1 : 1
      };
      pNames.forEach((n, i) => {
        const v = row[5+i];
        rec[n] = v != null && v !== '' ? (typeof v === 'number' ? v : parseFloat(v)) : '';
      });
      fileData.push(rec);
    }
    if (!fileData.length) return;
    const passCount = fileData.filter(r => r._Bin === 1).length;
    this.files.push({ name: fileName, count: fileData.length, yield: fileData.length ? (passCount / fileData.length * 100) : 0, product: product || '--', waferCount: 1, passCount });
    this.data = this.data.concat(fileData);
  }

  // ========== 电基 DF 格式解析（GBK表头 + serial_No 列名行） ==========
  _parseJijiaDf(lines, fileName, allHeaders, sep) {
    this._noBias = true; // 电基DF：标题不显示 Bias
    let headerIdx = -1;
    for (let i = 0; i < Math.min(80, lines.length); i++) {
      if (lines[i].split(sep)[0].trim() === 'serial_No') { headerIdx = i; break; }
    }
    if (headerIdx < 0) return;
    // 列名行(英文): 0=serial_No 1=date 2=time 3=test_time 4=BIN 5=Fail_project 6=result 7+=参数
    const headers = lines[headerIdx].split(sep).map(h => h.trim().replace(/["'#]/g, ''));
    const pNames = headers.slice(7).filter(Boolean);
    if (!pNames.length) return;
    // 批次信息: 批次信息,M260108039-001 FA5Y-9413 → 片号=001, 批号=FA5Y-9413
    let metaLot = '', metaWafer = '', product = '';
    for (let i = 0; i < headerIdx; i++) {
      const parts = lines[i].split(sep);
      const key = String(parts[0] || '').trim().replace(/[:：]/g, '');
      const val = parts[1] != null ? parts[1].trim() : '';
      if (key === '批次信息' && val) {
        const toks = val.split(/\s+/);
        const batchTok = toks.find(t => /^[A-Za-z]{2,}\d+[-_]\d+$/.test(t));
        if (batchTok) {
          metaLot = batchTok;
          const wd = toks[0].lastIndexOf('-');
          if (wd > 0) metaWafer = toks[0].substring(wd + 1);
        } else if (toks[0]) {
          const wd = toks[0].lastIndexOf('-');
          if (wd > 0) { metaWafer = toks[0].substring(wd + 1); metaLot = toks[1] || toks[0]; }
          else metaLot = toks[0];
        }
      } else if (key === '程序名称' && val) {
        const pm = val.match(/^[A-Za-z0-9()]+/);
        if (pm) product = pm[0];
      }
    }
    if (!metaLot && fileName) {
      const fm = fileName.match(/([A-Za-z0-9]+-?\d+)/);
      if (fm) metaLot = fm[1];
    }
    // 规格限: Low  Limit / High Limit（标签在任意列，值从 index 7 起对齐参数）
    let loRow = null, hiRow = null;
    for (let i = 0; i < headerIdx; i++) {
      const kparts = lines[i].split(sep).map(v => v.trim());
      for (let ci = 0; ci < kparts.length; ci++) {
        const rt = (kparts[ci] || '').toLowerCase().replace(/\s+/g, '');
        if (rt === 'lowlimit') loRow = kparts;
        else if (rt === 'highlimit') hiRow = kparts;
      }
    }
    if (loRow && hiRow) {
      const prod = product || metaLot || '--';
      if (!SPEC_LIMITS[prod]) SPEC_LIMITS[prod] = {};
      pNames.forEach((n, idx) => {
        const c = 7 + idx;
        const lo = loRow[c], hi = hiRow[c];
        if ((lo != null && lo !== '') || (hi != null && hi !== '')) {
          if (!SPEC_LIMITS[prod][n]) SPEC_LIMITS[prod][n] = [null, null];
          if (lo != null && lo !== '' && !isNaN(+lo)) SPEC_LIMITS[prod][n][0] = +lo;
          if (hi != null && hi !== '' && !isNaN(+hi)) SPEC_LIMITS[prod][n][1] = +hi;
        }
      });
    }
    pNames.forEach(h => allHeaders.add(h));
    // 数据行: serial_No 数字开头，BIN@4，参数@7+
    const fileData = [];
    for (let i = headerIdx + 1; i < lines.length; i++) {
      const vals = lines[i].split(sep);
      if (!vals[0] || vals[0].trim() === '' || isNaN(+vals[0])) continue;
      if (vals.length < 8) continue;
      const rec = {
        _Product: product || metaLot || '--', _Lot: metaLot || '--', _Wafer: metaWafer || '', _File: fileName,
        _Bin: vals[4] != null && vals[4].trim() !== '' ? parseInt(vals[4]) || 1 : 1
      };
      pNames.forEach((n, idx) => {
        const v = vals[7 + idx];
        rec[n] = v != null && v.trim() !== '' ? (isNaN(+v) ? v.trim() : +v) : '';
      });
      fileData.push(rec);
    }
    if (!fileData.length) return;
    const passCount = fileData.filter(r => r._Bin === 1).length;
    this.files.push({ name: fileName, count: fileData.length, yield: fileData.length ? (passCount / fileData.length * 100) : 0, product: product || '--', waferCount: 0, passCount });
    this.data = this.data.concat(fileData);
  }

  // ========== 集佳 FT (STS8203) 格式解析 ==========
  _parseJijia(lines, fileName, allHeaders, sep) {
    this._noBias = true; // 集佳FT：标题不显示 Bias
    let headerIdx = -1;
    for (let i = 0; i < Math.min(80, lines.length); i++) {
      if (lines[i].split(sep)[0].trim() === 'SITE_NUM') { headerIdx = i; break; }
    }
    if (headerIdx < 0) return;
    // 列名行: 0=SITE_NUM 1=PART_ID 2=PASSFG 3=SOFT_BIN 4=T_TIME 5=TEST_NUM 6+=参数
    const headers = lines[headerIdx].split(sep).map(h => h.trim().replace(/["'#]/g, ''));
    const pNames = headers.slice(6).filter(Boolean);
    if (!pNames.length) return;
    // 批次/产品: 文件名 NCE15TD120BT_C178121.00_26PA06370031-02_DC_260409034023
    // → 产品=第1段, 批次=C178121.00(第2段)
    const fnParts = (fileName || '').split('_');
    const product = fnParts[0] || '--';
    let lot = '';
    for (let fi = 1; fi < fnParts.length; fi++) {
      if (/^[A-Za-z0-9]+\.[0-9]+$/.test(fnParts[fi])) { lot = fnParts[fi]; break; }
    }
    if (!lot) lot = fnParts[1] || '--';
    // 单位行/规格限行（列名行后紧跟: Unit, LimitL, LimitU）
    let unitRow = null, limitLRow = null, limitURow = null;
    for (let i = headerIdx + 1; i < Math.min(headerIdx + 6, lines.length); i++) {
      const first = lines[i].split(sep)[0].trim();
      if (first === 'Unit') unitRow = lines[i].split(sep);
      else if (first === 'LimitL') limitLRow = lines[i].split(sep);
      else if (first === 'LimitU') limitURow = lines[i].split(sep);
    }
    // 规格限 → SPEC_LIMITS[product]
    if (limitLRow && limitURow) {
      if (!SPEC_LIMITS[product]) SPEC_LIMITS[product] = {};
      pNames.forEach((n, idx) => {
        const c = 6 + idx;
        const lo = limitLRow[c], hi = limitURow[c];
        if ((lo != null && lo.trim() !== '') || (hi != null && hi.trim() !== '')) {
          if (!SPEC_LIMITS[product][n]) SPEC_LIMITS[product][n] = [null, null];
          if (lo != null && lo.trim() !== '' && !isNaN(+lo)) SPEC_LIMITS[product][n][0] = +lo;
          if (hi != null && hi.trim() !== '' && !isNaN(+hi)) SPEC_LIMITS[product][n][1] = +hi;
        }
      });
    }
    pNames.forEach(h => allHeaders.add(h));
    // 数据行：第一列(SITE_NUM)为数字
    const fileData = [];
    for (let i = headerIdx + 1; i < lines.length; i++) {
      const vals = lines[i].split(sep);
      if (!vals[0] || vals[0].trim() === '' || isNaN(+vals[0])) continue;
      if (vals.length < 7) continue;
      const rec = {
        _Product: product, _Lot: lot, _Wafer: '', _File: fileName,
        _Bin: vals[3] != null && vals[3].trim() !== '' ? parseInt(vals[3]) || 1 : 1
      };
      pNames.forEach((n, idx) => {
        const v = vals[6 + idx];
        rec[n] = v != null && v.trim() !== '' ? (isNaN(+v) ? v.trim() : +v) : '';
      });
      fileData.push(rec);
    }
    if (!fileData.length) return;
    const passCount = fileData.filter(r => r._Bin === 1).length;
    this.files.push({ name: fileName, count: fileData.length, yield: fileData.length ? (passCount / fileData.length * 100) : 0, product, waferCount: 0, passCount });
    this.data = this.data.concat(fileData);
  }

  // 华昕 ATI600 CSV 格式解析
  _parseHuaxin(lines, fileName, allHeaders, sep) {
    this._paramLabels = this._paramLabels || {};
    var product = '', lot = '', wafer = '';
    for (var i = 0; i < Math.min(100, lines.length); i++) {
      var t = lines[i];
      if (t.startsWith('Test Name,') && !t.includes(',,,,,,')) product = t.split(',')[1].trim();
      if (t.startsWith('Datalog for SubLot Number,')) {
        var sl = t.split(',')[1].trim(), parts = sl.split('-');
        lot = parts.length >= 2 ? parts.slice(0, -1).join('-') : sl;
        wafer = parts.length >= 2 ? parts[parts.length - 1] : '';
      }
    }
    var paramHdrIdx = -1;
    for (var i = 0; i < Math.min(200, lines.length); i++) {
      if (lines[i].startsWith('Test Name,') && lines[i].includes(',,,,,,')) { paramHdrIdx = i; break; }
    }
    if (paramHdrIdx < 0) return;
    var paramNames = lines[paramHdrIdx].split(sep).map(function(v) { return v.trim(); });
    var testNums = lines[paramHdrIdx+1] ? lines[paramHdrIdx+1].split(sep).map(function(v) { return v.trim(); }) : [];
    var bias1s = lines[paramHdrIdx+2] ? lines[paramHdrIdx+2].split(sep).map(function(v) { return v.trim(); }) : [];
    var bias2s = lines[paramHdrIdx+3] ? lines[paramHdrIdx+3].split(sep).map(function(v) { return v.trim(); }) : [];
    var bias3s = lines[paramHdrIdx+4] ? lines[paramHdrIdx+4].split(sep).map(function(v) { return v.trim(); }) : [];
    var lowL = [], highL = [], dataHdrIdx = paramHdrIdx;
    for (var i = paramHdrIdx; i < Math.min(paramHdrIdx+30, lines.length); i++) {
      if (lines[i].startsWith('Lower Limit,')) lowL = lines[i].split(sep).map(function(v) { return v.trim(); });
      if (lines[i].startsWith('Upper Limit,')) highL = lines[i].split(sep).map(function(v) { return v.trim(); });
      if (lines[i].startsWith('Site#,')) { dataHdrIdx = i; break; }
    }
    var headers = [], metaCnt = 7; // Site#/Serial#/Hbin/Sbin/XCoord/YCoord/TestTime
    for (var j = metaCnt; j < paramNames.length; j++) {
      var pname = paramNames[j];
      if (!pname || pname === 'Test Name' || pname === '') continue;
      var hdr = pname;
      headers.push(hdr);
      if (lowL[j] && lowL[j] !== 'Lower Limit' && lowL[j] !== '') {
        SPEC_LIMITS[product] = SPEC_LIMITS[product] || {};
        SPEC_LIMITS[product][hdr] = SPEC_LIMITS[product][hdr] || [null, null];
        SPEC_LIMITS[product][hdr][0] = parseFloat(lowL[j]);
      }
      if (highL[j] && highL[j] !== 'Upper Limit' && highL[j] !== '') {
        SPEC_LIMITS[product] = SPEC_LIMITS[product] || {};
        SPEC_LIMITS[product][hdr] = SPEC_LIMITS[product][hdr] || [null, null];
        SPEC_LIMITS[product][hdr][1] = parseFloat(highL[j]);
      }
    }
    // 设置 Bias（供标题显示，华昕也显示 Bias）
    this._bias = this._bias || {};
    var biasRowsArr = [bias1s, bias2s, bias3s];
    ['BIAS1', 'BIAS2', 'BIAS3'].forEach(function(bk, bi) {
      var biasRow = biasRowsArr[bi] || [];
      var m = {};
      headers.forEach(function(h, idx) {
        var v = biasRow[metaCnt + idx];
        if (v && v !== 'BIAS1' && v !== 'BIAS2' && v !== 'BIAS3') m[h] = v;
      });
      this._bias[bk] = { vals: biasRow, map: m };
    }.bind(this));
    var fileData = [];
    for (var i = dataHdrIdx + 1; i < lines.length; i++) {
      var rawLine = lines[i].trim();
      if (!rawLine || rawLine.startsWith('Data Collection') || rawLine.startsWith('Report Generated') || rawLine.startsWith('Test Name,') || rawLine.startsWith('Datalog for') || rawLine.startsWith('On,')) continue;
      var vals = lines[i].split(sep).map(function(v) { return v.trim(); });
      if (vals.length < metaCnt + 2) continue;
      var row = {};
      headers.forEach(function(h, idx) { var vi = metaCnt + idx; row[h] = vi < vals.length ? vals[vi] : ''; });
      row._Bin = parseInt(vals[2]) || 1;
      row['Site#'] = vals[0] || '';
      row['序号'] = vals[1] || '';
      row['BIN(H)'] = vals[2] || '';
      row['BIN(S)'] = vals[3] || '';
      row['X坐标'] = vals[4] || '';
      row['Y坐标'] = vals[5] || '';
      row._Product = product; row._Lot = lot; row._Wafer = wafer; row._File = fileName;
      row._Row = parseInt(vals[4]) || 1;
      row._Col = parseInt(vals[5]) || 1;
      row.Row = row._Row; row.Col = row._Col; // Wafer Map 需要 Row/Col 字段
      fileData.push(row);
    }
    headers.forEach(function(h) { allHeaders.add(h); });
    allHeaders.add('Site#'); allHeaders.add('序号'); allHeaders.add('BIN(H)'); allHeaders.add('BIN(S)'); allHeaders.add('X坐标'); allHeaders.add('Y坐标');
    var pc = fileData.filter(function(r) { return r._Bin === 1; }).length;
    this.files.push({ name: fileName, count: fileData.length, yield: fileData.length ? (pc / fileData.length * 100) : 0, product: product || '--', waferCount: 1, passCount: pc });
    this.data = this.data.concat(fileData);
  }

  // ========== 日月新 格式解析 ==========
  // 表头区(标签在第4列, 第0列为空):
  //   ,Item Status,Color,,Test,T1..Tn               → 测试序号行
  //   ,Fail,,,Item,CONT,VTH,SAME,...                → 参数名行(SAME=同前一参数)
  //   ,Alarm,,,Low  Limit,,...  / ,Fail & Alarm,,,High Limit,,...
  //   ,OVER (Pass),,,Bias1,... / ,OVER (Fail),,,Bias2,...
  //   ,,,,Unit,... / ,,,,Time,... / ,,,,Min,,... / ,,,,Max,,... / ,,,,Range,,... / ,,,,Average,,...
  // 数据表头: Test No.,Coordinate,Soft Bin,Result,Fail Item,,,,...
  // 数据行: 0001,"X0, Y0",1,PASS,,PASS,<27个数值>   (坐标带引号)
  // 第5列=CONT(接触测试, PASS/FAIL 文本), 第6列起=27个数值参数
  _parseRYX(lines, fileName, allHeaders, sep, tagCol) {
    this._noBias = true; // 日月新：标题不显示 Bias（只对华虹/畅景/华昕/昕致显示）
    tagCol = tagCol == null ? 4 : tagCol;   // 标签列: 普通日月新CSV=4, 日月新DC(xlsx/csv)=5
    const paramStart = tagCol + 1;          // 第一个参数列（含 CONT）
    const contCol = paramStart;             // CONT 接触测试列
    const numStart = paramStart + 1;        // 数值参数起始列
    this._paramLabels = this._paramLabels || {};
    this._bias = this._bias || {};
    this._paramUnits = this._paramUnits || {};

    let headerIdx = -1;
    for (let i = 0; i < Math.min(80, lines.length); i++) {
      if ((lines[i].split(sep)[0] || '').trim() === 'Test No.') { headerIdx = i; break; }
    }
    if (headerIdx < 0) return;

    // 在上方表头区收集各标签行（标签在第 tagCol 列）
    let testRow = null, itemRow = null, bias1 = null, bias2 = null, unitRow = null, loRow = null, hiRow = null;
    for (let i = 0; i < headerIdx; i++) {
      const parts = lines[i].split(sep).map(v => v.trim());
      const label = (parts[tagCol] || '').toLowerCase().replace(/\s+/g, '');
      if (label === 'test') testRow = parts;
      else if (label === 'item') itemRow = parts;
      else if (label === 'bias1') bias1 = parts;
      else if (label === 'bias2') bias2 = parts;
      else if (label === 'unit') unitRow = parts;
      else if (label === 'lowlimit') loRow = parts;
      else if (label === 'highlimit') hiRow = parts;
    }
    if (!testRow || !itemRow) return;

    // 参数列: CONT(接触, 跳过), 数值参数从 numStart 起
    const pNames = [];
    const pCol = [];
    let lastName = '';
    const nItems = Math.min(testRow.length, itemRow.length);
    for (let c = paramStart; c < nItems; c++) {
      const tLabel = (testRow[c] || '').replace(/["'#]/g, '').trim();
      const iLabel = (itemRow[c] || '').trim();
      if (!tLabel && !iLabel) break; // 行尾空列，参数结束
      if (iLabel.toUpperCase() === 'SAME') { /* 同前一参数，lastName 不变 */ }
      else if (iLabel) lastName = iLabel;
      if (c === contCol && /^CONT/i.test(lastName)) continue; // CONT 接触测试(PASS/FAIL 文本) 不作为数值参数
      const name = (tLabel ? tLabel + ' ' : '') + (lastName || iLabel || tLabel);
      pNames.push(name);
      pCol.push(c);
    }
    if (!pNames.length) return;

    // 产品/批次: 从文件名提取（日月新文件本身不带 Lot 信息）
    // 文件名: {工单}_{产品}_{批次}_{日期}_{时间}_Test Data
    // 例: NCT6547055_NCES075P025T_A000694_20251128_191016_Test Data → 产品=NCES075P025T, 批次=A000694
    let product = '', lot = '';
    if (fileName) {
      const base = String(fileName).replace(/^.*[\\\/]/, '').replace(/\.(csv|txt|dat)$/i, '');
      const segs = base.split(/[_\-\s]+/).filter(Boolean);
      if (segs.length > 1 && segs[1].length > 3 && segs[1].length < 30) product = segs[1];
      if (!product && segs.length) product = segs[0] || base;
      // 批次: 优先带分隔符的(FA5Y-9413 / C178121.00)，否则单/双字母+纯数字(A000694)
      for (let i = 0; i < segs.length; i++) { if (/^[A-Za-z]{2,}\d+[-_.]\d+$/.test(segs[i])) { lot = segs[i]; break; } }
      if (!lot) for (let i = 0; i < segs.length; i++) { if (/^[A-Za-z]{1,2}\d{4,}$/.test(segs[i])) { lot = segs[i]; break; } }
      if (!lot && segs.length > 1) lot = segs[1];
    }
    if (!product) product = fileName || '--';

    // 规格限: Low Limit / High Limit（值从数值参数列起，与 pCol 对齐；日月新DC 规格值带 */>/< 前缀和 n/u/k 单位后缀）
    if (loRow || hiRow) {
      if (!SPEC_LIMITS[product]) SPEC_LIMITS[product] = {};
      pNames.forEach((n, idx) => {
        const c = pCol[idx];
        const loRaw = loRow && loRow[c] != null ? String(loRow[c]).trim() : '';
        const hiRaw = hiRow && hiRow[c] != null ? String(hiRow[c]).trim() : '';
        const lo = loRaw.replace(/^[*<>=\s]+/, '');
        const hi = hiRaw.replace(/^[*<>=\s]+/, '');
        if (lo !== '' || hi !== '') {
          if (!SPEC_LIMITS[product][n]) SPEC_LIMITS[product][n] = [null, null];
          if (lo !== '' && !isNaN(parseFloat(lo))) SPEC_LIMITS[product][n][0] = parseFloat(lo);
          if (hi !== '' && !isNaN(parseFloat(hi))) SPEC_LIMITS[product][n][1] = parseFloat(hi);
        }
      });
    }

    // 单位行（值从第6列起）
    if (unitRow) {
      pNames.forEach((n, idx) => {
        const u = (unitRow[pCol[idx]] || '').trim();
        if (u) this._paramUnits[n] = u;
      });
    }

    // Bias 条件(Bias1/Bias2, 值从第6列起)：写 _bias 供散点图顶部显示 + _paramLabels 供下拉标签
    const biasRows = { BIAS1: bias1, BIAS2: bias2 };
    ['BIAS1', 'BIAS2'].forEach(b => {
      const row = biasRows[b];
      if (!row) return;
      const m = {};
      pNames.forEach((n, idx) => { const v = (row[pCol[idx]] || '').trim(); if (v) m[n] = v; });
      this._bias[b] = { vals: row, map: m };
      pNames.forEach((n, idx) => {
        const v = (row[pCol[idx]] || '').trim();
        if (v && !this._paramLabels[n]) this._paramLabels[n] = n + ' (' + v.replace(/^Value=#\d+$/, '') + ')';
      });
    });

    pNames.forEach(n => allHeaders.add(n));

    // 数据行（CSV 逗号分隔且坐标带引号 → 引号感知切分；xlsx 转 TSV → 按 sep 切分）
    const splitRow = sep === ',' ? (l) => this._splitCSV(l) : (l) => l.split(sep).map(v => v.trim());
    const fileData = [];
    for (let i = headerIdx + 1; i < lines.length; i++) {
      const vals = splitRow(lines[i]);
      if (!vals.length) continue;
      const first = (vals[0] || '').trim();
      if (first === '' || isNaN(parseFloat(first))) continue;
      if (vals.length <= numStart) continue;
      const coord = (vals[1] || '').trim();
      let x = 0, y = 0;
      const cm = coord.match(/x\s*([-\d.]+)\s*,?\s*y\s*([-\d.]+)/i);
      if (cm) { x = parseFloat(cm[1]) || 0; y = parseFloat(cm[2]) || 0; }
      const softBin = (vals[2] || '').trim();
      const rec = {
        _Product: product, _Lot: lot, _Wafer: '', _File: fileName,
        X: x, Y: y,
        _Bin: softBin !== '' ? (parseInt(softBin) || 1) : 1
      };
      pNames.forEach((n, idx) => {
        const c = pCol[idx];
        const v = (vals[c] || '').trim();
        rec[n] = v !== '' ? (isNaN(+v) ? v : +v) : '';
      });
      fileData.push(rec);
    }

    if (!fileData.length) return;
    const passCount = fileData.filter(r => r._Bin === 1).length;
    const wafers = new Set(fileData.map(r => r._Wafer).filter(Boolean));
    this.files.push({ name: fileName, count: fileData.length, yield: fileData.length ? (passCount / fileData.length * 100) : 0, product: product || '--', waferCount: wafers.size, passCount });
    this.data = this.data.concat(fileData);
  }

  _detectSep(line) {
    const counts = {',':(line.match(/,/g)||[]).length, '\t':(line.match(/\t/g)||[]).length};
    return (counts[','] > counts['\t']) ? ',' : ((counts['\t'] > 0) ? '\t' : ',');
  }

  // 引号感知的 CSV 切分（处理 "X0, Y0" 这类带逗号的带引号字段）
  _splitCSV(line) {
    const out = [];
    let cur = '', q = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') {
        if (q && line[i + 1] === '"') { cur += '"'; i++; }
        else q = !q;
      } else if (c === ',' && !q) { out.push(cur); cur = ''; }
      else cur += c;
    }
    out.push(cur);
    for (let i = 0; i < out.length; i++) out[i] = out[i].trim();
    return out;
  }

  // ========== ZIP 解压 ==========
  async _readZip(file) {
    const buf = await file.arrayBuffer();
    const view = new DataView(buf);
    const entries = [];

    // 找 EOCD (End of Central Directory)
    let eocdOff = -1;
    for (let i = Math.max(0, buf.byteLength - 65536); i < buf.byteLength - 4; i++) {
      if (view.getUint32(i, true) === 0x06054b50) { eocdOff = i; break; }
    }
    if (eocdOff < 0) return entries;

    const cdOffset = view.getUint32(eocdOff + 16, true);
    const cdSize = view.getUint16(eocdOff + 12, true);
    let pos = cdOffset;

    while (pos < cdOffset + cdSize) {
      if (view.getUint32(pos, true) !== 0x02014b50) break;
      const method = view.getUint16(pos + 10, true);
      const compSize = view.getUint32(pos + 20, true);
      const uncompSize = view.getUint32(pos + 24, true);
      const nameLen = view.getUint16(pos + 28, true);
      const extraLen = view.getUint16(pos + 30, true);
      const commentLen = view.getUint16(pos + 32, true);
      const localOff = view.getUint32(pos + 42, true);

      const nameBytes = new Uint8Array(buf, pos + 46, nameLen);
      const name = new TextDecoder().decode(nameBytes);

      // 跳到 local header
      const localPos = localOff + 30 + view.getUint16(localOff + 26, true) + view.getUint16(localOff + 28, true);
      const rawBytes = new Uint8Array(buf, localPos, compSize);

      let text = '';
      if (method === 0) {
        // Store (no compression)
        text = new TextDecoder('utf-8').decode(rawBytes);
      } else if (method === 8) {
        // Deflate — use browser's DecompressionStream
        try {
          const ds = new DecompressionStream('deflate-raw');
          const writer = ds.writable.getWriter();
          writer.write(rawBytes);
          writer.close();
          const result = await new Response(ds.readable).arrayBuffer();
          text = new TextDecoder('utf-8').decode(new Uint8Array(result));
        } catch(e) {
          // Deflate failed, try as-is
          text = new TextDecoder('utf-8').decode(rawBytes);
        }
      }

      if (text && name && !name.endsWith('/')) {
        entries.push({name, text});
      }

      pos += 46 + nameLen + extraLen + commentLen;
    }
    return entries;
  }

  // ========== 统计 ==========
  _computeStats() {
    // 单次遍历：同时收集bin统计和所有参数列
    this.binStats = {};
    var colVals = {};
    for (var ci = 0; ci < this.params.length; ci++) colVals[this.params[ci]] = [];
    var prod = this.data.length ? this.data[0]._Product : '';
    var params = this.params;
    for (var ri = 0; ri < this.data.length; ri++) {
      var r = this.data[ri];
      var b = r._Bin || 1;
      this.binStats[b] = (this.binStats[b] || 0) + 1;
      for (var ci = 0; ci < params.length; ci++) {
        var v = parseFloat(r[params[ci]]);
        // 排除哨兵值(9999/-9999等测试机开路标记)
        if (!isNaN(v) && Math.abs(v) < 9999) colVals[params[ci]].push(v);
      }
    }
    this.yield = this.data.length > 0 ? ((this.binStats[1] || 0) / this.data.length * 100) : 0;
    this.paramStats = {};
    for (var pi = 0; pi < params.length; pi++) {
      var p = params[pi];
      var vals = colVals[p];
      if (vals.length < 5) continue;
      vals.sort(function(a,b){ return a-b; });
      var n = vals.length, sum = 0;
      for (var si = 0; si < n; si++) sum += vals[si];
      var mean = sum / n;
      var sq = 0;
      for (var si = 0; si < n; si++) { var d = vals[si]-mean; sq += d*d; }
      var std = Math.sqrt(sq/(n-1));
      var q1 = vals[Math.floor(n*0.25)], q3 = vals[Math.floor(n*0.75)], iqr = q3 - q1;
      var lw = Math.max(vals[0], q1 - 1.5*iqr), uw = Math.min(vals[n-1], q3 + 1.5*iqr);
      var out = [];
      for (var oi = 0; oi < n; oi++) if (vals[oi] < lw || vals[oi] > uw) out.push(vals[oi]);
      var spec = null, cpk = null;
      if (prod && SPEC_LIMITS[prod] && SPEC_LIMITS[prod][p]) spec = SPEC_LIMITS[prod][p];
      if (spec && std > 0) {
        // 单边规格只算有值的一侧；负值单边USL按幅值下界(IGSS漏电流)
        var negHiOnly2 = spec[1] != null && spec[0] == null && spec[1] < 0;
        if (negHiOnly2) {
          cpk = (mean - spec[1])/(3*std);
        } else {
          var cplT = spec[0] != null ? (mean-spec[0])/(3*std) : Infinity;
          var cpuT = spec[1] != null ? (spec[1]-mean)/(3*std) : Infinity;
          cpk = Math.min(cplT, cpuT);
          if (!isFinite(cpk)) cpk = null;
        }
      }
      this.paramStats[p] = {mean:mean,std:std,min:vals[0],max:vals[n-1],q1:q1,median:vals[Math.floor(n*0.5)],q3:q3,iqr:iqr,lw:lw,uw:uw,out:out,spec:spec,cpk:cpk,n:n};
    }
  }

  // ========== 渲染 ==========
  _renderAll() {
    this._renderStats(); this._renderBinGrid(); this._initBoxConfigs(); this._renderCpkTable(); this._renderDataTable();
  }
  _renderFallback() {
    try { this._renderStats(); } catch(e) {}
    try { this._renderBinGrid(); } catch(e) {}
    try { this._renderBoxPlotFallback(); } catch(e) {}
    try { this._popScatterSelects(); } catch(e) {}
    try { this._renderDataTable(); } catch(e) {}
  }

  _renderStats() {
    const failCount = this.data.length - (this.binStats[1]||0);
    const wafers = new Set(this.data.map(r => r._Wafer)).size;
    const lots = new Set(this.data.map(r => r._Lot)).size;
    this.$('stats').innerHTML = [
      ['分析文件', this.files.length, 'vt-accent'],
      ['总测试数', this.data.length.toLocaleString()],
      ['合并良率', this.yield.toFixed(2)+'%', 'vt-good'],
      ['良品', (this.binStats[1]||0).toLocaleString(), 'vt-good'],
      ['失效', failCount.toLocaleString(), 'vt-fail'],
      ['圆片', wafers], ['批次', lots], ['参数', this.params.length]
    ].map(([l,v,c]) => `<div class="vt-stat"><div class="vt-label">${l}</div><div class="vt-value ${c||''}">${v}</div></div>`).join('');
  }

  _renderBinGrid() {
    const sorted = Object.entries(this.binStats).sort((a,b)=>a[0]-b[0]);
    // BIN 含义说明
    const binMeanings = {1:'良品 PASS',3:'IGSS 栅极漏电超标',4:'IGSS1',7:'BVDSS 击穿电压',9:'IDSS 漏极漏电',10:'BVDSS2',11:'VTH 阈值电压',12:'IGSS2',13:'VSD 体二极管',14:'IGSS_10',15:'IDSS_10',18:'CONT 接触电阻',250:'RDSON 导通电阻'};
    this.$('binGrid').innerHTML = sorted.map(([b,c]) => {
      const bc = BIN_COLORS[b] || BIN_COLORS[999];
      const meaning = binMeanings[b] || '其他失效';
      return `<div class="vt-bin-item" style="border-left:3px solid ${bc.color}">
        <div class="vt-bid">BIN ${b}</div>
        <div class="vt-bcnt">${c}</div>
        <div class="vt-blbl">${meaning}</div>
        <div style="font-size:0.6rem;color:#7a8ba0">${(c/this.data.length*100).toFixed(1)}%</div>
      </div>`;
    }).join('');
  }

  _initBoxConfigs() {
    this.boxConfigs = this.boxConfigs || [];
    if (this.boxConfigs.length === 0) {
      // 自动生成：每参数一个BoxPlot，默认按文件分组
      this.params.forEach(p => {
        this.boxConfigs.push({title: p, param: p, groupBy: 'file'});
      });
    }
  }

  _renderBoxPlot() {
    this._initBoxConfigs();
    this._refreshBoxUI();
    this.$('btnAddBox').onclick = () => { this.boxConfigs.push({title:'',param:''}); this._refreshBoxUI(); };
    this.$('btnDrawBox').onclick = () => {
      // 先创建DOM
      const container = this.$('boxCharts');
      container.innerHTML = '';
      this.boxConfigs.forEach((c, i) => {
        const div = document.createElement('div'); div.className = 'vt-chart';
        const h3 = document.createElement('h3'); h3.textContent = c.title||('BoxPlot '+(i+1));

        div.appendChild(h3); div.appendChild(canvas); container.appendChild(div);
      });
      // 再逐张画
      this._showProgress('BoxPlot 绘图中...');
      setTimeout(async () => {
        const n = this.boxConfigs.length;
        for (let i = 0; i < n; i++) {
          this._updateProgress(Math.round((i+1)/n*100), 'BoxPlot', (i+1)+'/'+n);
          this._drawOneBox(i, this.boxConfigs[i]);

            <option value="param" ${(c.groupBy||'wafer')==='param'?'selected':''}>参数</option>

  _drawAllBox() {
    const container = this.$('boxCharts');
    container.innerHTML = '';
    this.boxConfigs.forEach((c, i) => {
      const div = document.createElement('div');
      div.className = 'vt-chart';
      div.style.position = 'relative';
      div.innerHTML = `<span style="position:absolute;top:6px;right:10px;cursor:pointer;color:#e74c3c;font-size:1rem;font-weight:700;z-index:5" data-box-del="${i}">✕</span><h3>${c.title||'BoxPlot '+(i+1)}</h3><canvas id="${this.id}-boxCanvas${i}"></canvas>`;
      div.querySelector('[data-box-del]').onclick = (e) => {
        e.stopPropagation();
        this.boxConfigs.splice(i, 1);
        this._refreshBoxUI();
        this._drawAllBox();
      };
      container.appendChild(div);
    });
    requestAnimationFrame(() => {
      this.boxConfigs.forEach((c, i) => this._drawOneBox(i, c));
    });
  }

  _drawOneBox(i, c) {
    if (!ChartJS || !this.paramStats) return;
    const canvas = this.$('boxCanvas' + i);
    if (!canvas) return;

    // 确定 X 轴标签（参数名 或 Wafer/Lot 名）
    let names, groupBy = c.groupBy || 'param';
    // 短标签映射（X轴只显示片号，避免文字重叠；文件模式显示短名）
    const shortLabel = (key, isFile) => {
      const rec = isFile ? this.data.find(r => r._File === key) : this.data.find(r => r._Wafer === key);
      if (!isFile && rec && rec._Wafer != null && rec._Wafer !== '') return String(rec._Wafer);
      if (rec && rec._Batch && rec._Wafer) return rec._Batch + '-' + rec._Wafer;
      return key.length > 15 ? key.slice(-15) : key;
    };
    this._boxLabels = {};
    if (groupBy === 'wafer') {
      names = [...new Set(this.data.map(r => r._Wafer).filter(Boolean))].sort((a,b) => String(a).localeCompare(String(b), 'zh', {numeric:true}));
      names.forEach(n => { this._boxLabels[n] = shortLabel(n, false); });
      if (!names.length) { groupBy = 'param'; names = Object.keys(this.paramStats).slice(0, 10); }
    } else if (groupBy === 'file') {
      names = this.files.map(f => f.name).sort((a,b) => a.localeCompare(b, 'zh', {numeric:true}));
      names.forEach(n => { this._boxLabels[n] = shortLabel(n, true); });
      if (!names.length) { groupBy = 'param'; names = Object.keys(this.paramStats).slice(0, 10); }
    } else if (c.param) {
      names = [c.param];
    } else {
      names = Object.keys(this.paramStats).slice(0, 10);
    }

    const hasPlugin = ChartJS.registry && ChartJS.registry.controllers && ChartJS.registry.controllers.get('boxplot');

    // 用原生 Canvas 画标准盒须图（Q1-Q3 箱体 + 须线 + 异常点）
    if (!hasPlugin) {
      this._drawNativeBoxPlot(canvas, i, c, names, groupBy);
      return;
    }

    if ((groupBy === 'wafer' || groupBy === 'lot') && c.param) {
      // 按 Wafer/Lot 分组：每个 X 标签一个箱
      const datasets = names.map(name => {
        const vals = (groupBy === 'wafer'
          ? this.data.filter(r => r._Wafer === name)
          : this.data.filter(r => (r._Lot || r._File) === name)
        ).map(r => parseFloat(r[c.param])).filter(v => !isNaN(v) && Math.abs(v) < 9999).sort((a,b) => a-b);
        if (vals.length < 5) return null;
        const n = vals.length, q1 = vals[Math.floor(n*0.25)], q3 = vals[Math.floor(n*0.75)];
        return {label: name, data: [{min:Math.max(vals[0],q1-1.5*(q3-q1)),q1,median:vals[Math.floor(n*0.5)],q3,max:Math.min(vals[n-1],q3+1.5*(q3-q1)),outliers:vals.filter(v=>v<q1-1.5*(q3-q1)||v>q3+1.5*(q3-q1))}],backgroundColor:'rgba(77,171,247,0.3)',borderColor:'#4dabf7',borderWidth:1.5};
      }).filter(d=>d);
      this.charts['box'+i] = new ChartJS(canvas.getContext('2d'), {type:'boxplot',data:{labels:names,datasets},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{grid:{color:'#2a3a4a'},ticks:{color:'#7a8ba0'}},x:{grid:{display:false},ticks:{color:'#7a8ba0',maxRotation:45}}}}});
    } else if (c.param && this.files.length > 1) {
      // 单参数多文件对比
      const labels = [c.param];
      if (hasPlugin) {
        const datasets = this.files.map((f, fi) => {
          const vals = this.data.filter(r => r._File === f.name).map(r => parseFloat(r[c.param])).filter(v => !isNaN(v) && Math.abs(v) < 9999).sort((a,b)=>a-b);
          if (vals.length < 5) return null;
          const n = vals.length, q1 = vals[Math.floor(n*0.25)], q3 = vals[Math.floor(n*0.75)];
          return {label:f.name,data:[{min:Math.max(vals[0],q1-1.5*(q3-q1)),q1,median:vals[Math.floor(n*0.5)],q3,max:Math.min(vals[n-1],q3+1.5*(q3-q1)),outliers:vals.filter(v=>v<q1-1.5*(q3-q1)||v>q3+1.5*(q3-q1))}],backgroundColor:FILE_COLORS[fi%FILE_COLORS.length].replace(')',',0.3)').replace('rgb','rgba'),borderColor:FILE_COLORS[fi%FILE_COLORS.length],borderWidth:1.5};
        }).filter(d=>d);
        this.charts['box'+i] = new ChartJS(canvas.getContext('2d'), {type:'boxplot',data:{labels,datasets},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#c8d6e5',boxWidth:10,font:{size:9}}}},scales:{y:{grid:{color:'#2a3a4a'},ticks:{color:'#7a8ba0'}},x:{grid:{display:false},ticks:{color:'#7a8ba0'}}}}});
      } else {
        // 降级：柱状图展示各文件中位数
        const medians = this.files.map(f => {
          const vs = this.data.filter(r=>r._File===f.name).map(r=>parseFloat(r[c.param])).filter(v=>!isNaN(v)&&Math.abs(v)<9999).sort((a,b)=>a-b);
          return vs.length ? vs[Math.floor(vs.length/2)] : 0;
        });
        this.charts['box'+i] = new ChartJS(canvas.getContext('2d'), {type:'bar',data:{labels:this.files.map(f=>f.name),datasets:[{label:c.param+' 中位数',data:medians,backgroundColor:'rgba(77,171,247,0.6)',borderColor:'#4dabf7',borderWidth:1}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{ticks:{color:'#7a8ba0'},grid:{color:'#2a3a4a'}},x:{ticks:{color:'#7a8ba0',maxRotation:30},grid:{display:false}}}}});
      }
    } else {
      // 全部参数模式或单文件
      if (hasPlugin) {
        const data = names.map(p => {
          const s = this.paramStats[p];
          if (!s) return {min:0,q1:0,median:0,q3:0,max:0,outliers:[]};
          return {min:s.lw||s.min,q1:s.q1,median:s.median,q3:s.q3,max:s.uw||s.max,outliers:s.out||[]};
        });
        this.charts['box'+i] = new ChartJS(canvas.getContext('2d'), {type:'boxplot',data:{labels:names,datasets:[{data,backgroundColor:'rgba(77,171,247,0.3)',borderColor:'#4dabf7',borderWidth:1.5}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{grid:{color:'#2a3a4a'},ticks:{color:'#7a8ba0'}},x:{grid:{display:false},ticks:{color:'#7a8ba0',maxRotation:45}}}}});
      } else {
        // 降级：分组柱状图展示 min/q1/median/q3/max
        const statNames = ['min','q1','median','q3','max'];
        const datasets = statNames.map((k, ki) => ({
          label:k,
          data:names.map(p=>{const s=this.paramStats[p];if(!s)return 0;const m={min:s.min,q1:s.q1,median:s.median,q3:s.q3,max:s.max};return m[k]||0;}),
          backgroundColor:['rgba(231,76,60,0.4)','rgba(77,171,247,0.3)','rgba(46,204,113,0.5)','rgba(77,171,247,0.3)','rgba(231,76,60,0.4)'][ki],
          borderColor:['#e74c3c','#4dabf7','#2ecc71','#4dabf7','#e74c3c'][ki],borderWidth:1
        }));
        this.charts['box'+i] = new ChartJS(canvas.getContext('2d'), {type:'bar',data:{labels:names,datasets},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#c8d6e5',boxWidth:10,font:{size:9}}}},scales:{y:{grid:{color:'#2a3a4a'},ticks:{color:'#7a8ba0'}},x:{grid:{display:false},ticks:{color:'#7a8ba0',maxRotation:45}}}}});
      }
    }
  }

      '<div class="vt-mv-tags" style="display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 6px;font-size:0.75rem;align-items:center;justify-content:center">' +

      '</div><canvas id="' + this.id + '-mvCanvas0"></canvas>';

        this._drawMulti();
      };
