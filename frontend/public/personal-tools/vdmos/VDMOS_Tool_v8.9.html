      ctx.fillRect(10+ci*cell,10+ri*cell,cell-1,cell-1);
      if(r&&wpVal==='bin'&&r._Bin!==1){ctx.fillStyle='#fff';ctx.font=`bold ${cell*0.35}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(r._Bin,10+ci*cell+cell/2,10+ri*cell+cell/2)}
      else if(r&&wpVal!=='bin'){ctx.fillStyle='#000';ctx.font=`${cell*0.2}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';const v=+r[wpVal];if(!isNaN(v))ctx.fillText(v<0.001?v.toExponential(1):v.toFixed(3),10+ci*cell+cell/2,10+ri*cell+cell/2)}
    }));
    if(wpVal==='bin'){ctx.fillStyle='#7a8ba0';ctx.font='12px sans-serif';ctx.fillText('BIN 1=PASS | 3=IGSS | 7=BVDSS | 9=IDSS | 11=VTH | 18=CONT | 250=RDSON',10,10+rows.length*cell+20)}
    const a=document.createElement('a');a.href=ec.toDataURL('image/png');a.download='Wafer_Map_完整高清.png';a.click();
  }
  _exportStackPNG() { this._exportPNG('stackCanvas', '复合Wafer_高清.png'); }
  _exportOvPNG() { this._exportPNG('ovCanvas', '叠加分析_高清.png'); }

  // ========== YMS L3: 参数分布直方图 ==========
  _renderDist() {
    this.distConfigs = this.distConfigs || [];
    if (!this.distConfigs.length) {
      this.params.forEach(p => this.distConfigs.push({param:p}));
    }
    this._refreshDistUI();
    this.$('btnAddDist').onclick = () => { this.distConfigs.push({param:this.params[0]||''}); this._refreshDistUI(); };
    this.$('btnDrawDist').onclick = () => this._drawAllDist();
  }

  _refreshDistUI() {
    const cfgDiv = this.$('distConfigs');
    cfgDiv.innerHTML = this.distConfigs.map((c, i) => `
      <div class="vt-row" style="align-items:center;gap:4px;margin-bottom:4px">
        <span style="font-size:0.7rem;color:#7a8ba0">图${i+1}</span>
        <select data-di="${i}" data-f="param" style="background:var(--vt-surface,#1a2735);color:var(--vt-text,#c8d6e5);border:1px solid var(--vt-border,#2a3a4a);padding:3px 5px;border-radius:4px;font-size:0.75rem;width:110px">${this.params.map(p=>`<option ${c.param===p?'selected':''}>${p}</option>`).join('')}</select>
        <button class="vt-btn vt-btn-outline" data-di="${i}" data-f="del" style="padding:3px 8px;font-size:0.7rem;color:var(--vt-fail,#e74c3c)">✕</button>
      </div>
    `).join('');
    cfgDiv.querySelectorAll('select,button').forEach(el => {
      if (el.dataset.f === 'del') { el.onclick = () => { this.distConfigs.splice(+el.dataset.di,1); this._refreshDistUI(); }; return; }
      el.addEventListener('change', () => { this.distConfigs[+el.dataset.di][el.dataset.f] = el.value; });
    });
  }

  _drawAllDist() {
    const container = this.$('distCharts');
    container.innerHTML = '';
    this.distConfigs.forEach((c, i) => {
      if (!c.param) return;
      const div = document.createElement('div');
      div.className = 'vt-chart';
      div.innerHTML = `<h3>${c.param} 分布</h3><div id="${this.id}-distLegend${i}" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px;font-size:0.7rem;color:var(--vt-muted,#7a8ba0);cursor:pointer"></div><canvas id="${this.id}-distCanvas${i}"></canvas><div id="${this.id}-distInfo${i}" style="margin-top:8px;font-size:0.75rem;color:var(--vt-text,#c8d6e5)"></div>`;
      container.appendChild(div);
    });
    setTimeout(() => this.distConfigs.forEach((c,i) => { if(c.param) this._drawOneDist(i,c); }), 30);
  }

  _drawOneDist(i, c) {
    if (!ChartJS) return;
    this._destroyChart('dist'+i);
    const canvas = this.$('distCanvas'+i);
    if (!canvas) return;
    canvas.style.width = '100%'; canvas.style.height = '350px';
    const p = c.param;
    // 1. 数据预处理：剔除明显异常值（IQR法，同BoxPlot须线）
    const rawVals = this.data.map(r => +r[p]).filter(v=>!isNaN(v)).sort((a,b)=>a-b);
    if (rawVals.length < 5) return;
    const rn = rawVals.length;
    const rq1 = rawVals[Math.floor(rn*0.25)], rq3 = rawVals[Math.floor(rn*0.75)], riqr = rq3-rq1;
    const lw = rq1 - 1.5*riqr, uw = rq3 + 1.5*riqr;
    const vals = rawVals.filter(v => v >= lw && v <= uw);
    const removed = rawVals.length - vals.length;
    if (vals.length < 5) return;

    // 计算参考线范围（规格/6σ可能超出数据范围，扩展显示范围）
    const product = this.data[0]._Product;
    let specLo=null, specHi=null;
    if (product && SPEC_LIMITS[product] && SPEC_LIMITS[product][p]) { [specLo, specHi] = SPEC_LIMITS[product][p]; }
    const rawMean = vals.reduce((a,b)=>a+b,0)/vals.length;
    const rawStd = Math.sqrt(vals.reduce((a,b)=>a+(b-rawMean)**2,0)/(vals.length-1));
    const rangeLo = specLo!=null ? Math.min(specLo, rawMean-3*rawStd) : rawMean-3*rawStd;
    const rangeHi = specHi!=null ? Math.max(specHi, rawMean+3*rawStd) : rawMean+3*rawStd;

    let bins = Math.min(30, Math.ceil(Math.sqrt(vals.length)));
    const min = Math.min(vals[0], rangeLo), max = Math.max(vals[vals.length-1], rangeHi);
    // 数据密集区重新分配（扩展后若数据占比<60%，适当加bin数保持分辨率）
    if ((vals[vals.length-1]-vals[0])/(max-min) < 0.6) bins = Math.min(50, Math.ceil(bins*1.6));
    const bw = (max-min)/bins;
    const hist = Array(bins).fill(0);
    vals.forEach(v => { const idx = Math.min(bins-1, Math.floor((v-min)/bw)); hist[idx]++; });
    const labels = hist.map((_,j) => (min+(j+0.5)*bw).toExponential(2));
    const mean = rawMean, std = rawStd;
    const normFit = labels.map((_,j) => { const x=min+(j+0.5)*bw; return vals.length*bw*Math.exp(-0.5*((x-mean)/std)**2)/(std*Math.sqrt(2*Math.PI)); });

    // 2. 量化指标：偏移/离散/综合
    const range = (specLo!=null && specHi!=null) ? specHi-specLo : null;
    const T = (specLo!=null && specHi!=null) ? (specLo+specHi)/2 : null;
    const offPct = (range>0 && T!=null) ? Math.abs(mean-T)/range*100 : null;
    const cp = (range>0 && std>0) ? range/(6*std) : null;
    const cpk = (specLo!=null && specHi!=null && std>0) ? Math.min((specHi-mean)/(3*std),(mean-specLo)/(3*std)) : null;

    const datasets = [{label:'频数',data:hist,backgroundColor:'rgba(77,171,247,0.5)',borderColor:'#4dabf7',borderWidth:1,type:'bar'}];
    if (std > 0) datasets.push({label:'正态拟合',data:normFit,borderColor:'#f39c12',borderWidth:2,pointRadius:0,type:'line',fill:false,tension:0.3});

    // 参考线：每图可点击图例控制显隐（LSL/USL红, T绿, μ黄, μ±3σ紫）
    c._hid = c._hid || {};
    var vLines = [];
    if (specLo !== null) {
      if (!c._hid.spec) vLines.push({value: specLo, color: '#e74c3c', label: 'LSL', dash: [4, 2], width: 1.5});
      if (!c._hid.spec) vLines.push({value: specHi, color: '#e74c3c', label: 'USL', dash: [4, 2], width: 1.5});
      if (!c._hid.t) vLines.push({value: T, color: '#2ecc71', label: 'T', dash: [2, 2], width: 1.5});
      if (!c._hid.mean) vLines.push({value: mean, color: '#f1c40f', label: 'μ', dash: [6, 3], width: 1.5});
      if (std > 0 && !c._hid.six) {
        vLines.push({value: mean - 3*std, color: '#9b59b6', label: 'μ-3σ', dash: [2, 4], width: 1});
        vLines.push({value: mean + 3*std, color: '#9b59b6', label: 'μ+3σ', dash: [2, 4], width: 1});
      }
    }
    // 点击图例切换线显隐
    var lg = this.$('distLegend' + i);
    if (lg) {
      var selfD = this;
      var items = [
        {k: 'spec', color: '#e74c3c', label: 'LSL/USL'},
        {k: 't', color: '#2ecc71', label: 'T'},
        {k: 'mean', color: '#f1c40f', label: 'μ'},
        {k: 'six', color: '#9b59b6', label: 'μ±3σ'}
      ];
      lg.innerHTML = items.map(function(it) {
        var on = !c._hid[it.k];
        return `<span data-vk="${it.k}" style="display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:10px;border:1px solid ${on ? it.color : 'transparent'};opacity:${on ? 1 : 0.35};background:${on ? it.color + '22' : 'transparent'}" title="点击显示/隐藏"><span style="display:inline-block;width:14px;height:2px;background:${it.color};vertical-align:middle"></span>${it.label}</span>`;
      }).join('');
      lg.querySelectorAll('span[data-vk]').forEach(function(el) {
        el.onclick = function() {
          var k = el.dataset.vk;
          c._hid[k] = !c._hid[k];
          selfD._drawOneDist(i, c);
        };
      });
    }
    const vlinePlugin = {
      id: 'distVLines' + i,
      afterDraw(chart) {
        const xs = chart.scales.x, ys = chart.scales.y;
        const top = ys.top + 6, bot = ys.bottom - 2;
        const x0 = xs.left, x1 = xs.right;
        vLines.forEach(l => {
          const idx = (l.value - min) / bw;
          if (idx < -2 || idx > bins + 2) return;
          const x = x0 + (idx / bins) * (x1 - x0);
          const c = chart.ctx;
          c.save();
          c.strokeStyle = l.color;
          c.setLineDash(l.dash);
          c.lineWidth = l.width;
          c.beginPath(); c.moveTo(x, top); c.lineTo(x, bot); c.stroke();
          c.setLineDash([]);
          c.fillStyle = l.color;
          c.font = '9px sans-serif';
          c.textAlign = 'center';
          c.fillText(l.label, x, top + 9);
          c.restore();
        });
      }
    };

    this.charts['dist'+i] = new ChartJS(canvas.getContext('2d'), {
      type:'bar', data:{labels,datasets},
      plugins:[vlinePlugin],
      options:{responsive:true,maintainAspectRatio:false,plugins:{title:{display:true,text:`${p}  μ=${mean.toExponential(3)} σ=${std.toExponential(3)} ${cp!==null?'CP='+cp.toFixed(2):''} ${cpk!==null?'Cpk='+cpk.toFixed(2):''}`,color:'#7a8ba0',font:{size:10}},legend:{labels:{color:'#c8d6e5',boxWidth:8}}},scales:{y:{ticks:{color:'#7a8ba0'},grid:{color:'#2a3a4a'}},x:{ticks:{color:'#7a8ba0',maxRotation:45,maxTicksLimit:12},grid:{display:false}}}}
    });

    // 3. 判定面板
    const info = this.$('distInfo'+i);
    if (info) {
      let H2 = '';
      // 偏移判定：|μ-T|/范围 >15% 明显偏移
      if (offPct != null) {
        const offOk = offPct <= 15;
        H2 += `<span style="margin-right:14px">偏移: <b style="color:${offOk?'#2ecc71':'#e74c3c'}">${offPct.toFixed(1)}%</b> ${offOk?'✅':'⚠ 峰值偏离规格中心'}</span>`;
      }
      // 离散度判定：CP<1 超标，≥1.33 合格
      if (cp != null) {
        const cpOk = cp >= 1.33, cpWarn = cp >= 1;
        H2 += `<span style="margin-right:14px">离散度: <b style="color:${cpOk?'#2ecc71':cpWarn?'#f39c12':'#e74c3c'}">CP=${cp.toFixed(2)}</b> ${cpOk?'✅ 6σ≤规格区间':cpWarn?'⚠ 1≤CP<1.33':'❌ 6σ超规格'}</span>`;
      }
      // 综合判定
      if (cpk != null) {
        const cpkOk = cpk >= 1.33, cpkWarn = cpk >= 1;
        let advice = cpkOk ? '合格' : (cpkWarn ? '需关注' : '❌ 偏移+离散超标，需调均值+降波动');
        H2 += `<span style="margin-right:14px">综合: <b style="color:${cpkOk?'#2ecc71':cpkWarn?'#f39c12':'#e74c3c'}">Cpk=${cpk.toFixed(2)}</b> ${advice}</span>`;
      }
      if (removed > 0) H2 += `<span style="color:#7a8ba0">剔除异常值 ${removed} 个</span>`;
      info.innerHTML = H2;
    }
  }

  // ========== YMS L4: 相关性矩阵 ==========
  _renderCorr() {
    this._destroyChart('corrChart');
    if (this.params.length < 2) return;

    const n = Math.min(15, this.params.length);
    const selParams = this.params.slice(0, n);

    // 预计算：一次遍历提取所有参数值
    const maxSample = 5000;
    const step = this.data.length > maxSample ? Math.ceil(this.data.length / maxSample) : 1;
    const cols = selParams.map(() => []);
    for (let i = 0; i < this.data.length; i += step) {
      selParams.forEach((p, pi) => { const v = +this.data[i][p]; if (!isNaN(v)) cols[pi].push(v); });
    }

    // 只算上三角，对称复制
    const matrix = [];
    for (let i = 0; i < n; i++) { matrix[i] = new Array(n).fill(0); }
    for (let i = 0; i < n; i++) {
      for (let j = 0; j <= i; j++) {
        const xs = cols[i], ys = cols[j], len = Math.min(xs.length, ys.length);
        if (len < 5) continue;
        let sx=0,sy=0,sxx=0,syy=0,sxy=0;
        for (let k=0;k<len;k++) { sx+=xs[k]; sy+=ys[k]; sxx+=xs[k]*xs[k]; syy+=ys[k]*ys[k]; sxy+=xs[k]*ys[k]; }
        const num = len*sxy - sx*sy;
        const den = Math.sqrt((len*sxx-sx*sx)*(len*syy-sy*sy));
        const r = den > 0 ? num/den : 0;
        matrix[i][j] = r; matrix[j][i] = r;
      }
    }

    // Canvas 热力图
    const canvas = this.$('corrChart');
    const cellW = 42, cellH = 32, padL = 100, padT = 22, gap = 2;
    canvas.width = padL + n * cellW + 20;
    canvas.height = padT + n * cellH + 20;
    canvas.style.width = canvas.width + 'px';
    canvas.style.height = canvas.height + 'px';

    const ctx = canvas.getContext('2d');
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = '#0f1923'; ctx.fillRect(0,0,canvas.width,canvas.height);

    for (let i = 0; i < n; i++) {
      for (let j = 0; j < n; j++) {
        const v = matrix[i][j];
        const a = Math.min(1, Math.abs(v));
        if (v >= 0) ctx.fillStyle = `rgb(${Math.round(46+a*180)},${Math.round(204-a*160)},${Math.round(113+a*140)})`;
        else ctx.fillStyle = `rgb(${Math.round(231-a*30)},${Math.round(76+a*130)},${Math.round(60+a*140)})`;
        ctx.fillRect(padL + j * cellW, padT + i * cellH, cellW - gap, cellH - gap);
        ctx.fillStyle = Math.abs(v) > 0.5 ? '#fff' : '#333';
        ctx.font = '9px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        if (cellW >= 35) ctx.fillText(v.toFixed(2), padL + j * cellW + cellW/2, padT + i * cellH + cellH/2);
      }
    }

    // 标签
    ctx.fillStyle = '#8899aa'; ctx.font = '9px sans-serif';
    for (let i = 0; i < n; i++) {
      const label = selParams[i].length > 10 ? selParams[i].slice(0,9)+'…' : selParams[i];
      ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      ctx.fillText(label, padL - 4, padT + i * cellH + cellH/2);
      ctx.textAlign = 'left';
      ctx.save(); ctx.translate(padL + i * cellW + cellW/2, padT - 4); ctx.rotate(-0.5);
      ctx.fillText(label, 0, 0); ctx.restore();
    }
  }

  // ========== YMS L5: 失效帕累托 ==========
  _renderPareto() {
    this._destroyChart('paretoChart');
    if (!ChartJS) return;

    // 非 BIN 1 的失效统计
    const failBins = Object.entries(this.binStats).filter(([b]) => b !== '1').sort((a,b) => b[1]-a[1]);
    if (!failBins.length) return;

    const labels = failBins.map(([b]) => { const bc = BIN_COLORS[b] || BIN_COLORS[999]; return bc.label; });
    const counts = failBins.map(([,c]) => c);
    const total = counts.reduce((a,b) => a+b, 0);
    let cum = 0;
    const cumPct = counts.map(c => { cum += c; return (cum/total*100); });

    this.charts.paretoChart = new ChartJS(this.$('paretoChart').getContext('2d'), {
      type:'bar', data:{labels,datasets:[
        {label:'失效数',data:counts,backgroundColor:'rgba(231,76,60,0.6)',borderColor:'#e74c3c',borderWidth:1,yAxisID:'y'},
        {label:'累计占比 %',data:cumPct,borderColor:'#f39c12',borderWidth:2,pointRadius:4,type:'line',yAxisID:'y1',fill:false,tension:0.1}
      ]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#c8d6e5'}}},scales:{y:{type:'linear',position:'left',ticks:{color:'#7a8ba0'},grid:{color:'#2a3a4a'},title:{display:true,text:'颗数',color:'#7a8ba0'}},y1:{type:'linear',position:'right',min:0,max:100,ticks:{color:'#f39c12',callback:v=>v+'%'},grid:{display:false}},x:{ticks:{color:'#7a8ba0',maxRotation:30},grid:{display:false}}}}
    });
  }

  // ========== Cpk 汇总表 ==========
  _renderCpkTable() {
    if (!this.paramStats || !Object.keys(this.paramStats).length) return;
    const rows = Object.entries(this.paramStats).map(([p,s]) => {
      const cpk = s.cpk !== null ? s.cpk.toFixed(2) : '--';
      let color = 'var(--vt-text)';
      if (s.cpk !== null) {
        if (s.cpk >= 1.33) color = 'var(--vt-good)';
        else if (s.cpk >= 1.0) color = '#f39c12';
        else color = 'var(--vt-fail)';
      }
      return `<tr><td>${p}</td><td>${s.mean.toExponential(3)}</td><td>${s.std.toExponential(3)}</td><td>${s.spec?('['+s.spec[0].toExponential(2)+', '+s.spec[1].toExponential(2)+']'):'--'}</td><td style="color:${color};font-weight:700">${cpk}</td></tr>`;
    }).join('');
    this.$('cpkTable').innerHTML = `<thead><tr><th>参数</th><th>均值</th><th>标准差</th><th>规格限</th><th>Cpk</th></tr></thead><tbody>${rows}</tbody>`;
  }

  // ========== 区域分析 ==========
  _renderZone() {
    this._destroyChart('zoneYieldChart'); this._destroyChart('zoneParamChart');
    if (!ChartJS) return;

    // 缓存区域数据，避免每次切换重新计算
    if (!this._zoneCache || this._zoneCache.version !== this.data.length) {
      const zones = {center:[], mid:[], edge:[]};
      // 预计算行范围（只算一次，不在循环内重复）
      const allRows = [...new Set(this.data.map(d => parseInt(d.Row) || parseInt(d.row) || parseInt(d.Y) || parseInt(d.y) || parseInt(d.YCoord) || parseInt(d.ycoord) || 0))].filter(v=>v!==0).sort((a,b)=>a-b);
      const minR = allRows[0] || 0, maxR = allRows[allRows.length-1] || 1;
      this.data.forEach(r => {
        const row = parseInt(r.Row) || parseInt(r.row) || parseInt(r.Y) || parseInt(r.y) || parseInt(r.YCoord) || parseInt(r.ycoord) || 0;
        if (!row) return;
        const pos = (row - minR) / (maxR - minR || 1);
        if (pos < 0.33) zones.center.push(r);
        else if (pos < 0.66) zones.mid.push(r);
        else zones.edge.push(r);
      });
      this._zoneCache = {version: this.data.length, zones, zoneData: [zones.center, zones.mid, zones.edge]};
    }

    const zoneNames = ['Center', 'Mid', 'Edge'];
    const zoneData = this._zoneCache.zoneData;

    // 良率对比（只画图，不重复拼接 DOM）
    const yields = zoneData.map(z => z.length ? (z.filter(r => r._Bin === 1).length / z.length * 100) : 0);
    this.charts.zoneYieldChart = new ChartJS(this.$('zoneYieldChart').getContext('2d'), {
      type:'bar', data:{labels:zoneNames, datasets:[{label:'良率 (%)',data:yields,backgroundColor:['rgba(46,204,113,0.6)','rgba(243,156,18,0.6)','rgba(231,76,60,0.6)'],borderColor:['#2ecc71','#f39c12','#e74c3c'],borderWidth:2,borderRadius:6}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},title:{display:true,text:'Edge 失效通常为蚀刻/薄膜均匀性问题',color:'#7a8ba0',font:{size:9}}},scales:{y:{min:0,max:100,ticks:{color:'#7a8ba0',callback:v=>v+'%'},grid:{color:'#2a3a4a'}},x:{ticks:{color:'#7a8ba0'},grid:{display:false}}}}
    });

    // 参数下拉（仅首次填充，避免闪烁）
    const sel = this.$('zoneParam');
    if (!sel.options.length || sel.options[0].textContent === '-- 选参数 --') {
      sel.innerHTML = '<option>-- 选参数 --</option>' + this.params.map(p => `<option>${p}</option>`).join('');
    }
    sel.onchange = () => this._drawZoneParam();
    if (this.params.length > 0 && !sel.value.startsWith('--')) { this._drawZoneParam(); }
    else if (this.params.length > 0) { sel.value = this.params[0]; this._drawZoneParam(); }
  }

  _drawZoneParam() {
    if (!this._zoneCache) return;
    this._destroyChart('zoneParamChart');
    if (!ChartJS) return;
    const p = this.$('zoneParam').value;
    if (p.startsWith('--')) return;
    const zoneNames = ['Center', 'Mid', 'Edge'];
    const zoneData = this._zoneCache.zoneData;
    const means = zoneData.map(z => {
      const vs = z.map(r => parseFloat(r[p])).filter(v => !isNaN(v));
      return vs.length ? vs.reduce((a,b)=>a+b,0)/vs.length : 0;
    });
    this.charts.zoneParamChart = new ChartJS(this.$('zoneParamChart').getContext('2d'), {
      type:'bar', data:{labels:zoneNames,datasets:[{label:p+' 均值',data:means,backgroundColor:['rgba(77,171,247,0.6)','rgba(243,156,18,0.6)','rgba(231,76,60,0.6)'],borderColor:['#4dabf7','#f39c12','#e74c3c'],borderWidth:2,borderRadius:6}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{ticks:{color:'#7a8ba0'},grid:{color:'#2a3a4a'}},x:{ticks:{color:'#7a8ba0'},grid:{display:false}}}}
    });
  }

  // ========== 复合 Wafer Map ==========
  _renderStack() {
    const canvas = this.$('stackCanvas');
    const ctx = canvas.getContext('2d');
    // 批次下拉（仅首次填充，避免重置选中值）
    const lots = [...new Set(this.data.map(r => r._Lot).filter(Boolean))].sort();
    const lotSel = this.$('stackLot');
    if (lotSel && !lotSel.dataset.init) {
      lotSel.innerHTML = '<option>全部批次</option>' + lots.map(l => `<option>${l}</option>`).join('');
      lotSel.dataset.init = '1';
    }
    const lotVal = lotSel ? lotSel.value : '全部批次';
    var dataAll = lotVal === '全部批次' ? this.data : this.data.filter(r => r._Lot === lotVal);

    // 圆片下拉（按批次联动，保留选中值）
    const wfSel = this.$('stackWafer');
    if (wfSel) {
      var prevWf = wfSel.value;
      var wfList = [...new Set(dataAll.map(r => r._Wafer).filter(Boolean))].sort(function(a,b){ return parseInt(a)-parseInt(b); });
      var wfHtml = '<option value="">全部圆片</option>' + wfList.map(w => `<option value="${w}">${w}</option>`).join('');
      if (wfSel.innerHTML !== wfHtml) {
        wfSel.innerHTML = wfHtml;
        if (wfList.indexOf(prevWf) >= 0) wfSel.value = prevWf;
      }
    }
    const wfVal = wfSel ? wfSel.value : '';
    if (wfVal !== '') dataAll = dataAll.filter(r => r._Wafer === wfVal);

    // 右侧批次圆片统计表
    var stTitle = this.$('stackStatTitle');
    var stBody = this.$('stackStatTable') ? this.$('stackStatTable').querySelector('tbody') : null;
    if (stTitle && stBody) {
      stTitle.textContent = lotVal === '全部批次' ? '（全部批次）' : ('批次 ' + lotVal);
      var stMap = {};
      dataAll.forEach(function(r) { var w = r._Wafer || '?'; stMap[w] = stMap[w] || {n: 0, f: 0}; stMap[w].n++; if (r._Bin !== 1) stMap[w].f++; });
      var stRows = [];
      Object.keys(stMap).sort(function(a, b) { return parseInt(a) - parseInt(b); }).forEach(function(w) {
        var s = stMap[w];
        var y = s.n ? ((s.n - s.f) / s.n * 100) : 0;
        var yc = y >= 90 ? '#2ecc71' : y >= 80 ? '#f39c12' : '#e74c3c';
        stRows.push('<tr><td>' + w + '</td><td>' + s.n + '</td><td style="color:' + yc + ';font-weight:700">' + y.toFixed(2) + '</td><td style="color:#e74c3c">' + s.f + '</td></tr>');
      });
      stBody.innerHTML = stRows.join('') || '<tr><td colspan="4" style="color:#7a8ba0;text-align:center">无数据</td></tr>';
    }

    const wafers = [...new Set(dataAll.map(r => r._Wafer))].filter(Boolean);
    if (!wafers.length) { ctx.clearRect(0,0,canvas.width,canvas.height); return; }

    // 收集所有 Row/Col
    const allRows = [...new Set(dataAll.map(r => parseInt(r.Row) || parseInt(r.row) || parseInt(r.Y) || parseInt(r.y) || parseInt(r.YCoord) || parseInt(r.ycoord) || 0))].filter(v=>v!==0).sort((a,b)=>a-b);
    const allCols = [...new Set(dataAll.map(r => parseInt(r.Col) || parseInt(r.col) || parseInt(r.X) || parseInt(r.x) || parseInt(r.XCoord) || parseInt(r.xcoord) || 0))].filter(v=>v!==0).sort((a,b)=>a-b);
    if (!allRows.length || !allCols.length) { ctx.clearRect(0,0,canvas.width,canvas.height); ctx.fillStyle='#7a8ba0'; ctx.font='14px sans-serif'; ctx.textAlign='center'; ctx.fillText('无坐标数据',canvas.width/2,canvas.height/2); return; }

    const cellW = Math.min(24, Math.floor((canvas.parentElement.clientWidth - 40) / (allCols.length + 1)));
    const cellH = cellW;
    canvas.width = (allCols.length + 1) * cellW + 20;
    canvas.height = (allRows.length + 1) * cellH + 20;
    canvas.style.width = canvas.width + 'px';
    canvas.style.height = canvas.height + 'px';

    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = '#0f1923'; ctx.fillRect(0,0,canvas.width,canvas.height);

    // 计算每个位置的失效密度
    const failMap = {};
    allRows.forEach(row => { failMap[row] = {}; allCols.forEach(col => { failMap[row][col] = {fail:0,total:0}; }); });
    dataAll.forEach(r => {
      const row = parseInt(r.Row) || parseInt(r.row) || parseInt(r.Y) || parseInt(r.y) || parseInt(r.YCoord) || parseInt(r.ycoord) || 0;
      const col = parseInt(r.Col) || parseInt(r.col) || parseInt(r.X) || parseInt(r.x) || parseInt(r.XCoord) || parseInt(r.xcoord) || 0;
      if (!row || !col || !failMap[row] || !failMap[row][col]) return;
      failMap[row][col].total++;
      if (r._Bin !== 1) failMap[row][col].fail++;
    });

    // 找最大值用于着色
    let maxFailRate = 0;
    allRows.forEach(row => allCols.forEach(col => {
      const f = failMap[row][col];
      if (f.total > 0) { const rate = f.fail / f.total; if (rate > maxFailRate) maxFailRate = rate; }
    }));

    // 渲染
    allRows.forEach((row, ri) => {
      allCols.forEach((col, ci) => {
        const f = failMap[row][col];
        const rate = f.total > 0 ? f.fail / f.total : 0;
        const alpha = maxFailRate > 0 ? rate / maxFailRate : 0;
        // 系统性(多wafer失效) → 红色，随机 → 灰色
        if (rate > 0) {
          ctx.fillStyle = `rgba(231,76,60,${0.15 + alpha * 0.85})`;
        } else if (f.total > 0) {
          ctx.fillStyle = 'rgba(46,204,113,0.25)';
        } else {
          ctx.fillStyle = '#1a2735';
        }
        ctx.fillRect(10 + ci * cellW, 10 + ri * cellH, cellW - 1, cellH - 1);
        // 黑色标注：失效占比
        if (f.total > 0 && rate > 0) {
          ctx.fillStyle = '#000';
          ctx.font = `${Math.max(7, cellW*0.28)}px sans-serif`;
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText((rate*100).toFixed(0)+'%', 10+ci*cellW+cellW/2, 10+ri*cellH+cellH/2);
        }
      });
    });

    // 图例
    ctx.fillStyle = '#7a8ba0'; ctx.font = '9px sans-serif';
    ctx.fillText('绿=良品  红=失效(越深越系统化)  深灰=无数据  数字=失效%', 10, 10 + allRows.length * cellH + 14);
    ctx.fillText('Wafers: ' + wafers.join(', '), 10, 10 + allRows.length * cellH + 28);
  }

  _drawAllCustom() {
    const container = this.$('customCharts');
    container.innerHTML = '';
    this.customCharts.forEach((c, i) => {
      if (!c.xParam || !c.yParam) return;
      const div = document.createElement('div');
      div.className = 'vt-chart';
      div.innerHTML = `<h3>${c.title||'图'+(i+1)}</h3><canvas id="${this.id}-customCanvas${i}"></canvas>`;
      container.appendChild(div);
    });
    // 等 DOM 落地后再逐张渲染
    setTimeout(() => {
      this.customCharts.forEach((c, i) => {
        if (!c.xParam || !c.yParam) return;
        this._drawOneCustom(i, c);
      });
    }, 50);
  }

  _drawOneCustom(i, c) {
    if (!ChartJS) return;
    const canvas = this.$('customCanvas' + i);
    if (!canvas) return;
    const type = c.type || 'scatter';
    const MAX = 1500;
    const sample = (arr, max) => { if (arr.length<=max) return arr; const step=Math.ceil(arr.length/max), res=[]; for(let j=0;j<arr.length;j+=step)res.push(arr[Math.min(j+Math.floor(Math.random()*Math.min(step,arr.length-j)),arr.length-1)]); return res; };

    // 检测 X 是否为分类字段（非数字列）
    const xVals = this.data.map(r => r[c.xParam]).filter(v => v !== undefined && v !== '');
    const isNumericX = xVals.length > 0 && xVals.every(v => !isNaN(parseFloat(v)) || v === '' || v === undefined);

    let config;

    // 分组
    const groupBy = c.groupBy || '';
    const groups = groupBy === 'wafer'
      ? [...new Set(this.data.map(r => r._Wafer).filter(Boolean))].sort().slice(0, 20)
      : groupBy === 'file'
      ? this.files.map(f => f.name)
      : null;

    if (type === 'pie') {
      // 饼图：按 BIN 分类统计
      const bins = {};
      const src = groups ? this.data.filter(r => (groupBy === 'wafer' ? groups.includes(r._Wafer) : groups.includes(r._File))) : this.data;
      src.forEach(r => {
        const v = parseFloat(r[c.xParam] || r[c.yParam]);
        if (isNaN(v)) return;
        const label = r._Bin === 1 ? '良品' : ('BIN '+r._Bin);
        bins[label] = (bins[label]||0) + 1;
      });
      const labels = Object.keys(bins);
      const data = Object.values(bins);
      const bgColors = ['#2ecc71','#e74c3c','#f39c12','#9b59b6','#1abc9c','#e91e63','#00bcd4','#ff9800','#607d8b','#4dabf7'];
      config = {
        type:'pie', data:{labels,datasets:[{data,backgroundColor:bgColors.slice(0,labels.length)}]},
        options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#c8d6e5',boxWidth:8,font:{size:9}}}}}
      };
    } else if (type === 'area') {
      // 面积图 = 折线图 + fill
      const pts = []; this.data.forEach(r => { const x=+r[c.xParam],y=+r[c.yParam]; if(!isNaN(x)&&!isNaN(y))pts.push({x,y}); });
      pts.sort((a,b)=>a.x-b.x);
      config = {type:'line',data:{datasets:[{label:c.yParam,data:sample(pts,MAX),borderColor:'#4dabf7',backgroundColor:'rgba(77,171,247,0.3)',fill:true,pointRadius:0,tension:0.3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#c8d6e5'}}},scales:{x:{title:{display:!!c.xLabel,text:c.xLabel||c.xParam,color:'#7a8ba0'},ticks:{color:'#7a8ba0'},grid:{color:'#2a3a4a'}},y:{title:{display:!!c.yLabel,text:c.yLabel||c.yParam,color:'#7a8ba0'},ticks:{color:'#7a8ba0'},grid:{color:'#2a3a4a'}}}}};
    } else if (type === 'doughnut') {
      const bins = {};
      this.data.forEach(r => { const label = r._Bin===1?'良品':('BIN '+r._Bin); bins[label]=(bins[label]||0)+1; });
      config = {type:'doughnut',data:{labels:Object.keys(bins),datasets:[{data:Object.values(bins),backgroundColor:['#2ecc71','#e74c3c','#f39c12','#9b59b6','#1abc9c','#e91e63','#00bcd4','#ff9800','#607d8b','#4dabf7']}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#c8d6e5',boxWidth:8,font:{size:9}}}}}};
    } else if (type === 'polar') {
      const bins = {};
      this.data.forEach(r => { const label = r._Bin===1?'良品':('BIN '+r._Bin); bins[label]=(bins[label]||0)+1; });
      config = {type:'polarArea',data:{labels:Object.keys(bins),datasets:[{data:Object.values(bins),backgroundColor:['#2ecc71','#e74c3c','#f39c12','#9b59b6','#1abc9c','#e91e63','#00bcd4','#ff9800','#607d8b','#4dabf7']}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#c8d6e5',boxWidth:8,font:{size:9}}}}}};
    } else if (type === 'radar') {
      const dims = this.params.slice(0, 8);
      const gs = groups || this.files.map(f => f.name);
      if (gs.length) {
        const datasets = gs.map((g, gi) => ({
          label: String(g),
          data: dims.map(p => {
            const vals = ((groups&&groupBy==='wafer')?this.data.filter(r=>r._Wafer===g):this.data.filter(r=>r._File===g)).map(r=>+r[p]).filter(v=>!isNaN(v));
            return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : 0;
          }),
          borderColor: FILE_COLORS[gi%FILE_COLORS.length],
          backgroundColor: FILE_COLORS[gi%FILE_COLORS.length].replace(')',',0.15)').replace('rgb','rgba')
        }));
        config = {type:'radar',data:{labels:dims,datasets},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#c8d6e5',boxWidth:8,font:{size:9}}}}}};
      }
    } else if (type === 'bubble') {
      const pts = []; this.data.forEach(r => { const x=+r[c.xParam],y=+r[c.yParam]; if(!isNaN(x)&&!isNaN(y))pts.push({x,y,r:Math.max(2,Math.abs(y-x)/10||3)}); });
      const s = sample(pts, 500);
      config = {type:'bubble',data:{datasets:[{label:c.yParam+' vs '+c.xParam,data:s,backgroundColor:'rgba(77,171,247,0.5)',borderColor:'#4dabf7'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#c8d6e5'}}},scales:{x:{ticks:{color:'#7a8ba0'},grid:{color:'#2a3a4a'}},y:{ticks:{color:'#7a8ba0'},grid:{color:'#2a3a4a'}}}}};
    } else if (type === '3d') {
      this._draw3DScatter(i, c, canvas);
      return;
    } else if (type === 'scatter' || type === 'line') {
      // X = 行序号（与散点图一致）
      const pts = []; this.data.forEach(function(r, idx) { var y=+r[c.yParam]; if(!isNaN(y))pts.push({x:idx, y:y}); });
      const s = sample(pts, 2000);
      let ds = [{label:c.yParam,data:s,borderColor:'#4dabf7',backgroundColor:'rgba(77,171,247,0.4)',pointRadius:3}];
      if (s.length > 5) {
        const yVals = s.map(p=>p.y);
        const ccProd = this.data[0] ? this.data[0]._Product : '';
        const ccSpec = (ccProd && SPEC_LIMITS[ccProd] && SPEC_LIMITS[ccProd][c.yParam]) ? SPEC_LIMITS[ccProd][c.yParam] : null;
        let ucl = null, lcl = null;
        if (ccSpec && (ccSpec[0] != null || ccSpec[1] != null)) {
          lcl = ccSpec[0] != null ? ccSpec[0] : null;
          ucl = ccSpec[1] != null ? ccSpec[1] : null;
        } else {
          const mean = yVals.reduce((a,b)=>a+b,0)/yVals.length;
          const std = Math.sqrt(yVals.reduce((a,b)=>a+(b-mean)**2,0)/(yVals.length-1));
          ucl = mean + 3*std; lcl = mean - 3*std;
        }
        const xR = [Math.min(...s.map(p=>p.x)), Math.max(...s.map(p=>p.x))];
        if (ucl != null) ds.push({label:'UCL='+ucl.toFixed(4),data:[{x:xR[0],y:ucl},{x:xR[1],y:ucl}],borderColor:'red',borderWidth:1.5,borderDash:[5,3],pointRadius:0,showLine:true,fill:false});
        if (lcl != null) ds.push({label:'LCL='+lcl.toFixed(4),data:[{x:xR[0],y:lcl},{x:xR[1],y:lcl}],borderColor:'red',borderWidth:1.5,borderDash:[5,3],pointRadius:0,showLine:true,fill:false});
      }
      config = {type:type==='line'?'line':'scatter',data:{datasets:ds},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#333'}}},scales:{x:{title:{display:true,text:'行序号',color:'#333'},ticks:{color:'#333'},grid:{color:'#e0e0e0'}},y:{ticks:{color:'#333'},grid:{color:'#e0e0e0'}}}}};
    } else {
      if (!isNumericX && !groups) {
        // 分类X → 柱状图: X=分类, Y=参数均值
        const cats = [...new Set(xVals)].sort().slice(0, 30);
        const means = cats.map(cat => {
          const vals = this.data.filter(r => r[c.xParam] === cat).map(r => +r[c.yParam]).filter(v => !isNaN(v));
          return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : 0;
        });
        config = {type:'bar', data:{labels:cats,datasets:[{label:c.yParam+' 均值',data:means,backgroundColor:'rgba(77,171,247,0.6)',borderColor:'#4dabf7',borderWidth:1}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{ticks:{color:'#7a8ba0'},grid:{color:'#2a3a4a'}},x:{ticks:{color:'#7a8ba0',maxRotation:45},grid:{display:false}}}}};
        this.charts['custom'+i] = new ChartJS(canvas.getContext('2d'), config);
        return;
      }

      const scales = {};
      scales.x = { title:{display:!!c.xLabel,text:c.xLabel||c.xParam,color:'#7a8ba0'}, grid:{color:'#2a3a4a'}, ticks:{color:'#7a8ba0'} };
      scales.y = { title:{display:!!c.yLabel,text:c.yLabel||c.yParam,color:'#7a8ba0'}, grid:{color:'#2a3a4a'}, ticks:{color:'#7a8ba0'} };
      if (c.xMin) scales.x.min = +c.xMin;
      if (c.xMax) scales.x.max = +c.xMax;
      if (c.yMin) scales.y.min = +c.yMin;
      if (c.yMax) scales.y.max = +c.yMax;

      if (groups) {
        // 分组散点：X=组名(Y坐标偏移), Y=参数值
        const datasets = groups.map((g, gi) => {
          const pts = []; this.data.forEach(r => {
            if ((groupBy === 'wafer' ? r._Wafer !== g : r._File !== g)) return;
            const v = +r[c.yParam || c.xParam];
            if (!isNaN(v)) pts.push(v);
          });
          if (!pts.length) return null;
          const color = FILE_COLORS[gi % FILE_COLORS.length];
          const sampled = sample(pts, MAX / groups.length);
          // 给每组加X偏移以区分
          const offset = (gi - (groups.length-1)/2) * 0.15;
          return {label: g, data: sampled.map(v => ({x: gi + offset + (Math.random()-0.5)*0.1, y: v})), backgroundColor: color.replace(')', ',0.4)').replace('rgb', 'rgba'), pointRadius: 2};
        }).filter(Boolean);
        scales.x = { title:{display:true,text:groupBy==='wafer'?'圆片':'文件',color:'#7a8ba0'}, ticks:{color:'#7a8ba0',callback:(v,i)=>groups[i]||''}, grid:{color:'#2a3a4a'} };
        scales.y = { title:{display:!!c.yLabel,text:c.yLabel||c.yParam||c.xParam,color:'#7a8ba0'}, grid:{color:'#2a3a4a'}, ticks:{color:'#7a8ba0'} };
        config = {type:'scatter', data:{datasets}, options:{responsive:true,maintainAspectRatio:false,animation:false,plugins:{legend:{labels:{color:'#c8d6e5',boxWidth:8,font:{size:9}}}},scales}};
      } else {
        const pass = [], fail = [];
        this.data.forEach(r => {
          const x = parseFloat(r[c.xParam]), y = parseFloat(r[c.yParam]);
          if (isNaN(x) || isNaN(y)) return;
          (r._Bin === 1 ? pass : fail).push({x,y});
        });
        config = {
          type:'scatter', data:{datasets:[
            {label:'良品',data:sample(pass,MAX),backgroundColor:'rgba(46,204,113,0.5)',pointRadius:pass.length>MAX?1:3},
            {label:'失效',data:sample(fail,MAX),backgroundColor:'rgba(231,76,60,0.5)',pointRadius:fail.length>MAX?1:3}
          ]},
          options:{responsive:true,maintainAspectRatio:false,animation:false,plugins:{legend:{labels:{color:'#c8d6e5',boxWidth:8,font:{size:9}}}},scales}
        };
      }
    }

    this.charts['custom'+i] = new ChartJS(canvas.getContext('2d'), config);
  }

  // ========== 原生 BoxPlot Canvas 绘制 ==========
  _drawNativeBoxPlot(canvas, i, c, names, groupBy) {
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    groupBy = groupBy || 'param';

    // 收集每个 name 的五数概括（携带 name，避免过滤后索引错位）
    const selParam = c.param || '';
    const boxData = names.map(name => {
      if (groupBy === 'wafer') {
        // parseFloat + 排除空串(→NaN)与9999哨兵
        const vals = this.data.filter(r => r._Wafer === name).map(r => parseFloat(r[selParam])).filter(v => !isNaN(v) && Math.abs(v) < 9999).sort((a,b) => a-b);
        if (vals.length < 5) return null;
        var f1 = this._fiveNum(vals); f1.name = name; return f1;
      }
      if (groupBy === 'file') {
        const vals = this.data.filter(r => r._File === name).map(r => parseFloat(r[selParam])).filter(v => !isNaN(v) && Math.abs(v) < 9999).sort((a,b) => a-b);
        if (vals.length < 5) return null;
        var f2 = this._fiveNum(vals); f2.name = name; return f2;
      }
      if (c.param && this.files.length > 1) {
        const vals = this.data.filter(r => r._File === this.files[0]?.name).map(r => parseFloat(r[c.param])).filter(v => !isNaN(v) && Math.abs(v) < 9999).sort((a,b) => a-b);
        if (vals.length < 5) return null;
        var f3 = this._fiveNum(vals); f3.name = name; return f3;
      }
      const s = this.paramStats[name];
      if (!s) return null;
      return {name: name, min: s.lw || s.min, q1: s.q1, median: s.median, q3: s.q3, max: s.uw || s.max, outliers: s.out || []};
    }).filter(Boolean);

    if (!boxData.length) return;

    const pad = { top: 30, right: 30, bottom: 60, left: 70 };
    const W = Math.max(400, (canvas.parentElement.clientWidth || 700) - 20);
    const H = 380;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.scale(dpr, dpr);

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);

    // 外点显示开关
    var showOutliers = !c.hideOutliers;
    var chkId = this.id + '-boxOutlier' + i;
    var existingChk = document.getElementById(chkId);
    if (!existingChk) {
      var chk = document.createElement('label');
      chk.style.cssText = 'position:absolute;top:6px;left:10px;font-size:0.7rem;color:#8899aa;z-index:5;cursor:pointer';
      chk.innerHTML = '<input type="checkbox" id="' + chkId + '" ' + (showOutliers ? 'checked' : '') + ' style="vertical-align:middle"> 显示外点';
      canvas.parentElement.style.position = 'relative';
      canvas.parentElement.appendChild(chk);
      var self = this;
      document.getElementById(chkId).onchange = function() {
        c.hideOutliers = !this.checked;
        self._drawOneBox(i, c);
      };
    }

    // Y轴手动范围输入（每图独立，仿"显示外点"动态创建）
    var yMinId = this.id + '-boxYMin' + i, yMaxId = this.id + '-boxYMax' + i;
    var existingYBar = document.getElementById(yMinId);
    if (!existingYBar) {
      var ybar = document.createElement('div');
      ybar.style.cssText = 'position:absolute;top:6px;right:10px;font-size:0.7rem;color:#8899aa;z-index:5;display:flex;align-items:center;gap:4px';
      ybar.innerHTML = '<span>Y值:</span><input id="' + yMinId + '" type="number" step="any" placeholder="Min" style="width:60px;background:#111a24;color:#fff;border:1px solid #2a3a4a;padding:2px 4px;border-radius:4px;font-size:0.7rem">&nbsp;~&nbsp;<input id="' + yMaxId + '" type="number" step="any" placeholder="Max" style="width:60px;background:#111a24;color:#fff;border:1px solid #2a3a4a;padding:2px 4px;border-radius:4px;font-size:0.7rem">';
      canvas.parentElement.appendChild(ybar);
      var self2 = this;
      document.getElementById(yMinId).onchange = function() { c.yMin = this.value === '' ? undefined : parseFloat(this.value); self2._drawOneBox(i, c); };
      document.getElementById(yMaxId).onchange = function() { c.yMax = this.value === '' ? undefined : parseFloat(this.value); self2._drawOneBox(i, c); };
    }
    var yminEl = document.getElementById(yMinId), ymaxEl = document.getElementById(yMaxId);
    if (yminEl) yminEl.value = c.yMin != null ? c.yMin : '';
    if (ymaxEl) ymaxEl.value = c.yMax != null ? c.yMax : '';

    // 中位线 tooltip（复用已有元素，避免每次重绘泄漏）
    var tooltip = canvas.parentElement.querySelector('.vt-box-tip');
    if (!tooltip) {
      tooltip = document.createElement('div');
      tooltip.className = 'vt-box-tip';
      tooltip.style.cssText = 'position:absolute;background:rgba(0,0,0,0.8);color:#fff;padding:4px 8px;border-radius:4px;font-size:0.75rem;pointer-events:none;display:none;z-index:10;white-space:nowrap';
      canvas.parentElement.appendChild(tooltip);
    }
    var medianXs = [], medianYs = [], medianVals = [];
    canvas.onmousemove = function(e) {
      var rect = canvas.getBoundingClientRect();
      var mx = e.clientX - rect.left, my = e.clientY - rect.top;
      var found = false;
      for (var mi = 0; mi < medianXs.length; mi++) {
        if (mx >= medianXs[mi] - bw/2 && mx <= medianXs[mi] + bw/2 && Math.abs(my - medianYs[mi]) < 15) {
          tooltip.style.display = 'block';
          tooltip.style.left = (medianXs[mi] + 10) + 'px';
          tooltip.style.top = (medianYs[mi] - 20) + 'px';
          tooltip.textContent = 'Median: ' + (Math.abs(medianVals[mi]) < 0.01 ? medianVals[mi].toExponential(2) : medianVals[mi].toFixed(4));
          found = true; break;
        }
      }
      if (!found) tooltip.style.display = 'none';
    };
    canvas.onmouseout = function() { tooltip.style.display = 'none'; };

    const pw = (W - pad.left - pad.right) / boxData.length;
    const bw = Math.min(50, pw * 0.6);

    // 计算Y轴范围（支持手动 Y 值覆盖）
    let yMin = Infinity, yMax = -Infinity;
    boxData.forEach(d => {
      if (d.min < yMin) yMin = d.min;
      if (d.max > yMax) yMax = d.max;
    });
    if (c.yMin != null && !isNaN(+c.yMin)) yMin = +c.yMin;
    if (c.yMax != null && !isNaN(+c.yMax)) yMax = +c.yMax;
    const yRange = yMax - yMin || 1;
    yMin -= yRange * 0.05;
    yMax += yRange * 0.05;

    const yScale = v => pad.top + (H - pad.top - pad.bottom) * (1 - (v - yMin) / (yMax - yMin));

    // Y轴网格
    ctx.strokeStyle = '#e0e0e0';
    ctx.lineWidth = 0.5;
    for (let i = 0; i <= 5; i++) {
      const y = pad.top + (H - pad.top - pad.bottom) * i / 5;
      ctx.beginPath();
      ctx.moveTo(pad.left, y);
      ctx.lineTo(W - pad.right, y);
      ctx.stroke();
      ctx.fillStyle = '#555';
      ctx.font = '10px sans-serif';
      ctx.textAlign = 'right';
      const val = yMax - (yMax - yMin) * i / 5;
      ctx.fillText(val < 0.01 ? val.toExponential(1) : val.toFixed(3), pad.left - 8, y + 4);
    }

    // 批次图例：图上方显示 批号=颜色，点击切换显示/隐藏该批次（动态创建，避免重复）
    var legendId = this.id + '-boxLegend' + i;
    var legendEl = document.getElementById(legendId);
    if (!legendEl) {
      legendEl = document.createElement('div');
      legendEl.id = legendId;
      legendEl.style.cssText = 'position:absolute;top:26px;left:10px;font-size:0.7rem;color:#8899aa;z-index:5;display:flex;gap:10px;flex-wrap:wrap;align-items:center;max-width:80%';
      canvas.parentElement.appendChild(legendEl);
    }
    var batchOf = function(nm) {
      var rec = this.data.find(r => r._Wafer === nm) || this.data.find(r => r._File === nm);
      return rec ? (rec._Batch || rec._Lot || '') : '';
    }.bind(this);
    var batchSet = [];
    names.forEach(function(nm) { var b = batchOf(nm); if (b && batchSet.indexOf(b) < 0) batchSet.push(b); });
    batchSet.sort();
    var batchColors = batchSet.map(function(b, bi) { return FILE_COLORS[bi % FILE_COLORS.length]; });
    if (batchSet.length > 1) {
      legendEl.innerHTML = batchSet.map(function(b, bi) {
        var hidden = c.hideBatches && c.hideBatches[b];
        var color = batchColors[bi];
        return '<span data-bb="' + b + '" title="点击显示/隐藏批次" style="cursor:pointer;display:inline-flex;align-items:center;gap:4px;opacity:' + (hidden ? 0.3 : 1) + ';text-decoration:' + (hidden ? 'line-through' : 'none') + '"><span style="display:inline-block;width:10px;height:10px;background:' + color + ';border-radius:2px"></span>' + b + '</span>';
      }).join('');
      var self3 = this;
      legendEl.querySelectorAll('span[data-bb]').forEach(function(el) {
        el.onclick = function() {
          var b = el.dataset.bb;
          if (!c.hideBatches) c.hideBatches = {};
          c.hideBatches[b] = !c.hideBatches[b];
          self3._drawOneBox(i, c);
        };
      });
    } else {
      legendEl.innerHTML = '';
    }

    // 绘制每个箱线
    boxData.forEach((d, idx) => {
      // 批次隐藏则跳过
      var dBatch = batchOf(d.name);
      if (c.hideBatches && dBatch && c.hideBatches[dBatch]) return;
      const cx = pad.left + pw * idx + pw / 2;
      const yQ1 = yScale(d.q3);
      let yQ3 = yScale(d.q1);
      // iqr=0(大量重复值)时箱体高度为0不可见，强制最小3px
      if (yQ3 - yQ1 < 3) yQ3 = yQ1 - 3;
      const yMed = yScale(d.median);
      const yMinW = yScale(d.min);
      const yMaxW = yScale(d.max);

      // 须线
      ctx.strokeStyle = '#7a8ba0';
      ctx.lineWidth = 1;
      ctx.setLineDash([3, 3]);
      ctx.beginPath();
      ctx.moveTo(cx, yMinW);
      ctx.lineTo(cx, yQ1);
      ctx.moveTo(cx, yQ3);
      ctx.lineTo(cx, yMaxW);
      ctx.stroke();
      ctx.setLineDash([]);

      // 须线横帽
      ctx.strokeStyle = '#7a8ba0';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(cx - bw * 0.3, yMinW);
      ctx.lineTo(cx + bw * 0.3, yMinW);
      ctx.moveTo(cx - bw * 0.3, yMaxW);
      ctx.lineTo(cx + bw * 0.3, yMaxW);
      ctx.stroke();

      // 箱体——分组模式用不同颜色（同批次同色）
      const isGrouped = (groupBy === 'file' || groupBy === 'wafer');
      let boxColor = '#4dabf7';
      if (groupBy === 'file') {
        // 同批次同色
        const fRec = this.data.find(r => r._File === d.name);
        const batch = fRec ? (fRec._Batch || fRec._Lot) : '';
        const batches = [...new Set(this.data.map(r => r._Batch || r._Lot).filter(Boolean))].sort();
        boxColor = FILE_COLORS[batches.indexOf(batch) % FILE_COLORS.length];
      }
      if (groupBy === 'wafer') {
        const wRec = this.data.find(r => r._Wafer === d.name);
        const batch = wRec ? (wRec._Batch || wRec._Lot) : '';
        const batches = [...new Set(this.data.map(r => r._Batch || r._Lot).filter(Boolean))].sort();
        boxColor = FILE_COLORS[batches.indexOf(batch) % FILE_COLORS.length];
      }
      ctx.fillStyle = boxColor.replace(')', ',0.35)').replace('rgb', 'rgba');
      ctx.strokeStyle = boxColor;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.rect(cx - bw / 2, yQ1, bw, yQ3 - yQ1);
      ctx.fill();
      ctx.stroke();

      // 中位线
      medianXs.push(cx); medianYs.push(yMed); medianVals.push(d.median);
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cx - bw / 2, yMed);
      ctx.lineTo(cx + bw / 2, yMed);
      ctx.stroke();

      // 异常点
      if (showOutliers && d.outliers && d.outliers.length) {
        d.outliers.slice(0, 50).forEach(v => {
          const yo = yScale(v);
          ctx.fillStyle = '#e74c3c';
          ctx.beginPath();
          ctx.arc(cx, yo, 3, 0, Math.PI * 2);
          ctx.fill();
        });
      }

      // X轴标签——只显示片号（优先取该箱对应记录的 _Wafer），无片号退回批次/原名
      let lblRec = this.data.find(r => r._Wafer === d.name) || this.data.find(r => r._File === d.name);
      let label = d.name;
      if (lblRec && lblRec._Wafer != null && lblRec._Wafer !== '') label = String(lblRec._Wafer);
      else if (lblRec && lblRec._Batch) label = String(lblRec._Batch);
      ctx.fillStyle = '#555';
      ctx.font = Math.max(7, Math.min(10, pw * 0.3)) + 'px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(label, cx, H - pad.bottom + 20);
    });
  }

  _fiveNum(vals) {
    const n = vals.length;
    const q1 = vals[Math.floor(n * 0.25)];
    const q3 = vals[Math.floor(n * 0.75)];
    const iqr = q3 - q1;
    const lw = Math.max(vals[0], q1 - 1.5 * iqr);
    const uw = Math.min(vals[n - 1], q3 + 1.5 * iqr);
    const out = vals.filter(v => v < q1 - 1.5 * iqr || v > q3 + 1.5 * iqr);
    return { min: lw, q1, median: vals[Math.floor(n * 0.5)], q3, max: uw, outliers: out };
  }

  // ========== 超限分析 ==========
  _renderLimit() {
    this._destroyChart('limitChart');
    if (!ChartJS || !this.paramStats) return;

    const product = this.data[0]?._Product;
    const results = [];

    this.params.forEach(p => {
      const s = this.paramStats[p];
      if (!s) return;
      let spec = null;
      if (product && SPEC_LIMITS[product] && SPEC_LIMITS[product][p]) {
        spec = SPEC_LIMITS[product][p];
      }
      if (!spec) return;

      const total = s.n;
      // 单次遍历统计超限（null边不参与；负值单边USL按幅值下限理解，如IGSS漏电流）
      var loFail = 0, hiFail = 0;
      var specLo = spec[0], specHi = spec[1];
      var hasLo = specLo != null, hasHi = specHi != null;
      var negHiOnly = hasHi && !hasLo && specHi < 0;
      if (total > 0) {
        for (var ri = 0; ri < this.data.length; ri++) {
          var v2 = parseFloat(this.data[ri][p]);
          if (isNaN(v2) || Math.abs(v2) >= 9999) continue; // 跳过哨兵值
          if (hasLo && v2 < specLo) loFail++;
          else if (hasHi) {
            if (negHiOnly ? v2 < specHi : v2 > specHi) hiFail++;
          }
        }
      }
      var cpl = null, cpu = null, cpk = null;
      if (s.std > 0) {
        if (hasLo) cpl = (s.mean - specLo) / (3 * s.std);
        if (hasHi) {
          if (negHiOnly) {
            // 负值单边限：按幅值下界，Cpk=(μ-限值)/3σ
            cpk = (s.mean - specHi) / (3 * s.std);
          } else {
            cpu = (specHi - s.mean) / (3 * s.std);
          }
        }
        if (cpk == null) {
          if (cpl != null && cpu != null) cpk = Math.min(cpl, cpu);
          else cpk = cpl != null ? cpl : cpu;
        }
      }
      results.push({
        param: p,
        total,
        loFail, hiFail,
        loRate: (loFail/total*100),
        hiRate: (hiFail/total*100),
        spec, cpl, cpu,
        cpk: cpk
      });
    });

    if (!results.length) return;

    // 柱状图
    const labels = results.map(r => r.param);
    this.charts.limitChart = new ChartJS(this.$('limitChart').getContext('2d'), {
      type:'bar',
      data:{labels, datasets:[
        {label:'低于 LSL (%)',data:results.map(r=>+r.loRate.toFixed(2)),backgroundColor:'rgba(77,171,247,0.7)',borderColor:'#4dabf7',borderWidth:1},
        {label:'高于 USL (%)',data:results.map(r=>+r.hiRate.toFixed(2)),backgroundColor:'rgba(231,76,60,0.7)',borderColor:'#e74c3c',borderWidth:1}
      ]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#c8d6e5',boxWidth:10}}},scales:{x:{stacked:true,ticks:{color:'#7a8ba0',maxRotation:45},grid:{display:false}},y:{stacked:true,ticks:{color:'#7a8ba0',callback:v=>v+'%'},grid:{color:'#2a3a4a'},title:{display:true,text:'超限占比',color:'#7a8ba0'}}}}
    });

    // 明细表
    this.$('limitTable').innerHTML = `<thead><tr><th>参数</th><th>总数</th><th>低于LSL</th><th>高于USL</th><th>LSL</th><th>USL</th><th>CPL</th><th>CPU</th><th>Cpk</th><th>状态</th></tr></thead><tbody>` +
    results.map(r => {
      const totalFail = r.loFail + r.hiFail;
      const status = totalFail === 0 ? '✅' : (r.cpk && r.cpk >= 1.33 ? '⚠' : '❌');
      const color = totalFail === 0 ? 'var(--vt-good)' : (r.cpk && r.cpk >= 1.0 ? '#f39c12' : 'var(--vt-fail)');
      return `<tr>
        <td>${r.param}</td><td>${r.total}</td>
        <td style="color:#4dabf7">${r.loFail} (${r.loRate.toFixed(2)}%)</td>
        <td style="color:#e74c3c">${r.hiFail} (${r.hiRate.toFixed(2)}%)</td>
        <td>${r.spec[0]!=null?r.spec[0].toExponential(2):'--'}</td><td>${r.spec[1]!=null?r.spec[1].toExponential(2):'--'}</td>
        <td>${r.cpl!==null?r.cpl.toFixed(2):'--'}</td>
        <td>${r.cpu!==null?r.cpu.toFixed(2):'--'}</td>
        <td style="color:${color}">${r.cpk!==null?r.cpk.toFixed(2):'--'}</td>
        <td>${status}</td>
      </tr>`;
    }).join('') + '</tbody>';
  }

  // ========== 晶圆汇总表（Wafer Summary） ==========
  _renderWaferSummary() {
    const wafers = [...new Set(this.data.map(r => r._Wafer).filter(Boolean))].sort();
    const params = this.params;
    const statNames = ['Avg.','Std','Median','RobustStd'];
    if (!wafers.length || !params.length) return;

    // 表头
    let html = '<thead><tr><th>Item</th><th>Spec</th><th>Stat</th>';
    wafers.forEach(w => { html += '<th>' + w + '#</th>'; });
    html += '</tr></thead><tbody>';

    params.forEach(p => {
      // 获取规格限
      const product = this.data[0]?._Product;
      let specStr = '';
      if (product && SPEC_LIMITS[product] && SPEC_LIMITS[product][p]) {
        const [lo, hi] = SPEC_LIMITS[product][p];
        specStr = lo + ' - ' + hi;
      }

      // 计算每个 wafer 的 4 项统计
      const waferStats = wafers.map(w => {
        const vals = this.data.filter(r => r._Wafer === w).map(r => +r[p]).filter(v => !isNaN(v)).sort((a,b) => a-b);
        if (vals.length < 2) return null;
        const n = vals.length;
        const avg = vals.reduce((a,b) => a+b, 0) / n;
        const std = Math.sqrt(vals.reduce((a,b) => a+(b-avg)**2, 0) / (n-1));
        const med = vals[Math.floor(n*0.5)];
        const mad = vals.map(v => Math.abs(v-med)).sort((a,b) => a-b)[Math.floor(n*0.5)];
        return {
          avg: avg, std: std, med: med, robustStd: mad * 1.4826,
          count: n
        };
      });

      // 每参数 4 行
      statNames.forEach(stat => {
        html += '<tr>';
        if (stat === 'Avg.') html += '<td rowspan="4" style="font-weight:600">' + p + '</td><td rowspan="4" style="color:#7a8ba0;font-size:0.75rem">' + specStr + '</td>';
        html += '<td>' + stat + '</td>';
        waferStats.forEach((ws, wi) => {
          if (!ws) { html += '<td>--</td>'; return; }
          let val;
          if (stat === 'Avg.') val = ws.avg;
          else if (stat === 'Std') val = ws.std;
          else if (stat === 'Median') val = ws.med;
          else val = ws.robustStd;
          html += '<td>' + (val < 0.001 ? val.toExponential(3) : val.toFixed(4)) + '</td>';
        });
        html += '</tr>';
      });
    });

    html += '</tbody>';
    this.$('wsumTable').innerHTML = html;

    // 绑定导出
    this.$('btnExportWsum').onclick = () => {
      const table = this.$('wsumTable');
      let csv = '\uFEFF';
      const rows = table.querySelectorAll('tr');
      rows.forEach(row => {
        const cells = row.querySelectorAll('th,td');
        csv += Array.from(cells).map(c => '"' + c.textContent.replace(/"/g,'""') + '"').join(',') + '\n';
      });
      this._downloadCSV(csv, 'VDMOS_晶圆汇总_' + new Date().toISOString().slice(0,10) + '.csv');
    };
  }

  // ========== 数据轨迹（按 Excel BoxPlot 样式：逐点连线） ==========
  _renderTrace() {
    const sel = this.$('traceParam');
    sel.innerHTML = '<option>-- 选参数 --</option>' + this.params.map(p => `<option>${p}</option>`).join('');
    if (this.params.length > 0) sel.value = this.params[0];
    this.$('btnTrace').onclick = () => this._drawTrace();
    setTimeout(() => { loadChartJS().then(() => this._drawTrace()); }, 200);
  }

  _drawTrace() {
    this._destroyChart('traceChart');
    const canvas = this.$('traceChart');
    if (!canvas || !ChartJS || !this.data.length) return;
    const p = this.$('traceParam').value;
    if (!p || p.startsWith('--') || !this.params.includes(p)) return;
    const group = this.$('traceGroup').value;
    const MAX = 2000;
    const sample = (arr, max) => { if (arr.length<=max) return arr; const step=Math.ceil(arr.length/max); const res=[]; for(let j=0;j<arr.length;j+=step)res.push(arr[j]); return res; };

    let datasets = [];
    if (group === 'none') {
      const pts = this.data.map(r => +r[p]).filter(v => !isNaN(v));
      if (pts.length) datasets.push({label:p, data:sample(pts, MAX), borderColor:'#4dabf7', backgroundColor:'rgba(77,171,247,0.1)', pointRadius:0, fill:true, tension:0.4});
    } else if (group === 'file') {
      this.files.forEach((f, fi) => {
        const pts = this.data.filter(r => r._File === f.name).map(r => +r[p]).filter(v => !isNaN(v));
        if (pts.length) datasets.push({label:f.name, data:sample(pts, 500), borderColor:FILE_COLORS[fi%FILE_COLORS.length], pointRadius:0, fill:false, tension:0.4});
      });
    } else if (group === 'wafer') {
      [...new Set(this.data.map(r => r._Wafer).filter(Boolean))].sort().slice(0, 15).forEach((w, wi) => {
        const pts = this.data.filter(r => r._Wafer === w).map(r => +r[p]).filter(v => !isNaN(v));
        if (pts.length) datasets.push({label:'W'+w, data:sample(pts, 500), borderColor:FILE_COLORS[wi%FILE_COLORS.length], pointRadius:0, fill:false, tension:0.4});
      });
    }

    if (!datasets.length) { console.warn('Trace: no data'); return; }

    canvas.style.width = '100%'; canvas.style.height = '400px';
    this.charts.traceChart = new ChartJS(canvas.getContext('2d'), {
      type:'line', data:{datasets},
      options:{responsive:true,maintainAspectRatio:false,animation:false,plugins:{legend:{labels:{color:'#c8d6e5',boxWidth:10,font:{size:9}}}},scales:{x:{title:{display:true,text:'序号',color:'#7a8ba0'},ticks:{color:'#7a8ba0'},grid:{color:'#2a3a4a'}},y:{title:{display:true,text:p,color:'#7a8ba0'},ticks:{color:'#7a8ba0'},grid:{color:'#2a3a4a'}}}}
    });
  }

  // ========== 保存/加载项目数据 ==========
  _saveProject() {
    if (!this.data.length) { alert('没有数据可保存'); return; }
    const project = {
      version: 1,
      date: new Date().toISOString(),
      files: this.files,
      data: this.data,
      headers: this.headers,
      params: this.params,
      binStats: this.binStats,
      yield: this.yield,
      paramStats: this.paramStats,
      customCharts: this.customCharts || [],
      boxConfigs: this.boxConfigs || []
    };
    const json = JSON.stringify(project);
    const blob = new Blob([json], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'VDMOS_项目_' + new Date().toISOString().slice(0,10).replace(/-/g,'') + '.vdmos';
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    // 同时存到 localStorage
    try { localStorage.setItem('vdmos_project', json); } catch(e) {}
  }

  _loadProject() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.vdmos,.json';
    input.onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const text = await this._readFile(file);
      try {
        const project = JSON.parse(text);
        this._restoreProject(project);
      } catch(e) { alert('文件格式不正确'); }
    };
    input.click();
  }

  _autoRestore() {
    if (this.data.length) return; // 已有数据，不恢复
    try {
      const json = localStorage.getItem('vdmos_project');
      if (!json) return;
      const project = JSON.parse(json);
      const age = Date.now() - new Date(project.date).getTime();
      if (age > 7 * 24 * 3600 * 1000) return; // 7天过期
      if (confirm('检测到上次保存的项目数据（' + new Date(project.date).toLocaleString() + '），是否恢复？')) {
        this._restoreProject(project);
      }
    } catch(e) {}
  }

  async _restoreProject(project) {
    this._showProgress('恢复数据...'); await this._delay(30);
    this.data = this._dedupXYRows(project.data);
    this.headers = project.headers;
    this.params = project.params;
    this.binStats = project.binStats;
    this.yield = project.yield;
    this.files = project.files;
    this.paramStats = project.paramStats;
    this.customCharts = project.customCharts || [];
    this.boxConfigs = project.boxConfigs || [];

    this._updateProgress(50, '计算统计...', ''); await this._delay(10);
    this._computeStats(); // 重算以确保一致性
    this._updateProgress(80, '渲染...', ''); await this._delay(10);
    await loadChartJS();
    try { this._renderAll(); } catch(e) { this._renderFallback(); }
    this._renderFileList();
    this._renderCompare();

    this._updateProgress(100, '恢复完成 ✓', ''); await this._delay(200);
    this._hideProgress();
    this.$('results').classList.remove('vt-hide');
  }

  // ========== 失效分析 ==========
  _renderFail() {
    const sel = this.$('failParam');
    sel.innerHTML = '<option>-- 选参数 --</option>' + this.params.map(p => `<option>${p}</option>`).join('');
    if (this.params.length > 0) { sel.value = this.params[0]; this._drawFailDist(); }
    sel.onchange = () => this._drawFailDist();
    this._renderBinCorr();
  }

  _drawFailDist() {
    this._destroyChart('failDistChart');
    if (!ChartJS) return;
    const p = this.$('failParam').value;
    if (p.startsWith('--')) return;

    const passVals = this.data.filter(r => r._Bin === 1).map(r => +r[p]).filter(v => !isNaN(v)).sort((a,b) => a-b);
    const failVals = this.data.filter(r => r._Bin !== 1).map(r => +r[p]).filter(v => !isNaN(v)).sort((a,b) => a-b);
    if (passVals.length < 5 && failVals.length < 5) return;

    const makeHist = (vals, bins) => {
      if (!vals.length) return Array(bins).fill(0);
      const min = vals[0], max = vals[vals.length-1];
      const bw = (max - min) / bins || 1;
      const h = Array(bins).fill(0);
      vals.forEach(v => { const idx = Math.min(bins-1, Math.floor((v-min)/bw)); h[idx]++; });
      return {hist:h, min, max, bw};
    };

    const allVals = [...passVals, ...failVals].sort((a,b) => a-b);
    if (!allVals.length) return;
    const bins = Math.min(25, Math.ceil(Math.sqrt(allVals.length)));
    const passHist = makeHist(passVals, bins);
    const failHist = makeHist(failVals, bins);
    const labels = Array(bins).fill(0).map((_,i) => (allVals[0] + (i+0.5)*(allVals[allVals.length-1]-allVals[0])/bins).toExponential(2));

    this.charts.failDistChart = new ChartJS(this.$('failDistChart').getContext('2d'), {
      type:'bar', data:{labels, datasets:[
        {label:'良品 ('+passVals.length+')', data:passHist.hist, backgroundColor:'rgba(46,204,113,0.5)', borderColor:'#2ecc71', borderWidth:1},
        {label:'坏品 ('+failVals.length+')', data:failHist.hist, backgroundColor:'rgba(231,76,60,0.5)', borderColor:'#e74c3c', borderWidth:1}
      ]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#c8d6e5',boxWidth:10}}},scales:{x:{stacked:false,ticks:{color:'#7a8ba0',maxRotation:45,maxTicksLimit:12},grid:{display:false}},y:{stacked:false,ticks:{color:'#7a8ba0'},grid:{color:'#2a3a4a'},title:{display:true,text:'频数',color:'#7a8ba0'}}}}
    });
  }

  _renderBinCorr() {
    const failBins = [...new Set(this.data.filter(r => r._Bin !== 1).map(r => r._Bin))].sort((a,b) => a-b);
    if (failBins.length < 2) { this.$('failCorrTable').innerHTML = '<tr><td>需要多个失效 BIN 才能分析共现</td></tr>'; return; }

    // 为每个 die 统计其所有失效 BIN
    const dieBins = {};
    this.data.forEach(r => {
      const key = r._Wafer + '_' + (r.Row||r.row||r.X||r.x) + '_' + (r.Col||r.col||r.Y||r.y);
      if (!dieBins[key]) dieBins[key] = new Set();
      if (r._Bin !== 1) dieBins[key].add(r._Bin);
    });

    // BIN 共现矩阵
    const matrix = {};
    failBins.forEach(a => { matrix[a] = {}; failBins.forEach(b => { matrix[a][b] = 0; }); });

    Object.values(dieBins).forEach(bins => {
      if (bins.size < 2) return;
      const arr = [...bins];
      for (let i = 0; i < arr.length; i++) {
        for (let j = i+1; j < arr.length; j++) {
          matrix[arr[i]][arr[j]]++;
          matrix[arr[j]][arr[i]]++;
        }
      }
    });

    let html = '<thead><tr><th>BIN</th>' + failBins.map(b => `<th>BIN ${b}</th>`).join('') + '</tr></thead><tbody>';
    failBins.forEach(a => {
      const bc = BIN_COLORS[a] || BIN_COLORS[999];
      html += `<tr><td style="color:${bc.color};font-weight:600">BIN ${a}</td>`;
      failBins.forEach(b => {
        const v = matrix[a][b];
        const alpha = v > 0 ? Math.min(1, v / 10) : 0;
        html += `<td style="background:rgba(231,76,60,${alpha*0.7});text-align:center">${a===b?'-':v}</td>`;
      });
      html += '</tr>';
    });
    html += '</tbody>';
    this.$('failCorrTable').innerHTML = html;
  }

  // ========== 叠加分析 ==========
  _renderOverlay() {
    if (!this.data.length) return;

    const lots = [...new Set(this.data.map(r => r._Lot).filter(Boolean))].sort();
    const lotSel = this.$('ovLot');

    this._updateOvWafers();

    const ws = this.$('ovWafer');
    ws.onchange = () => this._drawOverlay();

    const wp = this.$('ovParam');
    wp.innerHTML = '<option>-- 选参数 --</option>' + this.params.map(p => `<option>${p}</option>`).join('');
    if (this.params.length > 0) wp.value = this.params[0];

  _onOvLotChange() {
    this._updateOvWafers();
    this._drawOverlay();
  }

  _updateOvWafers() {
    const lot = this.$('ovLot').value;
    const recs = lot === '全部批次' ? this.data : this.data.filter(r => r._Lot === lot);
    const wafers = [...new Set(recs.map(r => r._Wafer).filter(Boolean))].sort();
    const ws = this.$('ovWafer');
    ws.innerHTML = '<option>-- 选圆片 --</option>' + wafers.map(w => `<option>${w}</option>`).join('');
    if (wafers.length > 0) ws.value = wafers[0];
  }

  _drawOverlay() {
    const canvas = this.$('ovCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const wsVal = this.$('ovWafer').value;
    const param = this.$('ovParam').value;
    if (wsVal.startsWith('--') || param.startsWith('--')) { ctx.clearRect(0,0,canvas.width,canvas.height); return; }

    const lotVal = this.$('ovLot') ? this.$('ovLot').value : '全部批次';
    var recsAll = lotVal === '全部批次' ? this.data : this.data.filter(r => r._Lot === lotVal);
    const recs = recsAll.filter(r => r._Wafer === wsVal);
    const getRow = r => parseInt(r.Row) || parseInt(r.row) || parseInt(r.Y) || parseInt(r.y) || parseInt(r.YCoord) || parseInt(r.ycoord) || 0;
    const getCol = r => parseInt(r.Col) || parseInt(r.col) || parseInt(r.X) || parseInt(r.x) || parseInt(r.XCoord) || parseInt(r.xcoord) || 0;
    const rows = [...new Set(recs.map(getRow))].filter(v=>v!==0).sort((a,b)=>a-b);
    const cols = [...new Set(recs.map(getCol))].filter(v=>v!==0).sort((a,b)=>a-b);
    if (!rows.length || !cols.length) { ctx.clearRect(0,0,canvas.width,canvas.height); ctx.fillStyle='#7a8ba0'; ctx.font='14px sans-serif'; ctx.textAlign='center'; ctx.fillText('无坐标数据',canvas.width/2,canvas.height/2); return; }

    const cellW = Math.min(30, Math.floor((canvas.parentElement.clientWidth - 40) / (cols.length + 1)));
    const cellH = cellW;
    canvas.width = (cols.length + 1) * cellW + 20;
    canvas.height = (rows.length + 1) * cellH + 50;
    canvas.style.width = canvas.width + 'px'; canvas.style.height = canvas.height + 'px';
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = '#0f1923'; ctx.fillRect(0,0,canvas.width,canvas.height);

    // 右侧统计表
    var ovTitle = this.$('ovStatTitle');
    var ovBody = this.$('ovStatTable') ? this.$('ovStatTable').querySelector('tbody') : null;
    if (ovTitle && ovBody) {
      ovTitle.textContent = '圆片 ' + wsVal + ' · ' + param;
      var pvals = recs.map(function(r) { return parseFloat(r[param]); }).filter(function(v) { return !isNaN(v); });
      if (pvals.length > 0) {
        var pn = pvals.length, psum = 0;
        for (var pi = 0; pi < pn; pi++) psum += pvals[pi];
        var pavg = psum / pn;
        var psq = 0;
        for (var pi = 0; pi < pn; pi++) { var pd = pvals[pi] - pavg; psq += pd * pd; }
        var pstd = Math.sqrt(psq / (pn - 1));
        var psorted = pvals.slice().sort(function(a, b) { return a - b; });
        var pmed = psorted[Math.floor(pn / 2)];
        var pmads = psorted.map(function(v) { return Math.abs(v - pmed); }).sort(function(a, b) { return a - b; });
        var pstd2 = pmads[Math.floor(pn / 2)] * 1.4826;
        var pfmt = function(v) { return Math.abs(v) < 0.001 ? v.toExponential(3) : v.toFixed(4); };
        ovBody.innerHTML = '<tr><td>' + param + '</td><td>' + pfmt(pavg) + '</td><td>' + pfmt(pstd) + '</td><td>' + pfmt(pmed) + '</td><td>' + pfmt(pstd2) + '</td><td>' + pn + '</td></tr>';
      } else {
        ovBody.innerHTML = '<tr><td colspan="6" style="color:#7a8ba0;text-align:center">无有效数值</td></tr>';
      }
    }

    // 参数颜色范围
    const vals = recs.map(r => +r[param]).filter(v => !isNaN(v)).sort((a,b)=>a-b);
    if (!vals.length) return;
    const vMin = vals[0], vMax = vals[vals.length-1];
    const pColor = (v) => {
      if (isNaN(v)) return '#1a2735';
      const t = vMax > vMin ? (v - vMin) / (vMax - vMin) : 0.5;
      return `rgb(${Math.round(46+t*189)},${Math.round(204-t*120)},${Math.round(180-t*150)})`;
    };

    const grid = {};
    recs.forEach(r => { const row = getRow(r), col = getCol(r); if (!row||!col) return; if (!grid[row]) grid[row] = {}; grid[row][col] = r; });

    rows.forEach((row, ri) => {
      cols.forEach((col, ci) => {
        const r = grid[row] && grid[row][col];
        const x = 10 + ci * cellW, y = 10 + ri * cellH;
        if (!r) { ctx.fillStyle = '#1a2735'; ctx.fillRect(x, y, cellW-1, cellH-1); return; }
        // 底色=参数热力图
        ctx.fillStyle = pColor(+r[param]);
        ctx.fillRect(x, y, cellW-1, cellH-1);
        // 黑色参数值
        ctx.fillStyle = '#000';
        ctx.font = `${Math.max(7, cellW*0.28)}px sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        const pv = +r[param];
        if (!isNaN(pv)) ctx.fillText(pv < 0.001 ? pv.toExponential(1) : pv.toFixed(3), x+cellW/2, y+cellH/2);
        // 坏品叠加红色边框+大字BIN
        if (r._Bin !== 1) {
          ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 2;
          ctx.strokeRect(x+1, y+1, cellW-3, cellH-3);
          ctx.fillStyle = '#fff';
          ctx.font = `bold ${Math.max(9,cellW*0.4)}px sans-serif`;
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(r._Bin, x+cellW/2, y+cellH/2);
        }
      });
    });

    // 图例
    const ly = 10 + rows.length * cellH + 12;
    ctx.fillStyle = '#7a8ba0'; ctx.font = '9px sans-serif';
    ctx.fillText(`${param}: Min=${vMin.toExponential(2)} Max=${vMax.toExponential(2)} | 蓝低→绿高 | 红框=坏品BIN`, 10, ly);
  }

  // ========== 3D 散点图 ==========
  _draw3DScatter(i, c, canvas) {
    const ctx = canvas.getContext('2d');
    const W = canvas.parentElement.clientWidth - 20 || 700;
    const H = 450;
    canvas.width = W * 2; canvas.height = H * 2;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.scale(2, 2);
    ctx.fillStyle = '#0f1923'; ctx.fillRect(0, 0, W, H);

    const zParam = c.zParam || this.params[2] || c.yParam;
    const pts = []; this.data.forEach(r => { const x=+r[c.xParam],y=+r[c.yParam],z=+r[zParam]; if(!isNaN(x)&&!isNaN(y)&&!isNaN(z))pts.push({x,y,z,bin:r._Bin}); });
    if (!pts.length) return;
    const spts = this._sample3D ? this._sample3D(pts, 2000) : pts.slice(0, 2000);

    // 归一化
    const xs = spts.map(p=>p.x), ys = spts.map(p=>p.y), zs = spts.map(p=>p.z);
    const xMin=Math.min(...xs),xMax=Math.max(...xs),yMin=Math.min(...ys),yMax=Math.max(...ys),zMin=Math.min(...zs),zMax=Math.max(...zs);
    const norm = (v,min,max) => (v-min)/(max-min||1)*2-1;

    let angleX = 0.5, angleY = 0.5;
    const proj = (x,y,z) => {
      const cx = Math.cos(angleY)*x - Math.sin(angleY)*z;
      const cz = Math.sin(angleY)*x + Math.cos(angleY)*z;
      const cy = Math.cos(angleX)*y - Math.sin(angleX)*cz;
      return {px: (cx+1)/2*(W-60)+30, py: (1-cy)/2*(H-60)+30, cz};
    };

    const render = () => {
      ctx.fillStyle = '#0f1923'; ctx.fillRect(0, 0, W, H);
      // 排序（z-buffer）
      const sorted = spts.map(p => ({...p, nx:norm(p.x,xMin,xMax), ny:norm(p.y,yMin,yMax), nz:norm(p.z,zMin,zMax)})).map(p => ({...p, ...proj(p.nx,p.ny,p.nz)})).sort((a,b) => b.cz - a.cz);
      sorted.forEach(p => {
        const bc = BIN_COLORS[p.bin] || BIN_COLORS[999];
        ctx.fillStyle = p.bin === 1 ? 'rgba(46,204,113,0.6)' : 'rgba(231,76,60,0.6)';
        ctx.beginPath(); ctx.arc(p.px, p.py, p.bin===1?2:3, 0, Math.PI*2); ctx.fill();
      });
      // 轴标签
      ctx.fillStyle = '#7a8ba0'; ctx.font = '10px sans-serif';
      ctx.fillText(c.xParam, W-10, H/2);
      ctx.fillText(c.yParam, W/2, 20);
      ctx.fillText(zParam, 10, H/2);
    };

    // 鼠标旋转
    let dragging = false, lastX, lastY;
    canvas.onmousedown = e => { dragging=true; lastX=e.offsetX; lastY=e.offsetY; };
    canvas.onmousemove = e => { if(!dragging)return; angleY += (e.offsetX-lastX)*0.005; angleX += (e.offsetY-lastY)*0.005; lastX=e.offsetX; lastY=e.offsetY; render(); };
    canvas.onmouseup = () => { dragging=false; };
    canvas.onmouseleave = () => { dragging=false; };

    render();
  }

  _sample3D(arr, max) { if(arr.length<=max)return arr; const step=Math.ceil(arr.length/max),r=[]; for(let i=0;i<arr.length;i+=step)r.push(arr[Math.min(i+Math.floor(Math.random()*Math.min(step,arr.length-i)),arr.length-1)]); return r; }

  // ========== 良率分析表 ==========
  _renderYieldTable() {
    // 按 (批次, 圆片) 唯一定义每一行
    const groups = [];
    const seen = new Set();
    this.data.forEach(r => {
      const batch = r._Batch || r._Lot || r._File || '';
      const wafer = r._Wafer || '';
      const key = batch + '|' + wafer;
      if (!seen.has(key)) { seen.add(key); groups.push({batch, wafer}); }
    });
    groups.sort((a,b) => {
      const bc = String(a.batch).localeCompare(String(b.batch), 'zh', {numeric:true});
      return bc !== 0 ? bc : String(a.wafer).localeCompare(String(b.wafer), 'zh', {numeric:true});
    });
    if (!groups.length) return;

    const allBins = [...new Set(this.data.map(r => r._Bin))].filter(b => b !== 1).sort((a,b) => a-b).slice(0, 10);

    let html = '<thead><tr><th>Product_Name</th><th>Lot_ID</th><th>Wafer_ID</th><th>Yield</th><th>Total</th><th>Pass</th>';
    allBins.forEach(b => { html += '<th>Bin'+b+'</th>'; });
    html += '</tr></thead><tbody>';

    groups.forEach(({batch, wafer}) => {
      const recs = this.data.filter(r => (r._Batch||r._Lot||r._File||'') === batch && r._Wafer === wafer);
      const total = recs.length;
      const pass = recs.filter(r => r._Bin === 1).length;
      const yieldPct = total > 0 ? (pass/total*100).toFixed(2) : '0';
      const prod = recs[0]?._Product || '';

      html += `<tr>
        <td>${prod}</td><td>${batch}</td><td>${wafer}</td>
        <td>${yieldPct}%</td><td>${total}</td><td>${pass}</td>`;
      allBins.forEach(b => {
        html += `<td>${recs.filter(r => r._Bin === b).length}</td>`;
      });
      html += '</tr>';
    });

    // 汇总行
    const totals = {yieldSum:0, totalSum:0, passSum:0, bins:{}};
    allBins.forEach(b => { totals.bins[b] = 0; });
    groups.forEach(({batch, wafer}) => {
      const recs = this.data.filter(r => (r._Batch||r._Lot||r._File||'') === batch && r._Wafer === wafer);
      totals.totalSum += recs.length;
      totals.passSum += recs.filter(r => r._Bin === 1).length;
      totals.yieldSum += recs.length > 0 ? (recs.filter(r => r._Bin === 1).length / recs.length * 100) : 0;
      allBins.forEach(b => { totals.bins[b] += recs.filter(r => r._Bin === b).length; });
    });
    html += '<tr style="border-top:2px solid #2a3a4a;font-weight:600;background:#1a2735"><td>汇总</td><td></td><td></td>';
    html += '<td>' + (groups.length > 0 ? (totals.yieldSum / groups.length).toFixed(2) : '0') + '%</td>';
    html += '<td>' + totals.totalSum.toLocaleString() + '</td><td>' + totals.passSum.toLocaleString() + '</td>';
    allBins.forEach(b => { html += '<td>' + totals.bins[b].toLocaleString() + '</td>'; });
    html += '</tr>';
    html += '</tbody>';
    this.$('yieldTable').innerHTML = html;
    this.$('btnExportYield').onclick = () => {
      const rows = this.$('yieldTable').querySelectorAll('tr');
      let csv = '\uFEFF';
      rows.forEach(row => { csv += Array.from(row.querySelectorAll('th,td')).map(c=>'"'+c.textContent+'"').join(',')+'\n'; });
      this._downloadCSV(csv, 'VDMOS_良率分析_' + new Date().toISOString().slice(0,10) + '.csv');
    };
  }

  // ========== 分析汇总报告 ==========
  _fmtSci(v) {
    if (v == null || v === '' || isNaN(v)) return '--';
    if (v === 0) return '0';
    const a = Math.abs(v);
    if (a >= 0.001 && a < 10000) return (+v.toFixed(4)).toString();
    return v.toExponential(3);
  }

  _renderReport() {
    const c = this.$('reportContainer');
    if (!c) return;
    if (!this.data.length) { c.innerHTML = '<div style="color:#7a8ba0">请先导入数据</div>'; return; }

    this.$('btnPrintReport').onclick = () => this._printReport();

    // 初始化筛选栏（填充批次/片号/列值，保留已选）+ 绑定按钮
    this._initReportFilter();

    this.$('btnRepReset').onclick = () => { this._resetReportFilter(); this._reportRendered = false; this._renderReport(); };

      const lot = r._Lot || r._File || '--';

      if (lotSel.length && !lotSel.includes(lot)) return false;
      if (waferSel.length && !waferSel.includes(waf)) return false;

    const products = [...new Set(data.map(r => r._Product).filter(Boolean))];
    const lots = [...new Set(data.map(r => r._Lot).filter(Boolean))].sort();
    const wafers = new Set(data.map(r => r._Wafer).filter(Boolean)).size;
    const total = data.length;
    const pass = data.filter(r => r._Bin === 1).length;
    const yieldPct = total ? (pass / total * 100) : 0;

    let H = [];

    H.push('<table class="vt-table" style="font-size:0.8rem"><tbody>');
    H.push('<tr><td style="width:110px;color:#7a8ba0">产品</td><td>' + (products.join('、') || '--') + '</td><td style="width:110px;color:#7a8ba0">测试日期</td><td>' + new Date().toLocaleDateString() + '</td></tr>');
    H.push('<tr><td style="color:#7a8ba0">批次</td><td>' + (lots.join('、') || '--') + '</td><td style="color:#7a8ba0">圆片数</td><td>' + wafers + '</td></tr>');
    H.push('<tr><td style="color:#7a8ba0">测试总数</td><td>' + total.toLocaleString() + '</td><td style="color:#7a8ba0">总良率</td><td style="color:' + yColor + ';font-weight:700">' + yieldPct.toFixed(2) + '%</td></tr>');
    H.push('</tbody></table></div>');

    // 圆片列表（按数字排序；无片号时归为「整体」）

    const waferList = [...waferSet].sort((a, b) => {
      const na = parseFloat(a), nb = parseFloat(b);
      if (!isNaN(na) && !isNaN(nb)) return na - nb;
      return String(a).localeCompare(String(b), 'zh', { numeric: true });
    });
    const fmt = (v) => this._fmtSci(v);

    let idx = 0;

      const s = this.paramStats[p];
      if (!s) return;
      idx++;
      const label = this._labelOf(p);

      const spec = s.spec;
      const lsl = spec && spec[0] != null ? spec[0] : null;
      const usl = spec && spec[1] != null ? spec[1] : null;

      // 按圆片分组取值
      const valsBy = {};
      data.forEach(r => {

        if (isNaN(v) || Math.abs(v) >= 9999) return;
        const w = (r._Wafer != null && r._Wafer !== '') ? String(r._Wafer) : '__ALL__';
        (valsBy[w] = valsBy[w] || []).push(v);
      });

      H.push('<div class="vt-chart" style="margin-bottom:18px;page-break-inside:avoid">');
      H.push('<div style="font-size:0.72rem;color:#7a8ba0;margin-bottom:6px">规格限 LSL ~ USL: ' + fmt(lsl) + ' ~ ' + fmt(usl) + (unit ? ' ' + unit : '') +
        '<span class="rep-tg" data-key="box" style="cursor:pointer;margin-left:12px">箱体</span>' +
        '<span class="rep-tg" data-key="scatter" style="cursor:pointer;margin-left:8px">散点</span>' +

      // 列头（指标 / Median / Range）
      H.push('<div style="display:flex;flex-direction:column;gap:1px">' +
        '<div style="' + thSt + '">指标</div>' +
        '<div style="' + thSt + '">Median</div>' +
        '<div style="' + thSt + '">Range</div></div>');
      waferList.forEach(w => {

          rng = fmt(arr[arr.length - 1] - arr[0]);
