        const label = w === '__ALL__' ? '整体' : w;
        H.push('<div style="display:flex;flex-direction:column;gap:1px">' +
          '<div style="' + thSt + '">' + label + '</div>' +
          '<div style="' + cellSt + '">' + med + '</div>' +
          '<div style="' + cellSt + '">' + rng + '</div></div>');
      });
      H.push('</div>');
      H.push('</div>');
    });

    H.push('<div style="text-align:center;color:#7a8ba0;font-size:0.7rem;margin-top:8px">VDMOS Tool 自动生成 · ' + new Date().toLocaleString() + '</div>');
    c.innerHTML = H.join('');

    // 箱体/散点/外点 显示开关（默认显示；点击加下划线=隐藏对应内容）
    if (!this._repShow) this._repShow = { box: true, scatter: true, outlier: true };
    const self = this;
    const redrawAll = () => {
      let ii = 0;
      paramList.forEach((pp) => {
        if (!self.paramStats[pp]) return;
        ii++;
        self._drawReportBoxScatter(pp, self.id + '-repCanvas' + ii);
      });
    };
    // 记录本次报告实际绘制的参数（供打印前同步重绘，canvas id 序号与 redrawAll 一致）
    self._reportParams = paramList.filter(pp => self.paramStats[pp]);
    const applyTg = (tg) => {
      const on = self._repShow[tg.dataset.key];
      tg.style.borderBottom = on ? 'none' : '3px solid #e74c3c';
      tg.style.color = on ? '#4dabf7' : '#e74c3c';
      tg.style.fontWeight = on ? '600' : '400';
      tg.style.opacity = on ? '1' : '0.7';

  _initReportFilter() {
    const lotList = this.$('repLotList'), waferList = this.$('repWaferList'), paramList = this.$('repParamList');
    if (!lotList || !waferList || !paramList) return;
    const lots = [...new Set(this.data.map(r => r._Lot || r._File || '--'))].sort((a, b) => String(a).localeCompare(String(b), 'zh', { numeric: true }));
    const wafers = [...new Set(this.data.map(r => (r._Wafer != null && r._Wafer !== '') ? String(r._Wafer) : '__ALL__'))].sort((a, b) => {
      const na = parseFloat(a), nb = parseFloat(b);
      if (!isNaN(na) && !isNaN(nb)) return na - nb;
      return String(a).localeCompare(String(b), 'zh', { numeric: true });
    });
    const params = this.params.slice();
    const curLots = new Set([...lotList.querySelectorAll('input:checked')].map(cb => cb.value));
    const curWafers = new Set([...waferList.querySelectorAll('input:checked')].map(cb => cb.value));
    const curParams = new Set([...paramList.querySelectorAll('input:checked')].map(cb => cb.value));
    const firstInit = lotList.children.length === 0;
    const lbl = (v, txt, cur) => '<label style="display:flex;align-items:center;gap:6px;padding:3px 6px;border-radius:4px;cursor:pointer;font-size:0.78rem;white-space:nowrap"><input type="checkbox" value="' + v.replace(/"/g, '&quot;') + '"' + ((firstInit || cur.has(v)) ? ' checked' : '') + ' style="accent-color:var(--vt-accent,#4dabf7)"> ' + txt + '</label>';
    lotList.innerHTML = lots.map(l => lbl(l, l === '--' ? '(无批次)' : l, curLots)).join('');
    waferList.innerHTML = wafers.map(w => lbl(w, w === '__ALL__' ? '(无片号)' : w, curWafers)).join('');
    paramList.innerHTML = params.map(p => lbl(p, p, curParams)).join('');

    const self = this;
    const bind = (btnId, panelId, listId, allId, noneId) => {
      const btn = self.$(btnId), panel = self.$(panelId), list = self.$(listId);
      if (!btn || !panel) return;
      btn.onclick = (e) => { e.stopPropagation(); panel.style.display = panel.style.display === 'none' ? 'block' : 'none'; };
      self.$(allId).onclick = (e) => { e.stopPropagation(); list.querySelectorAll('input[type=checkbox]').forEach(cb => { cb.checked = true; }); self._updateRepFilterCount(); };
      self.$(noneId).onclick = (e) => { e.stopPropagation(); list.querySelectorAll('input[type=checkbox]').forEach(cb => { cb.checked = false; }); self._updateRepFilterCount(); };
    };
    bind('btnRepLotPick', 'repLotPanel', 'repLotList', 'btnRepLotAll', 'btnRepLotNone');
    bind('btnRepWaferPick', 'repWaferPanel', 'repWaferList', 'btnRepWaferAll', 'btnRepWaferNone');
    bind('btnRepParamPick', 'repParamPanel', 'repParamList', 'btnRepParamAll', 'btnRepParamNone');
    document.addEventListener('click', (e) => {
      [['repLotPanel', 'btnRepLotPick'], ['repWaferPanel', 'btnRepWaferPick'], ['repParamPanel', 'btnRepParamPick']].forEach(([pid, bid]) => {
        const p = self.$(pid), b = self.$(bid);
        if (p && p.style.display !== 'none' && !p.contains(e.target) && !b.contains(e.target)) p.style.display = 'none';
      });
    });
    this._updateRepFilterCount();
  }

  _updateRepFilterCount() {
    const cnt = (id) => this.$(id) ? this.$(id).querySelectorAll('input[type=checkbox]').length : 0;
    const sel = (id) => this.$(id) ? this.$(id).querySelectorAll('input:checked').length : 0;
    const upd = (btnId, label, listId) => {
      const b = this.$(btnId);
      if (b) b.textContent = '☑ ' + label + ' (' + (sel(listId) === cnt(listId) ? '全部' : sel(listId)) + ')';
    };
    upd('btnRepLotPick', '批次', 'repLotList');
    upd('btnRepWaferPick', '片号', 'repWaferList');
    upd('btnRepParamPick', '列值', 'repParamList');
  }

  _resetReportFilter() {
    ['repLotList', 'repWaferList', 'repParamList'].forEach(id => {
      const list = this.$(id);
      if (list) list.querySelectorAll('input[type=checkbox]').forEach(cb => { cb.checked = true; });
    });
    if (this.$('repYMin')) this.$('repYMin').value = '';
    if (this.$('repYMax')) this.$('repYMax').value = '';
    this._updateRepFilterCount();
  }

  _drawReportBoxScatter(p, canvasId) {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    const s = this.paramStats[p];
    if (!s) return;
    const spec = s.spec;
    const lsl = spec && spec[0] != null ? spec[0] : null;
    const usl = spec && spec[1] != null ? spec[1] : null;

    const groups = {};
    (this._reportData || this.data).forEach(r => {
      const v = parseFloat(r[p]);
      if (isNaN(v) || Math.abs(v) >= 9999) return;
      const w = (r._Wafer != null && r._Wafer !== '') ? String(r._Wafer) : '__ALL__';
      (groups[w] = groups[w] || []).push(v);
    });
    const wafers = Object.keys(groups).sort((a, b) => {
      const na = parseFloat(a), nb = parseFloat(b);
      if (!isNaN(na) && !isNaN(nb)) return na - nb;
      return String(a).localeCompare(String(b), 'zh', { numeric: true });
    });
    if (!wafers.length) return;

    const stats = wafers.map(w => {
      const vals = groups[w].slice().sort((a, b) => a - b);
      const n = vals.length;
      const q1 = vals[Math.floor(n * 0.25)];
      const median = vals[Math.floor(n * 0.5)];
      const q3 = vals[Math.floor(n * 0.75)];
      const iqr = q3 - q1;
      const lw = Math.max(vals[0], q1 - 1.5 * iqr);
      const uw = Math.min(vals[n - 1], q3 + 1.5 * iqr);
      const outliers = vals.filter(v => v < q1 - 1.5 * iqr || v > q3 + 1.5 * iqr);
      return { w, vals: groups[w], q1, median, q3, lw, uw, outliers };
    });

    let yMin = Infinity, yMax = -Infinity;
    stats.forEach(st => {
      yMin = Math.min(yMin, st.lw, lsl != null ? lsl : Infinity);
      yMax = Math.max(yMax, st.uw, usl != null ? usl : -Infinity);
    });
    if (!isFinite(yMin)) yMin = 0;
    if (!isFinite(yMax)) yMax = yMin + 1;
    const hasUserY = this._reportYMin != null || this._reportYMax != null;
    if (this._reportYMin != null) yMin = this._reportYMin;
    if (this._reportYMax != null) yMax = this._reportYMax;
    if (yMax <= yMin) yMax = yMin + 1;
    if (!hasUserY) {
      const pad2 = (yMax - yMin) * 0.06 || 1;
      yMin -= pad2; yMax += pad2;
    }
    const ySpan = yMax - yMin;

    const containerW = canvas.parentElement ? canvas.parentElement.clientWidth : 700;
    const W = Math.max(300, Math.round(containerW * 0.6) - 24);
    const H = 340;
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
    const pad = { l: 56, t: 30, r: 16, b: 40 };
    // 标题（列值_测试条件1_测试条件2），居中；只对晶圆厂格式(华虹/畅景/华昕/昕致)显示 Bias
    let biasParts = [];
    if (!this._noBias) {
      const biasText = this._getBiasText(p); // 处理 map + vals 两种结构
      biasParts = (biasText || '').split(/\s+/).filter(Boolean);
    }
    const title = p + (biasParts.length ? '_' + biasParts.join('_') : '');
    ctx.fillStyle = '#2f6fed'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(title, W / 2, 20);
    const cw = W - pad.l - pad.r, ch = H - pad.t - pad.b;
    const slot = cw / stats.length;
    const boxW = Math.min(56, slot * 0.5);
    const sx = i => pad.l + slot * (i + 0.5);
    const sy = v => pad.t + (1 - (v - yMin) / ySpan) * ch;
    const fmt = v => this._fmtSci(v);
    const show = this._repShow || { box: true, scatter: true, outlier: true };

    ctx.textAlign = 'right'; ctx.font = '9px sans-serif';
    for (let t = 0; t <= 5; t++) {
      const v = yMin + ySpan * t / 5;
      const y = sy(v);
      ctx.strokeStyle = '#eee'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(W - pad.r, y); ctx.stroke();
      ctx.fillStyle = '#888';
      ctx.fillText(fmt(v), pad.l - 4, y + 3);
    }

    stats.forEach((st, i) => {
      const cx = sx(i);
      if (show.scatter) {
        ctx.fillStyle = 'rgba(77,171,247,0.35)';
        st.vals.forEach((v, k) => {
          const jx = cx + (((k * 37) % 100) / 100 - 0.5) * boxW * 0.9;
          ctx.beginPath(); ctx.arc(jx, sy(v), 1.8, 0, Math.PI * 2); ctx.fill();
        });
      }
      if (show.box) {
        ctx.strokeStyle = '#2f6fed'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(cx, sy(st.uw)); ctx.lineTo(cx, sy(st.q3)); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx, sy(st.lw)); ctx.lineTo(cx, sy(st.q1)); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx - boxW / 4, sy(st.uw)); ctx.lineTo(cx + boxW / 4, sy(st.uw)); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx - boxW / 4, sy(st.lw)); ctx.lineTo(cx + boxW / 4, sy(st.lw)); ctx.stroke();
        let yq1 = sy(st.q1), yq3 = sy(st.q3);
        if (yq3 - yq1 < 3) { const mid = (yq1 + yq3) / 2; yq1 = mid - 1.5; yq3 = mid + 1.5; }
        ctx.fillStyle = 'rgba(77,171,247,0.28)';
        ctx.strokeStyle = '#2f6fed'; ctx.lineWidth = 1.5;
        ctx.fillRect(cx - boxW / 2, yq3, boxW, yq1 - yq3);
        ctx.strokeRect(cx - boxW / 2, yq3, boxW, yq1 - yq3);
        const ym = sy(st.median);
        ctx.strokeStyle = '#e67e22'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(cx - boxW / 2, ym); ctx.lineTo(cx + boxW / 2, ym); ctx.stroke();
      }
      if (show.outlier) {
        ctx.fillStyle = '#e74c3c';
        st.outliers.forEach(v => { ctx.beginPath(); ctx.arc(cx, sy(v), 2.4, 0, Math.PI * 2); ctx.fill(); });
      }
      ctx.fillStyle = '#333'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(st.w === '__ALL__' ? '整体' : 'W' + st.w, cx, H - pad.b + 14);
    });

    const vline = (v, color, label) => {
      if (v == null || v < yMin || v > yMax) return;
      const y = sy(v);
      ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.setLineDash([5, 3]);
      ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(W - pad.r, y); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = color; ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'left';
      ctx.fillText(label, W - pad.r + 2, y + 3);
    };
    vline(usl, '#e74c3c', 'USL');
    vline(lsl, '#e74c3c', 'LSL');
  }

  // 判断 canvas 是否空白（无绘制内容）：空白 canvas 的 PNG dataURL 很短，有内容的明显更长
  _isCanvasBlank(canvas) {
    try {
      return (canvas.toDataURL('image/png').length < 500);
    } catch(e) { return true; } // 取不到数据（异常）按空白处理，触发重绘兜底
  }

  // 打印分析汇总报告：只打印报告内容，隐藏页面其它部分（侧边栏/上传区/图表标签等）
  _printReport() {
    const c = this.$('reportContainer');
    if (!c || !c.innerHTML) return;
    // 1) 注入打印样式：隐藏 body 下除报告克隆外的所有内容（display:none 不占空间，避免空白页）
    let st = document.getElementById('vt-print-style');
    if (!st) {
      st = document.createElement('style');
      st.id = 'vt-print-style';
      document.head.appendChild(st);
    }
    st.textContent = '@media print{' +
      'body>*:not(#vt-print-root){display:none!important}' +
      '#vt-print-root{display:block!important}' +
      '#vt-print-root .vt-chart{page-break-inside:avoid}' +
      '#vt-print-root table{page-break-inside:avoid}' +
      '}';
    // 2) 克隆报告容器到 body 顶层（保持原页面不动），canvas 转图片
    let pr = document.getElementById('vt-print-root');
    if (!pr) {
      pr = document.createElement('div');
      pr.id = 'vt-print-root';
      document.body.appendChild(pr);
    }
    pr.innerHTML = '';
    const clone = c.cloneNode(true);
    // 先浅色化（复用导出报告的配色替换，打印不费墨；img 在之后创建，不受影响）
    let h = clone.innerHTML;
    h = h.replace(/#1a2735/g, '#f7fafc').replace(/#2a3a4a/g, '#e2e8f0').replace(/#7a8ba0/g, '#64748b')
      .replace(/color:var\(--vt-text,[^)]+\)/g, 'color:#1e293b')
      .replace(/#4dabf7/g, '#2f6fed').replace(/#c8d6e5/g, '#334155');
    clone.innerHTML = h;
    // 关键：用「原 canvas」的绘制内容转图片（克隆的 canvas 位图是空白的，toDataURL 会得到空白图）
    const origCanvases = c.querySelectorAll('canvas');
    const cloneCanvases = clone.querySelectorAll('canvas');
    const imgs = [];
    origCanvases.forEach((ocv, i) => {
      try {
        const pp = this._reportParams && this._reportParams[i];
        // 1) 取当前内容（同步绘制后页面图正常 → 此处即为有效图）
        let dataUrl = '';
        try { dataUrl = ocv.toDataURL('image/png'); } catch(e) { dataUrl = ''; }
        // 2) 空白（dataURL 过短）→ 同步重绘后重取（兜底：绘制异常/时序窗口）
        if (dataUrl.length < 500 && pp) {
          try {
            this._drawReportBoxScatter(pp, this.id + '-repCanvas' + (i + 1));
            dataUrl = ocv.toDataURL('image/png');
          } catch(e) {
            console.warn('VDMOS 打印：重绘 ' + pp + ' 失败，图表可能空白', e);
          }
        }
        // 3) 仍空白 → 警告（便于 F12 排查）
        if (!dataUrl || dataUrl.length < 500) {
          console.warn('VDMOS 打印：图表 ' + (pp || ocv.id) + ' 转图异常（空白）', ocv);
        }
        const img = document.createElement('img');
        img.src = dataUrl;
        img.setAttribute('style', ocv.getAttribute('style') || 'width:60%;height:340px');
        imgs.push(img);
        const ccv = cloneCanvases[i];
        if (ccv && ccv.parentNode) ccv.parentNode.replaceChild(img, ccv);
      } catch(e) {
        console.warn('VDMOS 打印：图表转图失败，保留原 canvas', e);
      }
    });
    pr.appendChild(clone);
    // 4) 等待所有图表图片解码完成再打印（首次打印时 img 的 dataURL 可能尚未解码完成，
    //     window.print() 立即捕获快照会显示空白；decode 完成后再打印必有图）
    const ready = Promise.all(imgs.map(img => {
      try { return img.decode ? img.decode() : Promise.resolve(); }
      catch(e) { return Promise.resolve(); }
    })).catch(() => {});
    ready.then(() => {
      window.print();
      if (pr.parentNode) pr.parentNode.removeChild(pr);
      if (st.parentNode) st.parentNode.removeChild(st);
    });
  }

  // ========== PAT 管控 ==========
  _renderPAT() {
    this.$('btnPatRun').onclick = () => this._runPAT();
    this.$('btnExportPAT').onclick = () => {
      const rows = this.$('patTable').querySelectorAll('tr');
      let csv = '\uFEFF';
      rows.forEach(row => { csv += Array.from(row.querySelectorAll('th,td')).map(c=>'"'+c.textContent+'"').join(',')+'\n'; });
      this._downloadCSV(csv, 'PAT管控_' + new Date().toISOString().slice(0,10) + '.csv');
    };
    this._runPAT();
  }

  _runPAT() {
    const k = parseFloat(this.$('patSigma').value) || 5;
    if (!this.params.length) { this.$('patTable').innerHTML = '<tr><td>无数据</td></tr>'; return; }

    // PAT = Median ± k * (IQR / 1.35)  (IQR→pseudo-sigma)
    const results = [];
    this.params.forEach(p => {
      const vals = this.data.map(r => +r[p]).filter(v => !isNaN(v)).sort((a,b) => a-b);
      if (vals.length < 10) return;
      const n = vals.length;
      const med = vals[Math.floor(n * 0.5)];
      const q1 = vals[Math.floor(n * 0.25)];
      const q3 = vals[Math.floor(n * 0.75)];
      const iqr = Math.max(0.0001, q3 - q1);
      const sigma = iqr / 1.349; // 伪sigma
      const loPAT = med - k * sigma;
      const hiPAT = med + k * sigma;

      const outliers = this.data.filter(r => {
        const v = +r[p];
        return !isNaN(v) && (v < loPAT || v > hiPAT);
      });

      if (outliers.length > 0) {
        results.push({
          param: p,
          median: med, sigma, loPAT, hiPAT,
          outliers: outliers.length,
          pct: (outliers.length / this.data.length * 100).toFixed(2),
          maxDev: Math.max(...outliers.map(r => Math.abs((+r[p] - med) / sigma)))
        });
      }
    });

    results.sort((a,b) => b.outliers - a.outliers);

    let html = '<thead><tr><th>参数</th><th>中位值</th><th>伪σ</th><th>PAT下限</th><th>PAT上限</th><th>异常数</th><th>占比%</th><th>最大偏差σ</th></tr></thead><tbody>';
    if (results.length === 0) {
      html += '<tr><td colspan="8">所有参数在PAT管控范围内</td></tr>';
    } else {
      results.forEach(r => {
        html += `<tr>
          <td>${r.param}</td>
          <td>${Math.abs(r.median)<0.01?r.median.toExponential(2):r.median.toFixed(4)}</td>
          <td>${Math.abs(r.sigma)<0.01?r.sigma.toExponential(2):r.sigma.toFixed(4)}</td>
          <td>${Math.abs(r.loPAT)<0.01?r.loPAT.toExponential(2):r.loPAT.toFixed(4)}</td>
          <td>${Math.abs(r.hiPAT)<0.01?r.hiPAT.toExponential(2):r.hiPAT.toFixed(4)}</td>
          <td style="color:#e74c3c;font-weight:600">${r.outliers}</td>
          <td>${r.pct}%</td>
          <td>${r.maxDev.toFixed(2)}σ</td>
        </tr>`;
      });
    }
    html += '</tbody>';
    this.$('patTable').innerHTML = html;
  }

  // ========== 边际裕度分析 ==========
  _renderMargin() {
    this.$('btnMarginRun').onclick = () => this._runMargin();
    this.$('btnExportMargin').onclick = () => {
      const rows = this.$('marginTable').querySelectorAll('tr');
      let csv = '\uFEFF';
      rows.forEach(row => { csv += Array.from(row.querySelectorAll('th,td')).map(c=>'"'+c.textContent+'"').join(',')+'\n'; });
      this._downloadCSV(csv, '裕度分析_' + new Date().toISOString().slice(0,10) + '.csv');
    };
    this._runMargin();
  }

  _runMargin() {
    const threshold = parseFloat(this.$('marginSigma').value) || 3;
    this._destroyChart('marginChart');
    if (!this.params.length) return;

    // 找SPEC + 显示SPEC表
    let specs = SPEC_LIMITS[this.data[0]?._Product] || {};
    let altSpecs = {};
    for (const k in SPEC_LIMITS) { Object.assign(altSpecs, SPEC_LIMITS[k]); }
    if (!Object.keys(specs).length) specs = altSpecs;
    if (!Object.keys(specs).length) {
      for (const k in SPEC_LIMITS) { if (Object.keys(SPEC_LIMITS[k]).length > 0) { specs = SPEC_LIMITS[k]; break; } }
    }
    if (!Object.keys(specs).length) {
      this.files.forEach(f => { if (SPEC_LIMITS[f.name]) Object.assign(specs, SPEC_LIMITS[f.name]); });
    }

    // SPEC 表：显示SPEC内容辅助排查
    const specKeys = Object.keys(specs);
    let specHtml = '<details style="margin:8px 0"><summary style="cursor:pointer;color:#4dabf7;font-size:0.8rem">📋 SPEC数据 (共 '+specKeys.length+' 个参数有规格)</summary>';
    if (specKeys.length) {
      specHtml += '<table class="vt-table" style="font-size:0.7rem;margin-top:4px"><tr><th>参数</th><th>Min</th><th>Max</th></tr>';
      specKeys.sort().slice(0, 20).forEach(k => {
        specHtml += `<tr><td>${k}</td><td>${specs[k][0]!=null?specs[k][0]:'-'}</td><td>${specs[k][1]!=null?specs[k][1]:'-'}</td></tr>`;
      });
      if (specKeys.length > 20) specHtml += '<tr><td colspan="3">... 还有 '+(specKeys.length-20)+' 个参数</td></tr>';
      specHtml += '</table>';
    } else {
      specHtml += '<div style="font-size:0.7rem;color:#e74c3c">SPEC_LIMITS 为空！产品='+this.data[0]?._Product+' 所有key='+Object.keys(SPEC_LIMITS).join(',')+'</div>';
    }
    specHtml += '</details>';
    this.$('marginSpec').innerHTML = specKeys.length
      ? '<span style="color:#2ecc71;font-size:0.75rem">📋 已读取 '+specKeys.length+' 个参数SPEC</span>'
      : '<span style="color:#e74c3c;font-size:0.75rem">⚠ SPEC为空</span>';

    const results = [];
    this.params.forEach(p => {
      const vals = this.data.map(r => +r[p]).filter(v => !isNaN(v));
      if (vals.length < 10) return;
      const n = vals.length;
      const mean = vals.reduce((a,b)=>a+b,0)/n;
      const std = Math.sqrt(vals.reduce((a,b)=>a+(b-mean)**2,0)/(n-1));
      const [lo, hi] = specs[p] || [null, null];

      if (std > 0) {
        const marginLSL = lo != null ? (mean - lo) / std : NaN;
        const marginUSL = hi != null ? (hi - mean) / std : NaN;
        const sides = [marginLSL, marginUSL].filter(v => isFinite(v));
        if (!sides.length && !specs[p]) return;
        const worstMargin = sides.length ? Math.min(...sides) : Infinity;
        const lowCount = vals.filter(v => {
          const mL = (v - lo) / std;
          const mU = (hi - v) / std;
          return Math.min(mL, mU) < threshold;
        }).length;
        results.push({
          param: p, mean, std, lo, hi, marginLSL, marginUSL, worstMargin,
          lowCount, lowPct: (lowCount/n*100).toFixed(1)
        });
      }
    });

    results.sort((a,b) => a.worstMargin - b.worstMargin);

    // 表格
    let html = '<thead><tr><th>参数</th><th>均值</th><th>σ</th><th>LSL</th><th>USL</th><th>裕度(LSL)</th><th>裕度(USL)</th><th>最差裕度σ</th><th>低裕度(&lt;'+threshold+'σ)</th><th>占比%</th></tr></thead><tbody>';
    results.forEach(r => {
      const color = r.worstMargin < threshold ? '#e74c3c' : r.worstMargin < threshold*2 ? '#f39c12' : '#7a8ba0';
      html += `<tr>
        <td>${r.param}</td><td>${r.mean.toFixed(4)}</td><td>${r.std.toExponential(2)}</td>
        <td>${r.lo!=null?r.lo.toFixed(4):'-'}</td><td>${r.hi!=null?r.hi.toFixed(4):'-'}</td>
        <td>${isFinite(r.marginLSL)?r.marginLSL.toFixed(2)+'σ':'-'}</td><td>${isFinite(r.marginUSL)?r.marginUSL.toFixed(2)+'σ':'-'}</td>
        <td style="color:${color};font-weight:600">${r.worstMargin.toFixed(2)}σ</td>
        <td>${r.lowCount}</td><td>${r.lowPct}%</td>
      </tr>`;
    });
    html += '</tbody>';
    this.$('marginTable').innerHTML = html;

    // 条形图：最差裕度
    if (ChartJS && results.length) {
      const top20 = results.slice(0, 20);
      this.charts.marginChart = new ChartJS(this.$('marginChart').getContext('2d'), {
        type:'bar', data:{labels:top20.map(r=>r.param),datasets:[{label:'最差裕度 (σ)',data:top20.map(r=>r.worstMargin),backgroundColor:top20.map(r=>r.worstMargin<threshold?'rgba(231,76,60,0.6)':r.worstMargin<threshold*2?'rgba(243,156,18,0.6)':'rgba(77,171,247,0.5)'),borderWidth:0}]},
        options:{indexAxis:'y',responsive:true,maintainAspectRatio:true,plugins:{legend:{display:false}},scales:{x:{title:{display:true,text:'裕度 (σ)',color:'#8899aa'},ticks:{color:'#8899aa'},grid:{color:'rgba(255,255,255,0.04)'}},y:{ticks:{color:'#8899aa',font:{size:9}},grid:{display:false}}}}
      });
    }
  }

  // ========== SPC 控制图 ==========
  _renderSPC() {
    const sel = this.$('spcParam');
    sel.innerHTML = '<option>-- 选参数 --</option>' + this.params.map(p => `<option>${p}</option>`).join('');
    const ws = this.$('spcWafer');
    const wafers = [...new Set(this.data.map(r => r._Wafer).filter(Boolean))].sort((a,b) => String(a).localeCompare(String(b),'zh',{numeric:true}));
    ws.innerHTML = '<option value="">全部圆片</option>' + wafers.map(w => `<option>${w}</option>`).join('');
    if (this.params.length) sel.value = this.params[0];
    this._drawSPC();
  }

  _drawSPC() {
    if (!this.data.length) return;
    const p = this.$('spcParam').value;
    const wf = this.$('spcWafer').value;
    if (p.startsWith('--')) return;

    const showLine = this.$('spcShowLine').checked;
    const showLimits = this.$('spcShowLimits').checked;
    const showMR = this.$('spcShowMR').checked;

    // 按圆片分组，用不同颜色
    var waferData = [];
    if (wf) {
      var rcs = this.data.filter(function(r) { return r._Wafer === wf; });
      var vs = rcs.map(function(r) { return +r[p]; }).filter(function(v) { return !isNaN(v); });
      if (vs.length < 5) return;
      waferData.push({name: wf, vals: vs, color: '#4dabf7'});
    } else {
      var waferNames = [...new Set(this.data.map(function(r) { return r._Wafer; }).filter(Boolean))].sort();
      var colors = ['#4dabf7','#e74c3c','#2ecc71','#f39c12','#9b59b6','#1abc9c','#e67e22','#3498db','#e91e63','#00bcd4'];
      for (var wi = 0; wi < waferNames.length && wi < 10; wi++) {
        var w = waferNames[wi];
        var rcs = this.data.filter(function(r) { return r._Wafer === w; });
        var vs = rcs.map(function(r) { return +r[p]; }).filter(function(v) { return !isNaN(v); });
        if (vs.length >= 3) waferData.push({name: w, vals: vs, color: colors[wi % colors.length]});
      }
      if (waferData.length === 0) return;
    }

    // 合并所有批次的值计算控制限
    var recs = wf ? this.data.filter(function(r) { return r._Wafer === wf; }) : this.data;
    var vals = recs.map(function(r) { return +r[p]; }).filter(function(v) { return !isNaN(v); });
    if (vals.length < 5) return;

    const n = vals.length;
    const mean = vals.reduce((a,b)=>a+b,0)/n;
    const std = Math.sqrt(vals.reduce((a,b)=>a+(b-mean)**2,0)/(n-1));
    const mr = [];
    for (let i=1;i<n;i++) mr.push(Math.abs(vals[i]-vals[i-1]));
    const mrMean = mr.reduce((a,b)=>a+b,0)/mr.length;

    const UCL = mean + 2.66 * mrMean;
    const LCL = mean - 2.66 * mrMean;
    const outOfCtrl = vals.filter(v => v > UCL || v < LCL);

    // 统计信息
    this.$('spcStats').innerHTML = `<b>${p}</b> | N=${n} | Mean=${mean.toFixed(4)} | σ=${std.toExponential(2)} | UCL=${UCL.toFixed(4)} | LCL=${LCL.toFixed(4)} | 失控=${outOfCtrl.length} | ${p.startsWith('--')?'':'参数值: '+vals.slice(0,10).map(v=>v.toFixed(4)).join(', ')+'…'}`;

    const canvas = this.$('spcChartI');
    const W = window.innerWidth - 220; // 减去左侧栏宽度
    const H = showMR ? (window.innerHeight - 200) : (window.innerHeight - 300);
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,W,H);

    // 颜色图例
    ctx.font = '12px sans-serif';
    var lx = 15;
    for (var ci = 0; ci < waferData.length && ci < 6; ci++) {
      ctx.fillStyle = waferData[ci].color; ctx.fillRect(lx, 12, 12, 12);
      ctx.fillStyle = '#555'; ctx.fillText(waferData[ci].name, lx + 16, 23);
      lx += ctx.measureText(waferData[ci].name).width + 25;
    }
    lx += 10;
    ctx.fillStyle = '#e74c3c'; ctx.fillRect(lx, 12, 12, 12);
    ctx.fillStyle = '#555'; ctx.fillText('失控点', lx + 16, 24);
    lx += ctx.measureText('失控点').width + 35;
    ctx.setLineDash([6,3]); ctx.lineWidth=2; ctx.strokeStyle='#e74c3c';
    ctx.beginPath(); ctx.moveTo(lx, 19); ctx.lineTo(lx + 50, 19); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = '#555'; ctx.fillText('UCL/LCL', lx + 56, 24);

    // Chart area
    const mrY = showMR ? 200 : 0;
    const pad = {l:100,t:50,r:50,b:80};
    const chartH = H-pad.t-pad.b-mrY;
    const xScale = i => pad.l + (i/(n-1)) * ((W-pad.l-pad.r));
    const yMinInput = parseFloat(this.$('spcYMin').value);
    const yMaxInput = parseFloat(this.$('spcYMax').value);
    const yMin = !isNaN(yMinInput) ? yMinInput : (Math.min(LCL, ...vals) * 0.95);
    const yMax = !isNaN(yMaxInput) ? yMaxInput : (Math.max(UCL, ...vals) * 1.05);
    const yScale = v => pad.t + (1 - (v-yMin)/(yMax-yMin)) * chartH;

    // Grid
    ctx.strokeStyle = '#999'; ctx.lineWidth = 0.8;
    for (let i=0;i<=5;i++) { const y=pad.t+chartH*i/5; ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(W-pad.r,y); ctx.stroke(); }

    // Control limits
    if (showLimits) {
      ctx.setLineDash([6,3]); ctx.lineWidth=2;
      ctx.strokeStyle='#e74c3c';
      [UCL, mean, LCL].forEach(v => { const y=yScale(v); ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(W-pad.r,y); ctx.stroke(); });
      ctx.setLineDash([]);
      ctx.fillStyle='#e74c3c'; ctx.font='bold 10px sans-serif';
      ctx.fillText('UCL='+UCL.toFixed(4), W-pad.r-80, yScale(UCL)-3);
      ctx.fillStyle='#4dabf7';
      ctx.fillText('Mean='+mean.toFixed(4), W-pad.r-80, yScale(mean)-3);
      ctx.fillText('LCL='+LCL.toFixed(4), W-pad.r-80, yScale(LCL)-3);
    }

    // Dots always shown
    // Draw per wafer with different colors
    var globalIdx = 0;
    waferData.forEach(function(wd) {
      var vv = wd.vals;
      for (var k = 0; k < vv.length; k++) {
        var v = vv[k], idx = globalIdx + k;
        var isOut = v > UCL || v < LCL;
        ctx.fillStyle = isOut ? '#e74c3c' : wd.color;
        ctx.beginPath(); ctx.arc(xScale(idx), yScale(v), 4, 0, Math.PI * 2); ctx.fill();
      }
      // Line per wafer
      if (showLine && vv.length > 1) {
        ctx.strokeStyle = wd.color; ctx.lineWidth = 1.2;
        ctx.beginPath();
        for (var k = 0; k < vv.length; k++) {
          var x = xScale(globalIdx + k), y = yScale(vv[k]);
          k === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
      globalIdx += vv.length;
    });

    // Moving Range
    if (showMR && mr.length) {
      const mrT = pad.t + chartH + 30;
      const mrMax = Math.max(...mr) * 1.2;
      const mrScale = v => mrT + (1 - v/mrMax) * mrY;
      const mrUCL = 3.267 * mrMean;
      ctx.fillStyle='#555'; ctx.font='11px sans-serif';
      ctx.fillText('Moving Range', pad.l, mrT-5);
      mr.forEach((v,i)=>{
        ctx.fillStyle=v>mrUCL?'#e74c3c':'#f39c12';
        const x = xScale(i+0.5), y = mrScale(v);
        ctx.fillRect(x-1.5, y, 3, mrT+mrY-y);
      });
      ctx.setLineDash([4,3]); ctx.strokeStyle='rgba(231,76,60,0.5)'; ctx.lineWidth=1;
      const yU = mrScale(mrUCL);
      ctx.beginPath(); ctx.moveTo(pad.l,yU); ctx.lineTo(W-pad.r,yU); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle='#e74c3c'; ctx.font='8px sans-serif';
      ctx.fillText('MR-UCL='+mrUCL.toFixed(4), W-pad.r-70, yU-3);
    }

    // Y-axis ticks
    ctx.fillStyle='#000'; ctx.font='bold 11px sans-serif'; ctx.textAlign='right';
    for (let i=0;i<=5;i++) {
      const v = yMin + (yMax-yMin)*i/5;
      ctx.fillText(v.toFixed(3), pad.l-6, pad.t+chartH*(1-i/5)+5);
    }
  }

  // ========== 正态分布 ==========
  _renderNormal() {
    var self = this;
    this.$('btnDrawNormal').onclick = function() { self._drawAllNormal(); };
  }

  _drawAllNormal() {
    var container = this.$('normalCharts');
    container.innerHTML = '';
    var self = this;
    this.params.forEach(function(p, i) {
      var div = document.createElement('div'); div.className = 'vt-chart';
      div.innerHTML = '<h3>' + p + ' 正态分布</h3><div id="' + self.id + '-normLegend' + i + '" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px;font-size:0.7rem;color:var(--vt-muted,#7a8ba0);cursor:pointer"></div><canvas id="' + self.id + '-normCanvas' + i + '"></canvas>';
      container.appendChild(div);
    });
    setTimeout(function() {
      self.params.forEach(function(p, i) { self._drawOneNormal(i, p); });
    }, 50);
  }

  _drawOneNormal(i, p) {
    var product = this.data[0] && this.data[0]._Product ? this.data[0]._Product : '';
    var spec = null;
    if (product && SPEC_LIMITS[product] && SPEC_LIMITS[product][p]) spec = SPEC_LIMITS[product][p];
    var specLo = spec ? spec[0] : null, specHi = spec ? spec[1] : null;

    // 1. 数据预处理：IQR剔除异常值
    var rawVals = this.data.map(function(r) { return +r[p]; }).filter(function(v) { return !isNaN(v); });
    var rn = rawVals.length;
    if (rn < 10) return;
    var rq1 = rawVals.slice().sort(function(a,b){ return a-b; });
    var q1 = rq1[Math.floor(rn*0.25)], q3 = rq1[Math.floor(rn*0.75)], iqr = q3 - q1;
    var lw2 = q1 - 1.5*iqr, uw2 = q3 + 1.5*iqr;
    var vals = rawVals.filter(function(v) { return v >= lw2 && v <= uw2; });
    var removed = rawVals.length - vals.length;
    var n = vals.length;
    if (n < 10) return;
    var mean = vals.reduce(function(a, b) { return a + b; }, 0) / n;
    var std = Math.sqrt(vals.reduce(function(a, b) { return a + Math.pow(b - mean, 2); }, 0) / (n - 1));
    var sorted = vals.slice().sort(function(a, b) { return a - b; });

    // 2. 范围扩展：覆盖规格限与μ±3σ
    var xMin = Math.min(sorted[0], specLo != null ? specLo : Infinity, mean - 3*std);
    var xMax = Math.max(sorted[n-1], specHi != null ? specHi : -Infinity, mean + 3*std);
    if (xMax <= xMin) { xMax = xMin + 1; }

    var canvas = this.$('normCanvas' + i);
    if (!canvas) return;
    var W = Math.max(500, canvas.parentElement.clientWidth - 20), H = 320;
    canvas.width = W; canvas.height = H;
    canvas.style.width = '100%'; canvas.style.maxWidth = W + 'px'; canvas.style.height = H + 'px';
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);

    var pad = { l: 55, t: 20, r: 175, b: 40 };
    var chartW = W - pad.l - pad.r, chartH = H - pad.t - pad.b;

    var bins = Math.min(40, Math.ceil(Math.sqrt(n)));
    var bw = (xMax - xMin) / bins;
    var hist = new Array(bins).fill(0);
    vals.forEach(function(v) { var idx = Math.min(bins - 1, Math.max(0, Math.floor((v - xMin) / bw))); hist[idx]++; });
    var maxH = Math.max.apply(null, hist);

    function sx(v) { return pad.l + (v - xMin) / (xMax - xMin) * chartW; }
    function sy(v) { return pad.t + (1 - v / maxH) * chartH; }

    // 参考线（全高），每图可点击图例控制显隐
    this._normHid = this._normHid || {};
    if (!this._normHid[p]) this._normHid[p] = {};
    var hid = this._normHid[p];
    function vline(v, color, label, dash, key) {
      if (hid[key]) return;
      if (v < xMin || v > xMax) return;
      var x = sx(v);
      ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.setLineDash(dash);
      ctx.beginPath(); ctx.moveTo(x, pad.t); ctx.lineTo(x, H - pad.b); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = color; ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(label, x, pad.t - 3);
    }
    // 图例栏
    var lg = this.$('normLegend' + i);
    if (lg) {
      var selfN = this;
      var items = [
        {k: 'spec', color: '#e74c3c', label: 'LSL/USL'},
        {k: 't', color: '#2ecc71', label: 'T'},
        {k: 'mean', color: '#f1c40f', label: 'μ'},
        {k: 'six', color: '#9b59b6', label: 'μ±3σ'}
      ];
      lg.innerHTML = items.map(function(it) {
        var on = !hid[it.k];
        return `<span data-vk="${it.k}" style="display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:10px;border:1px solid ${on ? it.color : 'transparent'};opacity:${on ? 1 : 0.35};background:${on ? it.color + '22' : 'transparent'}" title="点击显示/隐藏"><span style="display:inline-block;width:14px;height:2px;background:${it.color};vertical-align:middle"></span>${it.label}</span>`;
      }).join('');
      lg.querySelectorAll('span[data-vk]').forEach(function(el) {
        el.onclick = function() {
          var k = el.dataset.vk;
          hid[k] = !hid[k];
          selfN._drawOneNormal(i, p);
        };
      });
    }

    // Histogram with value labels
    hist.forEach(function(h, j) {
      var x = sx(sorted[0] + j * bw), w = Math.max(1, sx(sorted[0] + (j + 1) * bw) - x);
      ctx.fillStyle = '#4dabf7'; ctx.fillRect(x, sy(h), w, chartH - sy(h) + pad.t);
      if (h > 0 && w > 15) {
        ctx.fillStyle = '#333'; ctx.font = 'bold 8px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(String(h), x + w/2, sy(h) - 2);
      }
    });

    // 参考线：LSL/USL(红) T(绿) μ(黄) μ±3σ(紫)
    if (specLo != null) vline(specLo, '#e74c3c', 'LSL=' + specLo.toFixed(4), [4, 3], 'spec');
    if (specHi != null) vline(specHi, '#e74c3c', 'USL=' + specHi.toFixed(4), [4, 3], 'spec');
    if (specLo != null && specHi != null) vline((specLo + specHi) / 2, '#2ecc71', 'T', [2, 2], 't');
    vline(mean, '#f1c40f', 'μ', [6, 3], 'mean');
    vline(mean - 3 * std, '#9b59b6', 'μ-3σ', [2, 4], 'six');
    vline(mean + 3 * std, '#9b59b6', 'μ+3σ', [2, 4], 'six');

    // Normal fit curve
    var pdf = function(x) { return n * bw * Math.exp(-0.5 * Math.pow((x - mean) / std, 2)) / (std * Math.sqrt(2 * Math.PI)); };
    ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 2.5;
    ctx.beginPath();
    for (var j = 0; j <= 200; j++) {
      var x = xMin + (xMax - xMin) * j / 200;
      var y = pdf(x);
      j === 0 ? ctx.moveTo(sx(x), sy(y)) : ctx.lineTo(sx(x), sy(y));
    }
    ctx.stroke();

    // X-axis ticks
    var xTicks = 5;
    ctx.fillStyle = '#333'; ctx.font = '9px sans-serif'; ctx.textAlign = 'center';
    for (var t = 0; t <= xTicks; t++) {
      var xv = xMin + (xMax - xMin) * t / xTicks;
      var tx = pad.l + chartW * t / xTicks;
      ctx.fillText(xv.toFixed(2), tx, H - pad.b + 14);
      ctx.strokeStyle = '#e8e8e8'; ctx.lineWidth = 0.5;
      ctx.beginPath(); ctx.moveTo(tx, pad.t); ctx.lineTo(tx, H - pad.b); ctx.stroke();
    }
    // Y-axis ticks
    ctx.fillStyle = '#888'; ctx.font = '9px sans-serif'; ctx.textAlign = 'right';
    for (var t = 0; t <= 4; t++) {
      var yv = Math.round(maxH * t / 4);
      var ty = pad.t + chartH * (1 - t / 4);
      ctx.fillText(String(yv), pad.l - 4, ty + 4);
    }

    // Statistics box (right side)
    var vMin = sorted[0], vMax = sorted[n - 1];
    var sk = vals.reduce(function(s, v) { return s + Math.pow((v - mean) / std, 3); }, 0) / n;
    var kt = vals.reduce(function(s, v) { return s + Math.pow((v - mean) / std, 4); }, 0) / n - 3;

    // Right-side stats panel
    var rx = W - 170, ry = pad.t + 5;
    ctx.fillStyle = '#333'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'left';
    ctx.fillText('统计量', rx, ry); ry += 18;
    var stats = [
      ['样本量 N', String(n)],
      ['平均值 μ', mean.toFixed(4)],
      ['标准差 σ', std.toExponential(2)],
      ['最大值 MAX', vMax.toFixed(4)],
      ['最小值 MIN', vMin.toFixed(4)],
      ['偏度 Skew', sk.toFixed(3)],
      ['峰度 Kurt', kt.toFixed(3)]
    ];
    stats.forEach(function(s) {
      ctx.fillStyle = '#555'; ctx.font = '10px sans-serif';
      ctx.fillText(s[0], rx, ry);
      ctx.fillStyle = '#000'; ctx.font = 'bold 10px sans-serif';
      ctx.fillText(s[1], rx + 90, ry);
      ry += 14;
    });

    // 规格限 + 过程能力判定
    var spec = (product && SPEC_LIMITS[product] && SPEC_LIMITS[product][p]) ? SPEC_LIMITS[product][p] : null;
    if (spec) {
      ry += 5;
      ctx.fillStyle = '#333'; ctx.font = 'bold 11px sans-serif';
      ctx.fillText('规格限', rx, ry); ry += 18;
      ctx.fillStyle = '#e74c3c'; ctx.font = '10px sans-serif';
      ctx.fillText('USL', rx, ry);
      ctx.fillStyle = '#000'; ctx.font = 'bold 10px sans-serif';
      ctx.fillText(spec[1] != null ? spec[1].toFixed(4) : '--', rx + 90, ry);
      ry += 14;
      ctx.fillStyle = '#e74c3c'; ctx.font = '10px sans-serif';
      ctx.fillText('LSL', rx, ry);
      ctx.fillStyle = '#000'; ctx.font = 'bold 10px sans-serif';
      ctx.fillText(spec[0] != null ? spec[0].toFixed(4) : '--', rx + 90, ry);
      ry += 14;

      // 量化指标：偏移/离散/综合
      var range = (spec[0] != null && spec[1] != null) ? spec[1] - spec[0] : null;
      var T = (spec[0] != null && spec[1] != null) ? (spec[0] + spec[1]) / 2 : null;
      var offPct = (range > 0 && T != null) ? Math.abs(mean - T) / range * 100 : null;
      var cp = (range > 0 && std > 0) ? range / (6 * std) : null;
      var cpk = (spec[0] != null && spec[1] != null && std > 0) ? Math.min((spec[1] - mean) / (3 * std), (mean - spec[0]) / (3 * std)) : null;
      ry += 5;
      ctx.fillStyle = '#333'; ctx.font = 'bold 11px sans-serif';
      ctx.fillText('过程能力', rx, ry); ry += 18;
      if (offPct != null) {
        var offOk = offPct <= 15;
        ctx.fillStyle = offOk ? '#1a9e5c' : '#d64545'; ctx.font = '10px sans-serif';
        ctx.fillText('偏移 ' + offPct.toFixed(1) + '%', rx, ry);
        ctx.fillStyle = offOk ? '#1a9e5c' : '#d64545'; ctx.font = 'bold 10px sans-serif';
        ctx.fillText(offOk ? 'OK' : '偏移!', rx + 90, ry);
        ry += 14;
      }
      if (cp != null) {
        var cpOk = cp >= 1.33, cpWarn = cp >= 1;
        ctx.fillStyle = cpOk ? '#1a9e5c' : cpWarn ? '#e67e22' : '#d64545'; ctx.font = '10px sans-serif';
        ctx.fillText('CP', rx, ry);
        ctx.fillStyle = '#000'; ctx.font = 'bold 10px sans-serif';
        ctx.fillText(cp.toFixed(2) + (cpOk ? ' ✓' : cpWarn ? ' ⚠' : ' ✗'), rx + 90, ry);
        ry += 14;
      }
      if (cpk != null) {
        var cpkOk = cpk >= 1.33, cpkWarn = cpk >= 1;
        ctx.fillStyle = cpkOk ? '#1a9e5c' : cpkWarn ? '#e67e22' : '#d64545'; ctx.font = '10px sans-serif';
        ctx.fillText('Cpk', rx, ry);
        ctx.fillStyle = '#000'; ctx.font = 'bold 10px sans-serif';
        ctx.fillText(cpk.toFixed(2) + (cpkOk ? ' ✓' : cpkWarn ? ' ⚠' : ' ✗'), rx + 90, ry);
      }
    }
    if (removed > 0) {
      ry += 14;
      ctx.fillStyle = '#888'; ctx.font = '9px sans-serif';
      ctx.fillText('剔除异常值 ' + removed + ' 个', rx, ry);
    }

    // Legend at bottom
    ctx.fillStyle = '#e74c3c'; ctx.font = '10px sans-serif'; ctx.textAlign = 'left';
    ctx.fillText('─ 正态拟合', pad.l + 50, H - 8);
    ctx.fillStyle = '#4dabf7'; ctx.fillRect(pad.l + 160, H - 16, 10, 10);
    ctx.fillText('数据直方图', pad.l + 175, H - 8);
  }

  // _drawOneCapability removed - replaced by _drawOneNormal
  _drawOneCapability_old(canvasId, p) {
    var vals = this.data.map(function(r) { return +r[p]; }).filter(function(v) { return !isNaN(v); });
    var n = vals.length;
    if (n < 10) return;

    var mean = vals.reduce(function(a, b) { return a + b; }, 0) / n;
    var std = Math.sqrt(vals.reduce(function(a, b) { return a + Math.pow(b - mean, 2); }, 0) / (n - 1));
    var sorted = vals.slice().sort(function(a, b) { return a - b; });

    // SPEC limits from data
    var LSL, USL;
    var product = this.data[0] && this.data[0]._Product ? this.data[0]._Product : '';
    if (product && SPEC_LIMITS[product] && SPEC_LIMITS[product][p]) {
      var spec = SPEC_LIMITS[product][p];
      LSL = spec[0]; USL = spec[1];
    }
    if (LSL == null) LSL = mean - 4 * std;
    if (USL == null) USL = mean + 4 * std;

    // Capability indices
    var Pp = (USL - LSL) / (6 * std);
    var PPL = (mean - LSL) / (3 * std);
    var PPU = (USL - mean) / (3 * std);
    var Ppk = Math.min(PPL, PPU);

    // PPM
    function normDist(x) { var t = 1 / (1 + 0.2316419 * Math.abs(x)); var d = 0.3989423 * Math.exp(-x * x / 2); return 1 - d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274)))); }
    function ppmBelow(v) { return Math.round((1 - normDist((mean - v) / std)) * 1e6); }
    function ppmAbove(v) { return Math.round((1 - normDist((v - mean) / std)) * 1e6); }

    var canvas = this.$(canvasId);
    var W = Math.max(650, canvas.parentElement.clientWidth - 30), H = 420;
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);

    var pad = { l: 250, t: 30, r: 20, b: 50 };
    var chartW = W - pad.l - pad.r, chartH = H - pad.t - pad.b;

    var bins = Math.min(45, Math.ceil(Math.sqrt(n)));
    var bw = (sorted[n - 1] - sorted[0]) / bins;
    var hist = new Array(bins).fill(0);
    vals.forEach(function(v) { var idx = Math.min(bins - 1, Math.floor((v - sorted[0]) / bw)); hist[idx]++; });
    var maxH = Math.max.apply(null, hist);

    function sx(v) { return pad.l + (v - sorted[0]) / (sorted[n - 1] - sorted[0]) * chartW; }
    function sy(v) { return pad.t + (1 - v / maxH) * chartH; }

    // Histogram bars
    hist.forEach(function(h, j) {
      var x = sx(sorted[0] + j * bw), w = Math.max(1, sx(sorted[0] + (j + 1) * bw) - x);
      ctx.fillStyle = '#4dabf7'; ctx.fillRect(x, sy(h), w, chartH - sy(h) + pad.t);
    });

    // Normal curve
    var pdf = function(x) { return n * bw * Math.exp(-0.5 * Math.pow((x - mean) / std, 2)) / (std * Math.sqrt(2 * Math.PI)); };
    ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 2;
    ctx.beginPath();
    for (var j = 0; j <= 200; j++) {
      var x = sorted[0] + (sorted[n - 1] - sorted[0]) * j / 200;
      var y = pdf(x);
      j === 0 ? ctx.moveTo(sx(x), sy(y)) : ctx.lineTo(sx(x), sy(y));
    }
    ctx.stroke();

    // SPEC lines
    if (LSL > sorted[0]) {
      ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 2; ctx.setLineDash([5, 3]);
      ctx.beginPath(); ctx.moveTo(sx(LSL), pad.t); ctx.lineTo(sx(LSL), H - pad.b); ctx.stroke();
      ctx.setLineDash([]);
    }
    if (USL < sorted[n - 1]) {
      ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 2; ctx.setLineDash([5, 3]);
      ctx.beginPath(); ctx.moveTo(sx(USL), pad.t); ctx.lineTo(sx(USL), H - pad.b); ctx.stroke();
      ctx.setLineDash([]);
    }

    // Left panel - Process Data
    function textL(y, label, value) {
      ctx.fillStyle = '#333'; ctx.font = '12px sans-serif'; ctx.textAlign = 'left';
      ctx.fillText(label, 10, y);
      ctx.fillStyle = '#000'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'right';
      ctx.fillText(value, pad.l - 10, y);
    }
    function textR(y, label, value) {
      ctx.fillStyle = '#333'; ctx.font = '12px sans-serif'; ctx.textAlign = 'left';
      ctx.fillText(label, W - 160, y);
      ctx.fillStyle = '#000'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'right';
      ctx.fillText(value, W - 15, y);
    }
    function textC(y, label, value) {
      ctx.fillStyle = '#000'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'right';
      ctx.fillText(label, W - 70, y);
      ctx.fillText(value, W - 15, y);
    }

    var ly = pad.t + 15;
    ctx.font = 'bold 13px sans-serif'; ctx.fillStyle = '#333'; ctx.textAlign = 'center';
    ctx.fillText('过程数据', pad.l / 2, ly);
    ly += 18;
    textL(ly, 'LSL', LSL.toFixed(4)); ly += 16;
    textL(ly, '目标', '*'); ly += 16;
    textL(ly, 'USL', USL.toFixed(4)); ly += 16;
    textL(ly, '样本均值', mean.toFixed(4)); ly += 16;
    textL(ly, '样本 N', String(n)); ly += 16;
    textL(ly, '标准差(整体)', std.toExponential(2)); ly += 16;

    ly += 6;
    ctx.fillStyle = '#333'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('整体能力', pad.l / 2, ly);
    ly += 18;
    textL(ly, 'Pp', Pp.toFixed(2)); ly += 16;
    textL(ly, 'PPL', PPL.toFixed(2)); ly += 16;
    textL(ly, 'PPU', PPU.toFixed(2)); ly += 16;
    textL(ly, 'Ppk', Ppk.toFixed(2)); ly += 16;

    ly += 6;
    ctx.fillStyle = '#333'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('观测性能', pad.l / 2, ly);
    ly += 18;
    textL(ly, 'PPM < LSL', vals.filter(function(v) { return v < LSL; }).length); ly += 16;
    textL(ly, 'PPM > USL', vals.filter(function(v) { return v > USL; }).length); ly += 16;
    textL(ly, '合计 PPM', vals.filter(function(v) { return v < LSL || v > USL; }).length);

    var ry = pad.t + 15;
    ctx.fillStyle = '#333'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('预期 整体 性能', W - 85, ry);
    ry += 18;
    textR(ry, 'PPM < LSL', ppmBelow(LSL).toLocaleString()); ry += 16;
    textR(ry, 'PPM > USL', ppmAbove(USL).toLocaleString()); ry += 16;
    textR(ry, '合计 PPM', (ppmBelow(LSL) + ppmAbove(USL)).toLocaleString());

    // Title
    ctx.fillStyle = '#000'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(p + ' 的过程能力报告', W / 2, pad.t - 5);
  }

  _drawStdNorm() {
    var canvas = this.$('stdNormChart');
    var W = Math.max(500, canvas.parentElement.clientWidth - 30);
    var H = 400;
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);

    var pad = { l: 70, t: 25, r: 35, b: 55 };
    var xMin = -4, xMax = 4, yMax = 0.42;
    function sx(v) { return pad.l + (v - xMin) / (xMax - xMin) * (W - pad.l - pad.r); }
    function sy(v) { return pad.t + (1 - v / yMax) * (H - pad.t - pad.b); }
    function normPDF(x) { return Math.exp(-0.5 * x * x) / Math.sqrt(2 * Math.PI); }

    // Grid
    ctx.strokeStyle = '#e8e8e8'; ctx.lineWidth = 0.5;
    for (var i = -4; i <= 4; i++) {
      var x = sx(i);
      ctx.beginPath(); ctx.moveTo(x, pad.t + 5); ctx.lineTo(x, H - pad.b - 5); ctx.stroke();
      ctx.fillStyle = '#333'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(i, x, H - pad.b + 18);
    }
    for (var i = 0; i <= 4; i++) {
      var y = pad.t + (H - pad.t - pad.b) * i / 4;
      ctx.beginPath(); ctx.moveTo(pad.l - 5, y); ctx.lineTo(W - pad.r + 5, y); ctx.stroke();
      ctx.fillStyle = '#888'; ctx.font = '10px sans-serif'; ctx.textAlign = 'right';
      ctx.fillText((yMax * (1 - i / 4)).toFixed(2), pad.l - 8, y + 4);
    }

    // σ regions fill
    [[-1, 1, 'rgba(77,171,247,0.15)'], [-2, 2, 'rgba(46,204,113,0.10)'], [-3, 3, 'rgba(243,156,18,0.06)']].forEach(function (s) {
      ctx.fillStyle = s[2];
      ctx.beginPath();
      for (var j = 0; j <= 100; j++) {
        var v = s[0] + (s[1] - s[0]) * j / 100;
        var yv = normPDF(v);
        j === 0 ? ctx.moveTo(sx(v), sy(yv)) : ctx.lineTo(sx(v), sy(yv));
      }
      ctx.lineTo(sx(s[1]), sy(0)); ctx.lineTo(sx(s[0]), sy(0)); ctx.closePath(); ctx.fill();
    });

    // Bell curve
    ctx.strokeStyle = '#333'; ctx.lineWidth = 2.5;
    ctx.beginPath();
    for (var i = 0; i <= 200; i++) {
      var v = xMin + (xMax - xMin) * i / 200;
      var yv = normPDF(v);
      i === 0 ? ctx.moveTo(sx(v), sy(yv)) : ctx.lineTo(sx(v), sy(yv));
    }
    ctx.stroke();

    // σ vertical dashed lines
    [1, -1, 2, -2].forEach(function (s) {
      var x = sx(s);
      ctx.strokeStyle = 'rgba(0,0,0,0.2)'; ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.moveTo(x, sx(0)); ctx.lineTo(x, sy(normPDF(s))); ctx.stroke();
      ctx.setLineDash([]);
    });

    // Mean line
    ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(sx(0), pad.t + 5); ctx.lineTo(sx(0), H - pad.b - 5); ctx.stroke();

    // Title
    ctx.fillStyle = '#333'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('标准正态分布  N(0,1)', W / 2, pad.t - 5);
    ctx.fillStyle = '#888'; ctx.font = '11px sans-serif';
    ctx.fillText('蓝色=±1σ (68.3%)  绿色=±2σ (95.4%)  橙色=±3σ (99.7%)', W / 2, H - 6);
  }

  // ========== 总结报告 ==========
  _renderSummary() {
    if (!this.data.length) { this.$('summaryReport').innerHTML = '<div style="color:#7a8ba0">请先导入数据</div>'; return; }
    var H = [];
    var B = [];

    // 1. 基本信息
    var products = [...new Set(this.data.map(r => r._Product).filter(Boolean))];
    var lots = [...new Set(this.data.map(r => r._Lot).filter(Boolean))].sort();
    var wafers = new Set(this.data.map(r => r._Wafer).filter(Boolean)).size;
    var total = this.data.length;
    var pass = this.binStats[1] || 0;
    var fail = total - pass;
    var yieldPct = total ? (pass/total*100) : 0;
    H.push('<h3 style="color:#4dabf7;margin:0 0 10px">📋 测试总结报告</h3>');
    H.push('<table class="vt-table" style="font-size:0.8rem"><tbody>');
    H.push('<tr><td style="width:120px">产品</td><td>' + (products.join('、') || '--') + '</td><td style="width:120px">测试日期</td><td>' + (new Date().toLocaleDateString()) + '</td></tr>');
    H.push('<tr><td>批次</td><td>' + (lots.join('、') || '--') + '</td><td>批次数量</td><td>' + lots.length + '</td></tr>');
    H.push('<tr><td>圆片数量</td><td>' + wafers + '</td><td>参数数量</td><td>' + this.params.length + '</td></tr>');
    H.push('<tr><td>测试总数</td><td>' + total.toLocaleString() + '</td><td>文件数</td><td>' + this.files.length + '</td></tr>');
    H.push('</tbody></table>');

    // 2. 良率总览卡片
    var yColor = yieldPct >= 90 ? '#2ecc71' : yieldPct >= 80 ? '#f39c12' : '#e74c3c';
    H.push('<h4 style="color:#4dabf7;margin:14px 0 6px">一、良率总览</h4>');
    H.push('<div style="display:flex;gap:10px;flex-wrap:wrap">');
    H.push('<div style="background:#1a2735;border-radius:8px;padding:12px 18px;min-width:110px;border-left:3px solid ' + yColor + '"><div style="font-size:0.7rem;color:#7a8ba0">总良率</div><div style="font-size:1.3rem;font-weight:700;color:' + yColor + '">' + yieldPct.toFixed(2) + '%</div></div>');
    H.push('<div style="background:#1a2735;border-radius:8px;padding:12px 18px;min-width:110px;border-left:3px solid #2ecc71"><div style="font-size:0.7rem;color:#7a8ba0">良品</div><div style="font-size:1.3rem;font-weight:700;color:#2ecc71">' + pass.toLocaleString() + '</div></div>');
    H.push('<div style="background:#1a2735;border-radius:8px;padding:12px 18px;min-width:110px;border-left:3px solid #e74c3c"><div style="font-size:0.7rem;color:#7a8ba0">失效</div><div style="font-size:1.3rem;font-weight:700;color:#e74c3c">' + fail.toLocaleString() + '</div></div>');
    H.push('</div>');

    // 3. BIN 分布（前8大失效）
    var bins = Object.entries(this.binStats).sort((a,b) => b[1]-a[1]);
    H.push('<h4 style="color:#4dabf7;margin:14px 0 6px">二、BIN 分布</h4>');
    H.push('<table class="vt-table" style="font-size:0.78rem"><tr><th>BIN</th><th>数量</th><th>占比</th><th>说明</th></tr>');
    bins.slice(0, 8).forEach(([b, c]) => {
      var bc = BIN_COLORS[b] || BIN_COLORS[999];
      H.push('<tr><td style="color:' + bc.color + ';font-weight:700">' + b + '</td><td>' + c.toLocaleString() + '</td><td>' + (total ? (c/total*100).toFixed(2) : 0) + '%</td><td>' + (bc.label || '') + '</td></tr>');
    });
    H.push('</table>');

    // 4. 批次对比
    H.push('<h4 style="color:#4dabf7;margin:14px 0 6px">三、批次良率对比</h4>');
    H.push('<table class="vt-table" style="font-size:0.78rem"><tr><th>批次</th><th>总数</th><th>良率</th><th>判定</th></tr>');
    var lotStats = {};
    this.data.forEach(r => { var l = r._Lot || '未知'; lotStats[l] = lotStats[l] || {n:0, p:0}; lotStats[l].n++; if (r._Bin === 1) lotStats[l].p++; });
    Object.keys(lotStats).sort().forEach(l => {
      var s = lotStats[l], y = s.n ? (s.p/s.n*100) : 0;
      var mark = y >= 90 ? '✅' : y >= 80 ? '⚠️' : '❌';
      H.push('<tr><td>' + l + '</td><td>' + s.n.toLocaleString() + '</td><td style="color:' + (y>=90?'#2ecc71':y>=80?'#f39c12':'#e74c3c') + ';font-weight:700">' + y.toFixed(2) + '%</td><td>' + mark + '</td></tr>');
    });
    H.push('</table>');

    // 5. 参数异常（超限 + Cpk<1.33）
    var prod = this.data[0] && this.data[0]._Product;
    H.push('<h4 style="color:#4dabf7;margin:14px 0 6px">四、参数异常检测</h4>');
    var issues = [];
    this.params.forEach(p => {
      var s = this.paramStats[p];
      if (!s) return;
      var spec = null;
      if (prod && SPEC_LIMITS[prod] && SPEC_LIMITS[prod][p]) spec = SPEC_LIMITS[prod][p];
      if (!spec) return;
      var loFail = 0, hiFail = 0;
      for (var ri = 0; ri < this.data.length; ri++) {
        var v2 = parseFloat(this.data[ri][p]);
        if (isNaN(v2) || Math.abs(v2) >= 9999) continue; // 跳过哨兵值
        if (v2 < spec[0]) loFail++;
        else if (v2 > spec[1]) hiFail++;
      }
      var issue = null;
      if (loFail + hiFail > 0) issue = {p: p, type: '超限', lo: loFail, hi: hiFail, cpk: s.cpk};
      else if (s.cpk != null && s.cpk < 1.33) issue = {p: p, type: 'Cpk不足', lo: 0, hi: 0, cpk: s.cpk};
      if (issue) issues.push(issue);
    });
    if (issues.length) {
      H.push('<table class="vt-table" style="font-size:0.78rem"><tr><th>参数</th><th>问题</th><th>低于LSL</th><th>高于USL</th><th>Cpk</th><th>级别</th></tr>');
      issues.sort((a,b) => (a.lo+a.hi) - (b.lo+b.hi)).reverse().slice(0, 15).forEach(it => {
        var lvl = (it.lo+it.hi) > total*0.01 || (it.cpk != null && it.cpk < 1) ? '🔴 严重' : '🟡 关注';
        H.push('<tr><td>' + it.p + '</td><td>' + it.type + '</td><td>' + it.lo + '</td><td>' + it.hi + '</td><td>' + (it.cpk!=null?it.cpk.toFixed(2):'--') + '</td><td>' + lvl + '</td></tr>');
      });
      H.push('</table>');
    } else {
      H.push('<div style="color:#2ecc71">✅ 所有参数均在规格内且 Cpk ≥ 1.33</div>');
    }

    // 6. 结论
    H.push('<h4 style="color:#4dabf7;margin:14px 0 6px">五、结论建议</h4>');
    var notes = [];
    if (yieldPct >= 90) notes.push('✅ 总良率 ' + yieldPct.toFixed(2) + '%，整体表现良好');
    else if (yieldPct >= 80) notes.push('⚠️ 总良率 ' + yieldPct.toFixed(2) + '%，建议关注主要失效BIN');
    else notes.push('❌ 总良率 ' + yieldPct.toFixed(2) + '%，偏低，需重点分析失效原因');
    var topBin = bins.find(b => b[0] !== '1');
    if (topBin) notes.push('主要失效：BIN ' + topBin[0] + '（' + (total?(topBin[1]/total*100).toFixed(2):0) + '%），请核查相关测试项');
    if (issues.length >= 3) notes.push('⚠️ 有 ' + issues.length + ' 个参数存在超限或 Cpk 不足，建议调整工艺或测试限');
    H.push('<ul style="margin:0;padding-left:20px">' + notes.map(n => '<li>' + n + '</li>').join('') + '</ul>');

    H.push('<div style="margin-top:16px;text-align:center;color:#555;font-size:0.7rem">VDMOS Tool 自动生成 · ' + new Date().toLocaleString() + '</div>');
    this.$('summaryReport').innerHTML = H.join('');
  }

  // ========== 示例数据（内嵌，跳过生成） ==========
  async _loadSample() {
    const mode = this.$('mode').value;
    if (mode === 'wafer') return this._loadSampleWafer();
    return this._loadSampleCP();
  }

  async _loadSampleCP() {
    this._showProgress('加载 CP 示例数据...'); await this._delay(40);
    this._updateProgress(10, '初始化...', ''); await this._delay(20);

    const params = 'Product,Lot,Wafer,Row,Col,CONT,IGSS0,IGSS1,IGSSR1,VTH,BVDSS1,IDSS1,RDSON1,VSD';
    const gen = (lot, failRate) => {
      let csv = [params];
      for (let d = 1; d <= 80; d++) {
        const row = Math.floor((d-1)/10)+1, col = (d-1)%10+1;
        const vals = [0.25,5e-5,5e-8,5e-8,0.72,35,5e-7,0.0025,0.5];
        let bin = 1;
        if (Math.random() < failRate) {
          const fi = Math.floor(Math.random()*9);
          vals[fi] = Math.random()>0.5 ? vals[fi]*3 : vals[fi]*0.3;
          const bm = [18,3,4,12,11,7,9,250,13]; bin = bm[fi];
        }
        csv.push(['ME58982A',lot,'W01',row,col,...vals.map(v=>v.toExponential(5))].join(','));
      }
      return csv.join('\n');
    };

    const lots = [
      {lot:'NCE2025A',fr:0.03,lbl:'良率较高'},
      {lot:'NCE2025B',fr:0.06,lbl:'正常'},
      {lot:'NCE2025C',fr:0.11,lbl:'偏低'}
    ];

    this._updateProgress(20, '生成数据...', ''); await this._delay(15);
    let allTexts = lots.map(l => ({name:l.lot, text:gen(l.lot, l.fr)}));

    this._updateProgress(30, '解析中...', ''); await this._delay(20);
    this.data=[];this.headers=[];this.params=[];this.binStats={};this.files=[];let ah=new Set();
    for(let i=0;i<allTexts.length;i++){
      const {name,text}=allTexts[i];
      this._updateProgress(30+Math.round((i+1)/allTexts.length*60),'解析 '+name+'...','');
      this._parseOne(text,name,ah);
      await this._delay(30);
    }
    this.headers=Array.from(ah);
    const meta=['product','lot','wafer','row','col','x','y','die','site','bin','result','status'];
    this.params=this.headers.filter(h=>!meta.includes(h.toLowerCase()));

    this._updateProgress(90,'统计...','');await this._delay(30);this._computeStats();
    this._updateProgress(94,'渲染图表...','');await this._delay(30);
    await loadChartJS();
    try{this._renderAll();}catch(e){this._renderFallback();}
    this._renderFileList();this._renderCompare();
    this._updateProgress(100,'完成 ✓','');await this._delay(250);this._hideProgress();
    this.$('results').classList.remove('vt-hide');
  }

  async _loadSampleWafer() {
    this._showProgress('加载晶圆汇总示例...'); await this._delay(40);
    this._updateProgress(10, '生成汇总数据...', ''); await this._delay(20);

    // 晶圆汇总格式：每行一个 Wafer 的统计
    const header = 'Product,Lot,Wafer,TotalDice,PassDice,FailDice,Yield,CONT_mean,IGSS0_mean,VTH_mean,BVDSS1_mean,RDSON1_mean,Cpk_VTH,Cpk_BVDSS1';
    const genWafer = (lot, waferNum, failRate) => {
      const total = 1500;
      const fail = Math.round(total * failRate);
      const pass = total - fail;
      return [
        'ME58982A', lot, 'W' + String(waferNum).padStart(2,'0'),
        total, pass, fail, (pass/total*100).toFixed(2),
        (0.25 + Math.random()*0.05).toFixed(4),
        (5e-5 + Math.random()*1e-5).toExponential(3),
        (0.72 + Math.random()*0.05).toFixed(3),
        (35 + Math.random()*2).toFixed(1),
        (0.0025 + Math.random()*0.0003).toFixed(5),
        (1.2 + Math.random()*0.4).toFixed(2),
        (1.1 + Math.random()*0.5).toFixed(2)
      ].join(',');
    };

    const lots = [
      {lot:'NCE2025A', wafers:25, fr:0.03},
      {lot:'NCE2025B', wafers:25, fr:0.06},
      {lot:'NCE2025C', wafers:25, fr:0.11}
    ];

    let allTexts = [];
    for (let li = 0; li < lots.length; li++) {
      const {lot, wafers, fr} = lots[li];
      this._updateProgress(15 + Math.round(li/lots.length*15), '生成 '+lot+'...', '');
      await this._delay(20);
      let csv = [header];
      for (let w = 1; w <= wafers; w++) csv.push(genWafer(lot, w, fr + (Math.random()-0.5)*0.02));
      allTexts.push({name: lot, text: csv.join('\n')});
    }

    this._updateProgress(30, '解析中...', ''); await this._delay(20);
    this.data=[];this.headers=[];this.params=[];this.binStats={};this.files=[];let ah=new Set();
    for(let i=0;i<allTexts.length;i++){
      const {name,text}=allTexts[i];
      this._updateProgress(30+Math.round((i+1)/allTexts.length*60),'解析 '+name+'...','');
      this._parseOne(text, name, ah);
      await this._delay(30);
    }
    this.headers=Array.from(ah);
    const meta=['product','lot','wafer','row','col','x','y','die','site','bin','result','status'];
    this.params=this.headers.filter(h=>!meta.includes(h.toLowerCase()));
    this._updateProgress(90,'统计...','');await this._delay(30);this._computeStats();
    this._updateProgress(94,'渲染...','');await this._delay(30);
    await loadChartJS();
    try{this._renderAll();}catch(e){this._renderFallback();}
    this._renderFileList();this._renderCompare();
    this._updateProgress(100,'完成 ✓','');await this._delay(250);this._hideProgress();
    this.$('results').classList.remove('vt-hide');
  }
}
